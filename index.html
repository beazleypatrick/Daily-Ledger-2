<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness Tracker">
<meta name="theme-color" content="#E9F2FA">
<title>Fitness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    /* Light mode, blue-based. Page sits on a soft sky tint so white cards
       lift off it; ink is deep navy rather than black. */
    --bg:#E9F2FA; --panel:#FFFFFF; --panel-hi:#DCEBF8; --line:#C3DAEC;
    --ink:#123A5A; --ink-dim:#4E7089;
    /* Yellow is the primary highlight, cyan the secondary. */
    --amber:#F5C33F; --amber-dim:#C9922A;
    --cyan:#12B3C7; --cyan-soft:#8FE1EB;
    --green:#12B3C7; --red:#C6483C;
    --shadow:0 1px 3px rgba(18,58,90,.08), 0 6px 18px rgba(18,58,90,.06);
    --mono:'DM Mono','SF Mono',Menlo,monospace;
    --serif:'Fraunces','Iowan Old Style',Palatino,Georgia,serif;
    --sans:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
    --radius:16px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(170px + env(safe-area-inset-bottom));
  }
  .wrap { max-width:960px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  h1 { font-family:var(--serif); font-size:27px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .goal-tag { font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); }

  .rail-wrap { display:flex; align-items:stretch; gap:6px; }
  .rail { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none; flex:1; scroll-behavior:smooth; }
  .rail::-webkit-scrollbar { display:none; }
  .rail-arrow, .rail-add {
    flex:0 0 auto; align-self:center; width:34px; height:60px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    font-size:18px; cursor:pointer; font-family:inherit;
  }
  .rail-arrow:active, .rail-add:active { background:var(--cyan); color:#08343A; }
  .rail-add { font-size:22px; color:#0A6C78; border-color:var(--cyan); }
  .day-card {
    flex:0 0 auto; width:82px; padding:12px 10px 10px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; cursor:pointer; text-align:left;
    color:inherit; font-family:inherit; transition:transform .12s, border-color .12s;
  }
  .day-card:active { transform:scale(.97); }
  .rail-insert {
    flex:0 0 auto; align-self:center; width:22px; height:44px; border-radius:8px;
    background:transparent; border:1px dashed var(--cyan); color:#0A6C78;
    font-size:15px; cursor:pointer; font-family:inherit; padding:0;
  }
  .rail-insert:active { background:var(--cyan); color:#08343A; }
  .day-card.future { border-style:dashed; opacity:.85; }
  .day-card.future .d { color:#0A6C78; }
  .day-card.active { background:var(--panel-hi); border-color:var(--amber); }
  .day-card .d { font-family:var(--mono); font-size:11px; color:var(--ink-dim); letter-spacing:.04em; }
  .day-card.active .d { color:var(--amber); }
  .day-card .k { font-family:var(--mono); font-size:15px; font-weight:700; margin:3px 0 6px; }
  .day-card .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  .day-card .bar>div { height:100%; }

  .tabs { display:flex; gap:6px; margin:12px 0 16px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { white-space:nowrap; }
  .tab {
    padding:9px 20px; border-radius:999px; cursor:pointer; font-size:13.5px; font-weight:700;
    background:transparent; color:var(--ink-dim); border:1px solid var(--line); font-family:inherit;
    transition:background .15s, color .15s;
  }
  .tab.active { background:var(--amber); color:#3A2C05; border-color:var(--amber); }

  .day-head { display:flex; justify-content:space-between; align-items:baseline; margin:6px 0 7px; }
  .day-title { font-family:var(--serif); font-size:20px; }
  .day-frac { font-family:var(--mono); font-size:13px; color:var(--ink-dim); }
  .progress { height:14px; background:var(--panel); border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .progress>div { height:100%; transition:width .5s cubic-bezier(.4,0,.2,1); border-radius:999px; }
  .overflow-bar { height:6px; margin-top:3px; background:var(--panel); border-radius:4px; overflow:hidden; }
  .overflow-bar>div { height:100%; background:var(--red); }

  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 16px; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px 16px; min-width:96px; flex:1 1 auto; }
  .chip .l { font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.09em; font-family:var(--mono); }
  .chip .v { font-family:var(--mono); font-size:19px; font-weight:700; margin-top:3px; }

  .meals { display:flex; flex-direction:column; gap:8px; }
  .meal {
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .meal .n { font-size:15px; line-height:1.4; }
  .meal .note { color:#0A6C78; font-size:11.5px; margin-top:3px; font-family:var(--mono); }
  .meal .k { font-family:var(--mono); font-size:15px; font-weight:700; white-space:nowrap; }
  .meal .right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .ctrls { display:flex; gap:2px; }
  .meal .del, .meal .mv {
    background:none; border:1px solid var(--line); border-radius:6px; color:var(--ink-dim);
    font-size:14px; cursor:pointer; line-height:1; padding:4px 8px; font-family:inherit;
  }
  .meal .del { color:var(--red); border-color:transparent; }
  .meal .mv:active { background:var(--cyan); color:#08343A; }
  .section-h { font-family:var(--serif); font-size:15.5px; margin:18px 0 8px; }
  .burn-tag { font-family:var(--mono); font-size:10.5px; color:#0A6C78; margin:-4px 0 4px; font-weight:500; }
  .qa-wrap { margin:4px 0 16px; display:flex; flex-direction:column; gap:6px; }
  .qa-row { display:flex; flex-wrap:wrap; gap:6px; }
  .qa {
    display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:16px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink); font-size:12.5px;
    cursor:pointer; font-family:inherit;
  }
  .qa span { font-family:var(--mono); font-size:11px; color:var(--ink-dim); }
  .qa.pin { border-color:var(--amber-dim); }
  .qa .qa-x { color:var(--red); font-size:13px; padding-left:2px; }
  .qa .qa-pin { color:#0A6C78; font-size:10.5px; font-weight:700; }
  .qa:active { background:var(--cyan); color:#08343A; }
  .chat-scroll { max-height:52vh; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .cmsg { padding:9px 13px; border-radius:12px; font-size:14px; line-height:1.45; max-width:85%; white-space:pre-wrap; }
  .cmsg.user { align-self:flex-end; background:var(--cyan); color:#08343A; font-weight:600; }
  .cmsg.assistant { align-self:flex-start; background:var(--panel-hi); border:1px solid var(--line); }
  #chat-q { flex:1; padding:12px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--ink); font-size:16px; outline:none; font-family:var(--sans); }
  #chat-q-send { padding:0 22px; border-radius:999px; cursor:pointer; background:var(--blue); color:#FFFFFF; border:1px solid var(--blue); font-weight:700; }
  #chat-q-send:disabled { background:var(--panel); color:var(--ink-dim); border-color:var(--line); }
  .loadbar { display:none; margin-bottom:8px; }
  .loadbar.on { display:block; }
  .loadbar-track { height:6px; background:var(--panel); border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .loadbar-fill {
    height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--amber));
    border-radius:5px; transition:width .3s ease;
  }
  .loadbar-label { font-family:var(--mono); font-size:11px; color:var(--blue); margin-top:5px; font-weight:500; }
  /* ===== Coach (blue scheme) ===== */
    :root { --blue:#1D6FA8; --blue-dim:#A8CCE5; --blue-deep:#F2F8FD; --blue-panel:#FFFFFF; }
  .co-box { background:var(--blue-panel); border:1px solid var(--blue-dim); border-radius:16px; padding:17px 19px; margin-bottom:16px; box-shadow:var(--shadow); }
  .co-box .t { font-family:var(--serif); font-size:16px; color:var(--blue); margin-bottom:8px; }
  .co-sub { font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); line-height:1.55; }
  .co-day { background:var(--blue-panel); border:1px solid var(--blue-dim); border-radius:16px; margin-bottom:14px; overflow:hidden; box-shadow:var(--shadow); }
  .co-day-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 18px; cursor:pointer; min-height:60px; }
  .co-day-head .n { font-family:var(--serif); font-size:17.5px; color:var(--blue); }
  .co-day-head .m { font-family:var(--mono); font-size:11px; color:var(--ink-dim); }
  .co-day-body { padding:0 12px 12px; display:none; }
  .co-day.open .co-day-body { display:block; }
  .ex-card { display:flex; gap:14px; background:var(--blue-deep); border:1px solid var(--blue-dim); border-radius:14px; padding:14px 15px; margin-bottom:10px; }
  .ex-fig { flex:0 0 88px; }
  .ex-fig svg { width:88px; height:88px; display:block; background:var(--panel); border-radius:12px; }
  .ex-info { flex:1; min-width:0; }
  .ex-name { font-size:14px; font-weight:600; color:var(--ink); }
  .ex-sets { font-family:var(--mono); font-size:11.5px; color:var(--blue); margin:2px 0 5px; }
  .ex-cues { font-size:12px; color:var(--ink-dim); line-height:1.5; margin:0; padding-left:16px; }
  .ex-prog { font-family:var(--mono); font-size:10.5px; color:var(--blue); margin-top:5px; }
  .co-btn { padding:13px 20px; border-radius:999px; cursor:pointer; font-family:var(--sans); font-size:14px; font-weight:700; min-height:46px;
    background:var(--blue); color:#FFFFFF; border:1px solid var(--blue); box-shadow:0 1px 2px rgba(18,58,90,.15); }
  .co-btn.ghost { background:transparent; color:var(--blue); box-shadow:none; }
  .co-btn:disabled { opacity:.5; }
  .bodymap { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .bodymap svg { width:170px; height:auto; flex:0 0 auto; }
  .bm-region { fill:#DCEBF8; stroke:var(--blue-dim); stroke-width:1.5; cursor:pointer; }
  .bm-region.grow { fill:var(--cyan); }
  .bm-region.trim { fill:var(--amber); }
  .bm-legend { font-size:12px; color:var(--ink-dim); line-height:1.7; min-width:150px; flex:1; }
  .bm-chip { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .co-plan-out { font-size:13.5px; line-height:1.55; color:var(--ink); white-space:pre-wrap; }
  .co-form { display:flex; gap:8px; flex-wrap:wrap; }
  .co-form label { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:.06em; }
  .co-form .f { flex:1 1 90px; }
  .co-form input { width:100%; background:var(--panel); border:1px solid var(--blue-dim); border-radius:8px; color:var(--ink); font-family:var(--mono); font-size:13px; padding:9px 10px; }
  .ex-card.ex-done { border-color:var(--blue); background:#E4F6F8; }
  .ex-card.ex-skipped { opacity:.6; border-style:dashed; }
  .ex-tick { color:#0A6C78; font-size:14px; }
  .ex-skip-tag { color:#8A6410; font-size:10.5px; font-family:var(--mono); font-weight:600; }
  .ex-hist { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); margin-top:6px; }
  .ex-log { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:flex-end; }
  .ex-log input {
    width:78px; min-height:46px; background:var(--panel); border:1px solid var(--blue-dim); border-radius:7px;
    color:var(--ink); font-family:var(--mono); font-size:16px; padding:10px 10px; text-align:center;
  }
  .co-btn.sm { padding:11px 16px; font-size:13.5px; min-height:44px; }
  .carry-row { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:7px 0; border-bottom:1px solid var(--blue-dim); font-size:13px; }
  .carry-row:last-child { border-bottom:none; }
  .carry-meta { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); white-space:nowrap; }
  .coach-chat { max-height:40vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    background:var(--blue-deep); border:1px solid var(--blue-dim); border-radius:10px; padding:10px; }
  .coach-chat .cmsg.user { background:var(--cyan); color:#08343A; }
  .coach-chat .cmsg.assistant { background:#F2F8FD; border-color:var(--blue-dim); }
  #coach-q { flex:1; padding:12px 16px; border-radius:999px; background:var(--panel);
    border:1px solid var(--blue-dim); color:var(--ink); font-size:16px; outline:none; font-family:var(--sans); }
  .unit-toggle { display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .unit-label { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-right:2px; }
  .unit-btn { padding:6px 16px; border-radius:8px; cursor:pointer; font-family:var(--mono); font-size:12px;
    font-weight:700; background:transparent; color:var(--ink-dim); border:1px solid var(--blue-dim); }
  .unit-btn.on { background:var(--cyan); color:#08343A; border-color:var(--cyan); }
  .ex-target {
    background:rgba(18,179,199,.10); border:1px solid var(--blue-dim);
    border-radius:8px; padding:9px 12px; margin:8px 0;
  }
  .ex-target.coach { background:rgba(18,179,199,.16); border-color:var(--blue); }
  .tg-head { font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--blue); margin-bottom:4px; }
  .tg-nums { font-family:var(--mono); font-size:14px; color:var(--ink-dim); line-height:1.4; }
  .tg-nums b { color:var(--ink); font-size:20px; font-weight:700; }
  .tg-x { color:var(--blue-dim); padding:0 2px; }
  .tg-why { font-size:12px; color:var(--ink-dim); font-style:italic; margin-top:4px; }
  .ex-log .lf { display:flex; flex-direction:column; gap:3px; }
  .ex-log .lf label { font-family:var(--mono); font-size:9.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; }
  .co-day-sched { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); margin-top:3px; }
  .sched-badge {
    font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; padding:5px 9px;
    border-radius:12px; white-space:nowrap; border:1px solid var(--line); color:var(--ink-dim);
  }
  .sched-badge.due { color:#0A6C78; border-color:var(--cyan); background:rgba(18,179,199,.18); font-weight:700; }
  .sched-badge.over { color:#8A6410; border-color:var(--amber-dim); background:rgba(245,195,63,.30); font-weight:700; }
  .sched-badge.rest { color:var(--ink-dim); opacity:.75; }
  .nextup {
    background:linear-gradient(135deg, rgba(18,179,199,.20), rgba(245,195,63,.14));
    border:1px solid var(--blue); border-radius:12px; padding:14px 16px; margin-bottom:14px;
  }
  .nu-l { font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--blue); }
  .nu-day { font-family:var(--serif); font-size:19px; color:var(--ink); margin:4px 0 3px; }
  .nu-when { font-family:var(--mono); font-size:12.5px; color:var(--blue); }
  .sync-banner {
    background:rgba(226,104,90,.12); border:1px solid var(--red); border-radius:10px;
    padding:12px 14px; margin-bottom:12px; font-size:13.5px; line-height:1.5; color:var(--ink);
  }
  .sync-banner b { color:var(--red); }
  .sb-detail { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); margin-top:6px; }
  .sb-x { margin-top:8px; background:none; border:1px solid var(--line); color:var(--ink-dim);
    border-radius:7px; padding:5px 12px; font-size:11.5px; cursor:pointer; font-family:var(--mono); }
  .sync-chip {
    font-family:var(--mono); font-size:10.5px; padding:5px 10px; border-radius:14px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    cursor:pointer; margin-left:8px; white-space:nowrap;
  }
  .sync-chip.ok { color:var(--green); border-color:#9FD9C4; }
  .sync-chip.busy { color:#1D6FA8; border-color:#A8CCE5; }
  .sync-chip.err { color:var(--red); border-color:#F0B3AA; background:rgba(224,108,91,.12); }
  .sync-chip.off { opacity:.55; }
  .co-box.collapsible .cb-body { display:none; }
  .co-box.collapsible.open .cb-body { display:block; }
  .co-box.collapsible .t.ch { cursor:pointer; margin-bottom:0; display:flex; justify-content:space-between; align-items:center; }
  .co-box.collapsible .caret { font-size:12px; color:var(--blue-dim); transition:transform .2s; }
  .co-box.collapsible.open .caret { transform:rotate(180deg); }
  .co-box.collapsible.open .t.ch { margin-bottom:10px; }
  .tg-verdict { font-size:9.5px; padding:3px 8px; border-radius:10px; letter-spacing:.06em; }
  .tg-verdict.up { background:var(--cyan); color:#08343A; font-weight:700; }
  .tg-verdict.same { background:var(--panel-hi); color:var(--blue); font-weight:700; }
  .tg-verdict.stuck { background:var(--amber); color:#3A2C05; font-weight:700; }
  .ex-target.stuck { border-color:var(--amber-dim); background:rgba(245,195,63,.18); }
  .tg-change { font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); margin-top:5px; }
  .tg-alts { font-size:11.5px; color:var(--amber); margin-top:5px; }
  .ex-basis { display:block; color:var(--ink-dim); font-family:var(--sans); font-size:11.5px; margin-top:3px; font-style:italic; }
  .tg-basis { font-size:11px; color:var(--ink-dim); font-style:italic; }
  .co-more {
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--ink-dim);
    text-transform:uppercase; margin:26px 0 10px; padding-top:14px; border-top:1px solid var(--line);
  }
  .coachbar {
    position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(rgba(233,242,250,0), var(--bg) 30%); z-index:5;
  }
  .coachbar .inner { max-width:960px; margin:0 auto; }
  .coach-reply {
    background:var(--panel); border:1px solid var(--blue-dim); border-radius:14px;
    padding:12px 15px; margin-bottom:8px; font-size:14px; line-height:1.5; color:var(--ink);
    max-height:34vh; overflow-y:auto; white-space:pre-wrap; box-shadow:var(--shadow); cursor:pointer;
  }
  #coach-send {
    padding:0 22px; min-height:48px; border-radius:999px; cursor:pointer; background:var(--blue);
    color:#fff; border:1px solid var(--blue); font-weight:700; font-size:14.5px; font-family:var(--sans);
  }
  #coach-send:disabled { background:var(--panel); color:var(--ink-dim); border-color:var(--line); }
  #coach-q { min-height:48px; font-size:16px; }
  .fig-key { font-family:var(--mono); font-size:10px; color:var(--ink-dim); margin:2px 4px 10px; }
  .fk { display:inline-block; width:14px; height:0; border-top:3px solid var(--blue); vertical-align:3px; margin-right:3px; }
  .fk.ghost { border-top:2.5px dashed var(--blue-dim); }
  .fk.arrow { border-top:2.5px solid var(--cyan); }
  .avg-bubble {
    background:linear-gradient(140deg, rgba(245,195,63,.30), rgba(18,179,199,.14));
    border:1px solid var(--amber-dim); border-radius:16px;
    padding:16px 18px; margin:16px 0;

<script>
"use strict";
/* ============================ constants ============================ */
const APP_VERSION = "v32";


const DEFAULT_GOAL = 1900;
const LS_DIARY = "ledger-diary-v1";
const LS_KEY   = "ledger-api-key";
const LS_GOAL  = "ledger-goal";
const LS_NOTES = "ledger-notes";
const LS_PINS  = "ledger-pins";
const LS_CHAT  = "ledger-chat";
const LS_PROFILE = "ledger-profile";
const LS_BODYMAP = "ledger-bodymap";
const LS_COACHPLAN = "ledger-coachplan";
const LS_WORKOUTS = "ledger-workouts";
const LS_COACHCHAT = "ledger-coachchat";
const LS_UNITS = "ledger-units";
const LS_TARGETS = "ledger-targets";
const LS_PLAN = "ledger-plan";
const LS_REVIVED = "ledger-revived";
const LS_GHTOKEN = "ledger-gh-token";
const LS_GISTID  = "ledger-gist-id";
const LS_SYNCAT  = "ledger-synced-at";
const LS_DELETED = "ledger-deleted";

/* ================= CLOUD SYNC (private GitHub Gist) =================
   localStorage is per-device, so phone and computer never see each other.
   This mirrors everything into one private Gist that both devices read and
   write, making the Gist the shared source of truth.
   The token is stored only in this browser and never leaves it except in
   requests to api.github.com. */
const SYNC_KEYS = [
  ["diary",   LS_DIARY],
  ["notes",   LS_NOTES],
  ["pins",    LS_PINS],
  ["goal",    LS_GOAL],
  ["units",   LS_UNITS],
  ["workouts",LS_WORKOUTS],
  ["targets", LS_TARGETS],
  ["profile", LS_PROFILE],
  ["bodymap", LS_BODYMAP],
  ["coachplan",LS_COACHPLAN],
  ["plan",    LS_PLAN],
  ["deleted", LS_DELETED],
  ["revived", LS_REVIVED],
];
const GIST_FILE = "daily-ledger.json";

/* Turn Anthropic HTTP codes into something actionable. */
/* Read the actual reason out of the response body. The old version guessed
   from the status code alone and blamed the key for everything. */
async function apiError(res) {
  let detail = "";
  try {
    const body = await res.json();
    if (body && body.error && body.error.message) detail = body.error.message;
  } catch(e) {}
  if (res.status === 401) return "Key not accepted" + (detail ? ": " + detail : "") + ". Check it in the Data tab.";
  if (res.status === 400 && /credit|balance|billing/i.test(detail)) return "Out of API credit — top up at console.anthropic.com.";
  if (res.status === 400) return detail || "Request rejected (400).";
  if (res.status === 429) return "Too many requests just now — try again in a moment.";
  if (res.status === 529 || res.status >= 500) return "Anthropic's service is busy — try again in a moment.";
  return detail || ("API error " + res.status);
}

/* Anthropic call with one automatic retry for transient failures, so a blip
   doesn't cost you your typing. */
async function callClaude(key, body) {
  const doCall = () => fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  let res;
  try { res = await doCall(); }
  catch(e) {
    await new Promise(r => setTimeout(r, 1200));
    res = await doCall();
  }
  if (!res.ok && (res.status === 429 || res.status === 529 || res.status >= 500)) {
    await new Promise(r => setTimeout(r, 1500));
    res = await doCall();
  }
  if (!res.ok) throw new Error(await apiError(res));
  return res.json();
}
function ghToken() { return localStorage.getItem(LS_GHTOKEN) || ""; }
function gistId()  { return localStorage.getItem(LS_GISTID) || ""; }

/* Bundle every synced key plus a timestamp used to resolve conflicts. */
function buildSyncPayload() {
  const out = { updatedAt: new Date().toISOString(), device: navigator.userAgent.slice(0,60) };
  SYNC_KEYS.forEach(([name, key]) => { out[name] = localStorage.getItem(key); });
  return out;
}

/* Fingerprint of the local data, so we only upload when something really
   changed. Uploading on every poll is what triggered GitHub's 403 throttle. */
function payloadFingerprint() {
  const p = buildSyncPayload();
  delete p.updatedAt; delete p.device;
  return strHash(JSON.stringify(p));
}
let lastPushedFingerprint = localStorage.getItem("ledger-last-fp") || "";
let rateLimitedUntil = 0;

async function ghFetch(url, opts) {
  if (Date.now() < rateLimitedUntil) {
    throw new Error("GitHub is rate-limiting; pausing until " + fmtTime(new Date(rateLimitedUntil)) + ".");
  }
  const res = await fetch(url, Object.assign({
    headers: {
      "Authorization": "Bearer " + ghToken(),
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
    },
  }, opts || {}));
  if (!res.ok) {
    let msg = "GitHub error " + res.status;
    if (res.status === 401) msg += " — token rejected. Check it was copied fully and has 'gist' permission.";
    if (res.status === 404) msg += " — sync file not found. Tap 'Fix sync link'.";
    if (res.status === 403 || res.status === 429) {
      /* Back off for a few minutes rather than hammering. */
      const reset = res.headers.get("x-ratelimit-reset");
      const retry = res.headers.get("retry-after");
      let waitMs = 5 * 60000;
      if (retry) waitMs = parseInt(retry,10) * 1000;
      else if (reset) waitMs = Math.max(0, parseInt(reset,10)*1000 - Date.now());
      rateLimitedUntil = Date.now() + Math.min(waitMs, 15*60000);
      msg = "GitHub is rate-limiting requests (" + res.status + "). Syncing paused until " +
            fmtTime(new Date(rateLimitedUntil)) + ". Your data is safe on this device.";
      if (/github_pat_/.test(ghToken())) {
        msg += " Note: fine-grained tokens often can't use Gists — a classic token with the 'gist' box ticked works better.";
      }
    }
    throw new Error(msg);
  }
  if (opts && opts.method === "DELETE") return {};
  return res.json();
}

/* Find this app's sync gist on the account — removes any need to copy IDs
   between devices. Both devices just need the same token. */
/* Returns every sync gist on the account, newest first. More than one means
   two devices each created their own and have been syncing in isolation. */
async function findSyncGists() {
  const list = await ghFetch("https://api.github.com/gists?per_page=100");
  return list
    .filter(g => g.files && g.files[GIST_FILE])
    .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))
    .map(g => ({ id: g.id, updated: g.updated_at }));
}
async function findSyncGist() {
  const all = await findSyncGists();
  return all.length ? all[0].id : null;
}

/* Merge every sync gist into one and delete the strays, so both devices end
   up on a single shared file. */
async function relinkSync() {
  if (!ghToken()) { showToast(null,{ok:false,text:"Add your token first."}); return; }
  setSyncStatus("Looking for sync files…");
  try {
    const all = await findSyncGists();
    if (!all.length) {
      /* Everything was deleted — start clean from this device's data. */
      localStorage.removeItem(LS_GISTID);
      lastPushedFingerprint = "";
      setSyncStatus("No sync file found — creating a fresh one from this device…");
      await syncNow();
      showToast(null,{ok:true,text:"New sync file created. Now open the app on your other device."});
      return;
    }

    /* Pull each one and merge them all into this device. */
    let dead = getDeleted();
    for (const g of all) {
      const data = await ghFetch("https://api.github.com/gists/" + g.id);
      const f = data.files && data.files[GIST_FILE];
      if (!f || !f.content) continue;
      const remote = JSON.parse(f.content);
      dead = mergeTombstones(dead, parseOr(remote.deleted, {}));
      localStorage.setItem(LS_DELETED, JSON.stringify(dead));
      const md = mergeDiaries(parseOr(localStorage.getItem(LS_DIARY), {}), parseOr(remote.diary, {}), dead);
      localStorage.setItem(LS_DIARY, JSON.stringify(md));
      const mw = mergeWorkouts(parseOr(localStorage.getItem(LS_WORKOUTS), {}), parseOr(remote.workouts, {}), dead);
      localStorage.setItem(LS_WORKOUTS, JSON.stringify(mw));
    }
    diary = loadDiary();
    selected = pickDefaultDate();

    /* Point every device at the newest file. Older strays are left in place
       rather than deleted — deletion needs broader permissions and adds
       requests, and once both devices point here they stop being written to. */
    const keep = all[0].id;
    localStorage.setItem(LS_GISTID, keep);
    lastPushedFingerprint = ""; // force one upload of the merged result
    localStorage.setItem(LS_SYNCAT, "1970-01-01T00:00:00.000Z");
    await syncNow();
    render();
    showToast(null,{ok:true,text: all.length > 1
      ? "Merged " + all.length + " sync files into one. Now tap 'Fix sync link' on your other device too."
      : "Relinked to your sync file."});
  } catch(e) {
    setSyncStatus(e.message, false);
    showToast(null,{ok:false,text:"Relink failed: " + e.message});
  }
}

/* ===== Merge =====
   Combines remote and local rather than overwriting, so it doesn't matter
   which device syncs first. */
/* ===== Item identity =====
   Every meal and exercise carries a stable id so merging can work item by
   item instead of guessing which device's copy of a day is "better".
   Deletions are recorded as tombstones so they propagate instead of being
   undone by the other device re-adding the item. */
function newId() {
  return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function strHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return Math.abs(h).toString(36);
}
/* Legacy items (logged before ids existed) get a deterministic id derived
   from their content and position, so both devices generate the SAME id for
   the same item and it doesn't duplicate on first merge. */
function legacyId(date, kind, idx, item) {
  return "L" + strHash(date + "|" + kind + "|" + idx + "|" + (item.name||"") + "|" + (item.kcal||0));
}
function ensureItemIds() {
  let changed = false;
  Object.keys(diary).forEach(d => {
    const day = diary[d];
    if (!day) return;
    ["meals","exercise"].forEach(kind => {
      (day[kind] || []).forEach((it, idx) => {
        if (!it.id) { it.id = legacyId(d, kind, idx, it); changed = true; }
      });
    });
  });
  return changed;
}

/* Tombstones: {id: isoTimestamp}. Pruned after 120 days. */
function getDeleted() {
  try { return JSON.parse(localStorage.getItem(LS_DELETED)) || {}; } catch(e) { return {}; }
}
function markDeleted(ids) {
  const t = getDeleted();
  const now = new Date().toISOString();
  (Array.isArray(ids) ? ids : [ids]).forEach(id => { if (id) t[id] = now; });
  localStorage.setItem(LS_DELETED, JSON.stringify(pruneTombstones(t)));
  queuePush();
}
/* A deletion used to be permanent, so re-creating a deleted day worked
   locally and was then undone by the old tombstone syncing back from the
   other device. Revival records carry a timestamp and outrank any tombstone
   older than themselves. */
function getRevived() {
  try { return JSON.parse(localStorage.getItem(LS_REVIVED)) || {}; } catch(e) { return {}; }
}
function markRevived(ids) {
  const r = getRevived();
  const now = new Date().toISOString();
  (Array.isArray(ids) ? ids : [ids]).forEach(id => { if (id) r[id] = now; });
  localStorage.setItem(LS_REVIVED, JSON.stringify(pruneTombstones(r)));
  /* Clear the local tombstone too so the effect is immediate. */
  const t = getDeleted();
  let changed = false;
  (Array.isArray(ids) ? ids : [ids]).forEach(id => { if (t[id]) { delete t[id]; changed = true; } });
  if (changed) localStorage.setItem(LS_DELETED, JSON.stringify(t));
  queuePush();
}
/* Tombstones that a later revival has not overridden. */
function effectiveDeleted() {
  const t = getDeleted(), r = getRevived(), out = {};
  Object.keys(t).forEach(id => {
    if (!r[id] || new Date(r[id]).getTime() <= new Date(t[id]).getTime()) out[id] = t[id];
  });
  return out;
}

function pruneTombstones(t) {
  const cutoff = Date.now() - 120*86400000;
  const out = {};
  Object.keys(t).forEach(id => { if (new Date(t[id]).getTime() > cutoff) out[id] = t[id]; });
  return out;
}
function mergeTombstones(a, b) {
  const out = Object.assign({}, a || {});
  Object.keys(b || {}).forEach(id => { if (!out[id]) out[id] = b[id]; });
  return pruneTombstones(out);
}

/* Union two item lists by id, dropping anything deleted on either device. */
function mergeItems(localList, remoteList, dead) {
  const byId = new Map();
  (localList || []).forEach(it => { if (it && it.id) byId.set(it.id, it); });
  (remoteList || []).forEach(it => { if (it && it.id && !byId.has(it.id)) byId.set(it.id, it); });
  const out = [];
  byId.forEach((it, id) => { if (!dead[id]) out.push(it); });
  return out;
}

function mergeDiaries(localD, remoteD, dead) {
  const out = {};
  const dates = new Set([...Object.keys(localD||{}), ...Object.keys(remoteD||{})]);
  dates.forEach(d => {
    const L = (localD && localD[d]) || null;
    const R = (remoteD && remoteD[d]) || null;
    const meals = mergeItems(L && L.meals, R && R.meals, dead);
    const exercise = mergeItems(L && L.exercise, R && R.exercise, dead);
    /* A day deleted wholesale is tombstoned by its date key. */
    if (dead["DAY:" + d]) return;
    /* Drop days that ended up empty and weren't explicitly kept. */
    if (!meals.length && !exercise.length && !(L && (L.weightKg != null || L.bodyFatPct != null))
        && !(R && (R.weightKg != null || R.bodyFatPct != null))) {
      /* Preserve an intentionally-empty day only if a device still lists it. */
      if (!L && !R) return;
    }
    out[d] = {
      meals: meals,
      exercise: exercise,
      weightKg: (L && L.weightKg != null) ? L.weightKg : (R ? R.weightKg : null),
      bodyFatPct: (L && L.bodyFatPct != null) ? L.bodyFatPct : (R ? R.bodyFatPct : null),
    };
  });
  return out;
}
function mergeWorkouts(localW, remoteW, dead) {
  const out = {};
  dead = dead || {};
  const names = new Set([...Object.keys(localW||{}), ...Object.keys(remoteW||{})]);
  names.forEach(n => {
    const seen = new Set();
    const combined = [];
    [...((localW||{})[n]||[]), ...((remoteW||{})[n]||[])].forEach(s => {
      /* Sets get a deterministic signature so the same set logged once isn't
         duplicated, and a removed set stays removed. */
      const sig = s.id || ("W" + strHash(n + "|" + [s.date,s.weight,s.unit,s.reps,s.sets,s.done].join("|")));
      if (seen.has(sig) || dead[sig]) return;
      seen.add(sig);
      s.id = sig;
      combined.push(s);
    });
    combined.sort((a,b) => (a.date||"").localeCompare(b.date||""));
    if (combined.length) out[n] = combined;
  });
  return out;
}
function parseOr(str, fallback) {
  try { return str ? JSON.parse(str) : fallback; } catch(e) { return fallback; }
}

/* Merge a remote payload into this device, then return the merged bundle. */
function mergeIntoLocal(remote) {
  const remoteAt = remote.updatedAt ? new Date(remote.updatedAt).getTime() : 0;
  const localAt = localStorage.getItem(LS_SYNCAT) ? new Date(localStorage.getItem(LS_SYNCAT)).getTime() : 0;
  const remoteNewer = remoteAt > localAt;

  /* Deletions from either device combine, so a removal on the phone isn't
     resurrected by the computer still holding the item. */
  const allDead = mergeTombstones(getDeleted(), parseOr(remote.deleted, {}));
  localStorage.setItem(LS_DELETED, JSON.stringify(allDead));
  /* Revivals merge keeping the LATER timestamp, so bringing a day back wins
     over an older deletion no matter which device did which. */
  const localRev = getRevived(), remoteRev = parseOr(remote.revived, {});
  const rev = Object.assign({}, localRev);
  Object.keys(remoteRev).forEach(id => {
    if (!rev[id] || new Date(remoteRev[id]) > new Date(rev[id])) rev[id] = remoteRev[id];
  });
  localStorage.setItem(LS_REVIVED, JSON.stringify(pruneTombstones(rev)));
  const dead = effectiveDeleted();

  /* Diary and workouts merge item-by-item so nothing is lost either way. */
  const mergedDiary = mergeDiaries(parseOr(localStorage.getItem(LS_DIARY), {}), parseOr(remote.diary, {}), dead);
  localStorage.setItem(LS_DIARY, JSON.stringify(mergedDiary));
  const mergedW = mergeWorkouts(parseOr(localStorage.getItem(LS_WORKOUTS), {}), parseOr(remote.workouts, {}), dead);
  localStorage.setItem(LS_WORKOUTS, JSON.stringify(mergedW));

  /* Single-value settings: newer side wins. */
  [["goal",LS_GOAL],["units",LS_UNITS],["profile",LS_PROFILE],["bodymap",LS_BODYMAP],
   ["targets",LS_TARGETS],["pins",LS_PINS],["coachplan",LS_COACHPLAN],["plan",LS_PLAN]].forEach(([name,key]) => {
    if (remoteNewer && typeof remote[name] === "string") localStorage.setItem(key, remote[name]);
  });
  /* Notes: keep the longer text rather than silently dropping writing. */
  const localNotes = localStorage.getItem(LS_NOTES) || "";
  const remoteNotes = typeof remote.notes === "string" ? remote.notes : "";
  if (remoteNotes && remoteNotes !== localNotes) {
    localStorage.setItem(LS_NOTES, remoteNotes.length >= localNotes.length ? remoteNotes : localNotes);
  }

  diary = loadDiary();
  selected = pickDefaultDate();
  PLAN_CACHE = null; // a plan change from the other device must take effect
  return { days: Object.keys(mergedDiary).length };
}

/* ===== The one button =====
   Ensures a gist exists (finding or creating it), merges both sides, uploads
   the result. Safe to tap on either device, in any order. */
let syncing = false;
async function syncNow(silent) {
  if (syncing) return false;
  if (!ghToken()) {
    setSyncStatus("Add your GitHub token first (one-time setup below).", false);
    return false;
  }
  syncing = true;
  const btn = document.getElementById("sync-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Syncing…"; }
  setSyncChip("busy", "⟳ syncing…");
  try {
    /* 1. Locate the shared gist, or make one on first run. */
    let id = gistId();
    if (!id) {
      setSyncStatus("Looking for your sync file…");
      id = await findSyncGist();
      if (!id) {
        setSyncStatus("First device — creating your private sync file…");
        const created = await ghFetch("https://api.github.com/gists", {
          method: "POST",
          body: JSON.stringify({
            description: "The Daily Ledger — private data sync (do not share)",
            public: false,
            files: { [GIST_FILE]: { content: JSON.stringify(buildSyncPayload(), null, 1) } },
          }),
        });
        id = created.id;
      }
      localStorage.setItem(LS_GISTID, id);
    }

    /* 2. Pull remote and merge into local. */
    setSyncStatus("Merging…");
    const fpBefore = payloadFingerprint();
    try {
      const data = await ghFetch("https://api.github.com/gists/" + id);
      const f = data.files && data.files[GIST_FILE];
      if (f && f.content) {
        const remote = JSON.parse(f.content);
        mergeIntoLocal(remote);
      }
    } catch(e) {
      if (/404/.test(e.message)) {
        /* The stored file was deleted. Find another, or make a fresh one,
           rather than failing forever. */
        setSyncStatus("Sync file was missing — reconnecting…");
        localStorage.removeItem(LS_GISTID);
        id = await findSyncGist();
        if (id) {
          localStorage.setItem(LS_GISTID, id);
          const data2 = await ghFetch("https://api.github.com/gists/" + id);
          const f2 = data2.files && data2.files[GIST_FILE];
          if (f2 && f2.content) mergeIntoLocal(JSON.parse(f2.content));
        } else {
          const created = await ghFetch("https://api.github.com/gists", {
            method: "POST",
            body: JSON.stringify({
              description: "The Daily Ledger — private data sync (do not share)",
              public: false,
              files: { [GIST_FILE]: { content: JSON.stringify(buildSyncPayload(), null, 1) } },
            }),
          });
          id = created.id;
          localStorage.setItem(LS_GISTID, id);
          lastPushedFingerprint = payloadFingerprint();
        }
      } else {
        throw e;
      }
    }

    /* 3. Push the merged result back up — but only if something changed.
       Uploading unchanged data on every poll is what got us throttled. */
    const fp = payloadFingerprint();
    if (fp !== lastPushedFingerprint) {
      setSyncStatus("Uploading…");
      await ghFetch("https://api.github.com/gists/" + id, {
        method: "PATCH",
        body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(buildSyncPayload(), null, 1) } } }),
      });
      lastPushedFingerprint = fp;
      localStorage.setItem("ledger-last-fp", fp);
    }

    localStorage.setItem(LS_SYNCAT, new Date().toISOString());
    /* Re-rendering on every sync was collapsing menus and jumping to the top
       each time the phone locked. Only redraw when something really changed. */
    if (payloadFingerprint() !== fpBefore) {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      render();
      window.scrollTo(0, y);
    }
    clearSyncBanner();
    const c = syncCounts();
    refreshSyncChip();
    setSyncStatus("Synced at " + fmtTime(new Date()) + " — " + c.days + " days, " + c.sets + " logged sets.", true);
    if (!silent) showToast(null, {ok:true, text:"Synced — " + c.days + " days and " + c.sets + " sets now on both devices."});
    return true;
  } catch(e) {
    setSyncStatus(e.message, false);
    setSyncChip("err", "⚠ sync failed");
    showSyncBanner(e.message);
    return false;
  } finally {
    syncing = false;
    const b = document.getElementById("sync-btn");
    if (b) { b.disabled = false; b.textContent = "⟳ Sync now"; }
    renderData();
  }
}

/* Debounced auto-push whenever data changes. */
let pushTimer = null;
function queuePush() {
  if (!ghToken()) return;
  setSyncChip("busy", "⟳ pending…");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => syncNow(true), 1200);
}
/* The header chip makes sync state visible from every tab — background
   failures used to be invisible unless you happened to be on the Data tab. */
/* A persistent, readable explanation on the main screen — the red chip alone
   didn't say what to actually do about it. */
function showSyncBanner(msg) {
  let el = document.getElementById("sync-banner");
  if (!el) {
    el = document.createElement("div");
    el.id = "sync-banner";
    el.className = "sync-banner";
    const wrap = document.querySelector(".wrap");
    if (wrap) wrap.insertBefore(el, wrap.children[1] || null);
  }
  let advice;
  if (/403|rate.?limit/i.test(msg)) {
    advice = /github_pat_/.test(ghToken())
      ? "Your token starts with github_pat_ — that type cannot use sync. You need a CLASSIC token (starts ghp_)."
      : "GitHub is throttling requests. It clears itself and nothing is lost. If it persists, tap 'Test token' in the Data tab.";
  } else if (/401|rejected/i.test(msg)) {
    advice = "Your GitHub token was rejected. Make a new classic token with 'gist' ticked, then paste it in the Data tab.";
  } else if (/404|not found/i.test(msg)) {
    advice = "Sync file missing. Tap 'Fix sync link' in the Data tab.";
  } else {
    advice = "Tap 'Test token' in the Data tab to find out why.";
  }
  el.innerHTML = '<b>Sync isn\u2019t working.</b> ' + esc(advice) +
    '<div class="sb-detail">' + esc(msg) + '</div>' +
    '<button class="sb-x" onclick="clearSyncBanner()">Dismiss</button>';

}
function clearSyncBanner() {
  const el = document.getElementById("sync-banner");
  if (el) el.remove();
}

function setSyncChip(state, text) {
  const el = document.getElementById("sync-chip");
  if (!el) return;
  el.className = "sync-chip " + (state || "");
  el.textContent = text;
}
function syncCounts() {
  const w = getWorkouts();
  const sets = Object.values(w).reduce((s,arr)=>s+arr.filter(x=>x.done).length,0);
  return { days: Object.keys(diary).length, sets };
}
function refreshSyncChip() {
  if (!ghToken()) { setSyncChip("off", "sync off"); return; }
  if (Date.now() < rateLimitedUntil) {
    setSyncChip("err", "⏸ paused till " + fmtTime(new Date(rateLimitedUntil)));
    return;
  }
  const at = localStorage.getItem(LS_SYNCAT);
  const c = syncCounts();

}
function setSyncStatus(msg, ok) {
  const el = document.getElementById("sync-status");
  if (el) { el.textContent = msg; el.style.color = ok === true ? "var(--green)" : ok === false ? "var(--red)" : "var(--ink-dim)"; }
}

/* Tests the token directly against GitHub and explains, in plain language,
   exactly what is wrong. Reads the scopes header so we can tell a missing
   'gist' permission from a bad token from a wrong token type. */
async function testToken() {
  const out = document.getElementById("sync-diag");
  const t = ghToken();
  if (out) out.style.display = "block";
  const say = (s) => { if (out) out.textContent = s; };
  if (!t) { say("No token saved on this device. Paste one in the box above and tap Save token."); return; }
  say("Testing token with GitHub…");
  try {
    const res = await fetch("https://api.github.com/user", {
      headers: { "Authorization": "Bearer " + t, "Accept": "application/vnd.github+json" },
    });
    const scopes = res.headers.get("x-oauth-scopes");
    if (res.status === 401) {
      say("RESULT: GitHub rejected this token (401).\n\nIt is expired, mistyped, or was only partly copied.\nFix: make a NEW classic token and paste the whole thing.\ngithub.com > Settings > Developer settings > Personal access tokens > Tokens (classic) > Generate new token (classic) > tick 'gist'.");
      return;
    }
    if (res.status === 403) {
      say("RESULT: GitHub refused the request (403).\n\nUsually one of:\n1. This is a FINE-GRAINED token (starts github_pat_). Those cannot use Gists. You need a CLASSIC token (starts ghp_).\n2. Rate limit still cooling off — wait 10 minutes and retry.\n\nYour token starts: " + t.slice(0, 11) + "...");
      return;
    }
    if (!res.ok) { say("RESULT: GitHub returned " + res.status + ". Try again shortly."); return; }
    const user = await res.json();

    /* Classic tokens report scopes; fine-grained ones return an empty header. */
    let verdict = "Account: " + user.login + "\nToken type: " + (/^ghp_/.test(t) ? "classic" : /^github_pat_/.test(t) ? "FINE-GRAINED" : "unknown") + "\n";
    if (scopes === null || scopes === "") {
      verdict += "Permissions: none reported.\n\nThis is the fine-grained token problem — GitHub's Gists API only works with CLASSIC tokens.\nFix: create a classic token with the 'gist' box ticked, then paste it here.";
      say(verdict); return;
    }
    verdict += "Permissions: " + scopes + "\n";
    if (!/\bgist\b/.test(scopes)) {
      verdict += "\nPROBLEM: the 'gist' permission is missing. Sync cannot work.\nFix: create a new classic token and tick the 'gist' checkbox.";
      say(verdict); return;
    }
    /* Token is good — confirm the Gists API actually answers. */
    const g = await fetch("https://api.github.com/gists?per_page=1", {
      headers: { "Authorization": "Bearer " + t, "Accept": "application/vnd.github+json" },
    });
    if (!g.ok) {
      verdict += "\nToken looks right, but the Gists API returned " + g.status + ".";
      if (g.status === 403) verdict += " That is a rate limit — wait 10 minutes.";
      say(verdict); return;
    }
    verdict += "\nOK: token is valid and can use Gists. Tap 'Sync now'.";
    say(verdict);
  } catch(e) {
    say("Could not reach GitHub: " + e.message + "\n\nCheck the device is online.");
  }
}

function saveGhToken() {
  const t = document.getElementById("gh-token").value.trim();
  if (!t) {
    localStorage.removeItem(LS_GHTOKEN);

    return;
