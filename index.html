<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Ledger">
<meta name="theme-color" content="#14201B">
<title>The Daily Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#14201B; --panel:#1C2B24; --panel-hi:#24362D; --line:#31463B;
    --ink:#EDE7D8; --ink-dim:#9DAF9F; --amber:#E8A33D; --amber-dim:#8A6B34;
    --green:#7FC97F; --red:#E06C5B;
    --mono:'SF Mono','JetBrains Mono',Menlo,monospace;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --sans:'Avenir Next','Segoe UI',system-ui,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(170px + env(safe-area-inset-bottom));
  }
  .wrap { max-width:960px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  h1 { font-family:var(--serif); font-size:24px; font-weight:600; margin:0; letter-spacing:.01em; }
  .goal-tag { font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); }

  .rail-wrap { display:flex; align-items:stretch; gap:6px; }
  .rail { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none; flex:1; scroll-behavior:smooth; }
  .rail::-webkit-scrollbar { display:none; }
  .rail-arrow, .rail-add {
    flex:0 0 auto; align-self:center; width:34px; height:60px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    font-size:18px; cursor:pointer; font-family:inherit;
  }
  .rail-arrow:active, .rail-add:active { background:var(--amber); color:var(--bg); }
  .rail-add { font-size:22px; color:var(--amber); border-color:var(--amber-dim); }
  .day-card {
    flex:0 0 auto; width:76px; padding:10px 8px 8px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; cursor:pointer; text-align:left;
    color:inherit; font-family:inherit;
  }
  .rail-insert {
    flex:0 0 auto; align-self:center; width:22px; height:44px; border-radius:8px;
    background:transparent; border:1px dashed var(--amber-dim); color:var(--amber);
    font-size:15px; cursor:pointer; font-family:inherit; padding:0;
  }
  .rail-insert:active { background:var(--amber); color:var(--bg); }
  .day-card.future { border-style:dashed; opacity:.85; }
  .day-card.future .d { color:var(--amber); }
  .day-card.active { background:var(--panel-hi); border-color:var(--amber); }
  .day-card .d { font-family:var(--mono); font-size:11px; color:var(--ink-dim); letter-spacing:.04em; }
  .day-card.active .d { color:var(--amber); }
  .day-card .k { font-family:var(--mono); font-size:15px; font-weight:700; margin:3px 0 6px; }
  .day-card .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  .day-card .bar>div { height:100%; }

  .tabs { display:flex; gap:6px; margin:12px 0 16px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { white-space:nowrap; }
  .tab {
    padding:7px 20px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600;
    background:transparent; color:var(--ink-dim); border:1px solid var(--line); font-family:inherit;
  }
  .tab.active { background:var(--panel-hi); color:var(--ink); border-color:var(--amber); }

  .day-head { display:flex; justify-content:space-between; align-items:baseline; margin:6px 0 7px; }
  .day-title { font-family:var(--serif); font-size:20px; }
  .day-frac { font-family:var(--mono); font-size:13px; color:var(--ink-dim); }
  .progress { height:12px; background:var(--panel); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .progress>div { height:100%; transition:width .4s; }
  .overflow-bar { height:6px; margin-top:3px; background:var(--panel); border-radius:4px; overflow:hidden; }
  .overflow-bar>div { height:100%; background:var(--red); }

  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 16px; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:90px; flex:1 1 auto; }
  .chip .l { font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.09em; font-family:var(--mono); }
  .chip .v { font-family:var(--mono); font-size:19px; font-weight:700; margin-top:3px; }

  .meals { display:flex; flex-direction:column; gap:8px; }
  .meal {
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 14px;
  }
  .meal .n { font-size:14.5px; line-height:1.35; }
  .meal .note { color:var(--amber); font-size:11.5px; margin-top:3px; font-family:var(--mono); }
  .meal .k { font-family:var(--mono); font-size:15px; font-weight:700; white-space:nowrap; }
  .meal .right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .ctrls { display:flex; gap:2px; }
  .meal .del, .meal .mv {
    background:none; border:1px solid var(--line); border-radius:6px; color:var(--ink-dim);
    font-size:14px; cursor:pointer; line-height:1; padding:4px 8px; font-family:inherit;
  }
  .meal .del { color:var(--red); border-color:transparent; }
  .meal .mv:active { background:var(--amber); color:var(--bg); }
  .section-h { font-family:var(--serif); font-size:15.5px; margin:18px 0 8px; }
  .burn-tag { font-family:var(--mono); font-size:10.5px; color:var(--amber); margin:-4px 0 4px; }
  .qa-wrap { margin:4px 0 16px; display:flex; flex-direction:column; gap:6px; }
  .qa-row { display:flex; flex-wrap:wrap; gap:6px; }
  .qa {
    display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:16px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink); font-size:12.5px;
    cursor:pointer; font-family:inherit;
  }
  .qa span { font-family:var(--mono); font-size:11px; color:var(--ink-dim); }
  .qa.pin { border-color:var(--amber-dim); }
  .qa .qa-x { color:var(--red); font-size:13px; padding-left:2px; }
  .qa .qa-pin { color:var(--amber); font-size:10.5px; }
  .qa:active { background:var(--amber); color:var(--bg); }
  .chat-scroll { max-height:52vh; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .cmsg { padding:9px 13px; border-radius:12px; font-size:14px; line-height:1.45; max-width:85%; white-space:pre-wrap; }
  .cmsg.user { align-self:flex-end; background:var(--amber-dim); color:var(--ink); }
  .cmsg.assistant { align-self:flex-start; background:var(--panel-hi); border:1px solid var(--line); }
  #chat-q { flex:1; padding:12px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--ink); font-size:16px; outline:none; font-family:var(--sans); }
  #chat-q-send { padding:0 20px; border-radius:12px; cursor:pointer; background:var(--amber); color:var(--bg); border:1px solid var(--amber); font-weight:700; }
  #chat-q-send:disabled { background:var(--panel); color:var(--ink-dim); border-color:var(--line); }
  .loadbar { display:none; margin-bottom:8px; }
  .loadbar.on { display:block; }
  .loadbar-track { height:6px; background:var(--panel); border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .loadbar-fill {
    height:100%; width:0%; background:linear-gradient(90deg,var(--amber-dim),var(--amber));
    border-radius:5px; transition:width .3s ease;
  }
  .loadbar-label { font-family:var(--mono); font-size:11px; color:var(--amber); margin-top:5px; }
  /* ===== Coach (blue scheme) ===== */
  :root { --blue:#5FA8E8; --blue-dim:#2E5A80; --blue-deep:#1A2E40; --blue-panel:#1B2836; }
  .co-box { background:var(--blue-panel); border:1px solid var(--blue-dim); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .co-box .t { font-family:var(--serif); font-size:16px; color:var(--blue); margin-bottom:8px; }
  .co-sub { font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); line-height:1.55; }
  .co-day { background:var(--blue-panel); border:1px solid var(--blue-dim); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .co-day-head { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; cursor:pointer; }
  .co-day-head .n { font-family:var(--serif); font-size:15.5px; color:var(--blue); }
  .co-day-head .m { font-family:var(--mono); font-size:11px; color:var(--ink-dim); }
  .co-day-body { padding:0 12px 12px; display:none; }
  .co-day.open .co-day-body { display:block; }
  .ex-card { display:flex; gap:12px; background:var(--blue-deep); border:1px solid var(--blue-dim); border-radius:10px; padding:11px 12px; margin-bottom:8px; }
  .ex-fig { flex:0 0 74px; }
  .ex-fig svg { width:74px; height:74px; display:block; }
  .ex-info { flex:1; min-width:0; }
  .ex-name { font-size:14px; font-weight:600; color:var(--ink); }
  .ex-sets { font-family:var(--mono); font-size:11.5px; color:var(--blue); margin:2px 0 5px; }
  .ex-cues { font-size:12px; color:var(--ink-dim); line-height:1.5; margin:0; padding-left:16px; }
  .ex-prog { font-family:var(--mono); font-size:10.5px; color:var(--blue); margin-top:5px; }
  .co-btn { padding:8px 16px; border-radius:9px; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:600;
    background:var(--blue); color:var(--blue-deep); border:1px solid var(--blue); }
  .co-btn.ghost { background:transparent; color:var(--blue); }
  .co-btn:disabled { opacity:.5; }
  .bodymap { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .bodymap svg { width:170px; height:auto; flex:0 0 auto; }
  .bm-region { fill:#24384C; stroke:var(--blue-dim); stroke-width:1.5; cursor:pointer; }
  .bm-region.grow { fill:var(--blue); }
  .bm-region.trim { fill:var(--amber); }
  .bm-legend { font-size:12px; color:var(--ink-dim); line-height:1.7; min-width:150px; flex:1; }
  .bm-chip { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .co-plan-out { font-size:13.5px; line-height:1.55; color:var(--ink); white-space:pre-wrap; }
  .co-form { display:flex; gap:8px; flex-wrap:wrap; }
  .co-form label { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:.06em; }
  .co-form .f { flex:1 1 90px; }
  .co-form input { width:100%; background:var(--bg); border:1px solid var(--blue-dim); border-radius:8px; color:var(--ink); font-family:var(--mono); font-size:13px; padding:9px 10px; }
  .ex-card.ex-done { border-color:var(--blue); background:#1E3346; }
  .ex-card.ex-skipped { opacity:.6; border-style:dashed; }
  .ex-tick { color:var(--blue); font-size:13px; }
  .ex-skip-tag { color:var(--amber); font-size:10.5px; font-family:var(--mono); }
  .ex-hist { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); margin-top:6px; }
  .ex-log { display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; align-items:center; }
  .ex-log input {
    width:62px; background:var(--bg); border:1px solid var(--blue-dim); border-radius:7px;
    color:var(--ink); font-family:var(--mono); font-size:13px; padding:7px 8px;
  }
  .co-btn.sm { padding:6px 11px; font-size:11px; }
  .carry-row { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:7px 0; border-bottom:1px solid var(--blue-dim); font-size:13px; }
  .carry-row:last-child { border-bottom:none; }
  .carry-meta { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); white-space:nowrap; }
  .coach-chat { max-height:40vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    background:var(--blue-deep); border:1px solid var(--blue-dim); border-radius:10px; padding:10px; }
  .coach-chat .cmsg.user { background:var(--blue-dim); }
  .coach-chat .cmsg.assistant { background:#1F3243; border-color:var(--blue-dim); }
  #coach-q { flex:1; padding:11px 14px; border-radius:10px; background:var(--bg);
    border:1px solid var(--blue-dim); color:var(--ink); font-size:16px; outline:none; font-family:var(--sans); }
  .unit-toggle { display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .unit-label { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-right:2px; }
  .unit-btn { padding:6px 16px; border-radius:8px; cursor:pointer; font-family:var(--mono); font-size:12px;
    font-weight:700; background:transparent; color:var(--ink-dim); border:1px solid var(--blue-dim); }
  .unit-btn.on { background:var(--blue); color:var(--blue-deep); border-color:var(--blue); }
  .ex-target {
    font-family:var(--mono); font-size:11.5px; color:var(--ink-dim);
    background:rgba(95,168,232,.09); border-left:2px solid var(--blue-dim);
    border-radius:4px; padding:5px 8px; margin:5px 0 6px;
  }
  .ex-target.coach { color:var(--blue); border-left-color:var(--blue); background:rgba(95,168,232,.16); }
  .ex-target b { color:var(--ink); font-size:12.5px; }
  .ex-why { color:var(--ink-dim); font-style:italic; }
  .avg-bubble {
    background:var(--panel-hi); border:1px solid var(--amber-dim); border-radius:12px;
    padding:13px 16px; margin:14px 0;
  }
  .avg-l { font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; }
  .avg-v { font-family:var(--mono); font-size:26px; font-weight:700; color:var(--amber); margin:3px 0 2px; }
  .avg-v span { font-size:13px; font-weight:400; color:var(--ink-dim); }
  .avg-sub { font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); }
  #notes-box { min-height:300px; font-family:var(--sans); font-size:14.5px; line-height:1.5; }
  .empty { color:var(--ink-dim); font-style:italic; padding:18px 4px; font-family:var(--serif); }

  .win-btns { display:flex; gap:6px; margin-bottom:14px; }
  .win {
    padding:6px 14px; border-radius:8px; cursor:pointer; font-family:var(--mono);
    font-size:12.5px; font-weight:600; background:var(--panel); color:var(--ink-dim);
    border:1px solid var(--line);
  }
  .win.active { background:var(--amber); color:var(--bg); border-color:var(--amber); }
  .chart-box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 10px 10px; margin-bottom:14px; }
  .chart-box .t { font-family:var(--serif); font-size:15.5px; margin:0 6px 10px; }
  .chart-box canvas { max-height:190px; }
  .chart-empty { color:var(--ink-dim); font-style:italic; font-family:var(--serif); font-size:14px; text-align:center; padding:40px 0; }

  .panel-box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .panel-box .t { font-family:var(--serif); font-size:15.5px; margin-bottom:8px; }
  .kv { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); }
  .kv span { font-family:var(--mono); font-size:12px; }
  .kv .l { color:var(--ink-dim); }
  .btn {
    padding:7px 14px; border-radius:8px; cursor:pointer; font-family:var(--mono);
    font-size:12px; font-weight:600; background:var(--panel); color:var(--ink-dim);
    border:1px solid var(--line);
  }
  .btn.primary { background:var(--amber); color:var(--bg); border-color:var(--amber); }
  .btn.danger { color:var(--red); border-color:var(--red); }
  .btn-row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  textarea, input[type=password], input[type=text] {
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-family:var(--mono); font-size:12px; padding:10px;
  }
  textarea { min-height:110px; resize:vertical; }
  pre.raw {
    font-family:var(--mono); font-size:11px; color:var(--ink-dim); white-space:pre-wrap;
    word-break:break-word; max-height:300px; overflow-y:auto; margin:0;
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px;
  }
  .hint { font-size:12px; color:var(--ink-dim); line-height:1.5; margin-top:8px; }

  .chatbar {
    position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, var(--bg) 22%);
  }
  .chatbar .inner { max-width:960px; margin:0 auto; }
  .toast {
    background:var(--panel-hi); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; margin-bottom:8px; font-size:13px; line-height:1.45; display:none;
    position:relative; cursor:pointer;
  }
  .toast .x { position:absolute; top:6px; right:10px; color:var(--ink-dim); font-size:14px; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .opt {
    padding:7px 13px; border-radius:16px; cursor:pointer; font-size:12.5px; font-weight:600;
    background:var(--panel); color:var(--amber); border:1px solid var(--amber-dim); font-family:inherit;
  }
  .opt:active { background:var(--amber); color:var(--bg); }
  .toast .status { font-family:var(--mono); font-size:11.5px; margin-top:6px; }
  .toast .status.ok { color:var(--green); }
  .toast .status.bad { color:var(--red); }
  .row { display:flex; gap:8px; }
  #chat-input {
    flex:1; padding:12px 16px; border-radius:12px; background:var(--panel);
    border:1px solid var(--line); color:var(--ink); font-size:16px; outline:none; font-family:var(--sans);
  }
  #chat-send {
    padding:0 20px; border-radius:12px; cursor:pointer; background:var(--amber);
    color:var(--bg); border:1px solid var(--amber); font-weight:700; font-size:14px;
  }
  #chat-send:disabled { background:var(--panel); color:var(--ink-dim); border-color:var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Daily Ledger</h1>
    <span class="goal-tag">goal <span id="goal-label"></span> kcal</span>
  </header>
  <div class="rail-wrap">
    <button class="rail-arrow" onclick="scrollRail(-1)" title="Scroll left">‹</button>
    <div class="rail" id="rail"></div>
    <button class="rail-arrow" onclick="scrollRail(1)" title="Scroll right">›</button>
    <button class="rail-add" onclick="addFutureDay()" title="Add a day">+</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="log">Log</button>
    <button class="tab" data-tab="trends">Trends</button>
    <button class="tab" data-tab="coach">Coach</button>
    <button class="tab" data-tab="chat">Chat</button>
    <button class="tab" data-tab="notes">Notes</button>
    <button class="tab" data-tab="data">Data</button>
  </div>
  <div id="view-log"></div>
  <div id="view-trends" style="display:none"></div>
  <div id="view-coach" style="display:none"></div>
  <div id="view-chat" style="display:none"></div>
  <div id="view-notes" style="display:none"></div>
  <div id="view-data" style="display:none"></div>
</div>

<div class="chatbar">
  <div class="inner">
    <div class="toast" id="toast">
      <span class="x">✕</span>
      <div id="toast-reply"></div>
      <div class="opts" id="toast-opts"></div>
      <div class="status" id="toast-status"></div>
    </div>
    <div class="loadbar" id="loadbar">
      <div class="loadbar-track"><div class="loadbar-fill" id="loadbar-fill"></div></div>
      <div class="loadbar-label" id="loadbar-label">Thinking…</div>
    </div>
    <div class="row">
      <input id="chat-input" placeholder="Tell the ledger what you ate…" autocomplete="off">
      <button id="chat-send">Log</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================ constants ============================ */
const DEFAULT_GOAL = 1900;
const LS_DIARY = "ledger-diary-v1";
const LS_KEY   = "ledger-api-key";
const LS_GOAL  = "ledger-goal";
const LS_NOTES = "ledger-notes";
const LS_PINS  = "ledger-pins";
const LS_CHAT  = "ledger-chat";
const LS_PROFILE = "ledger-profile";
const LS_BODYMAP = "ledger-bodymap";
const LS_COACHPLAN = "ledger-coachplan";
const LS_WORKOUTS = "ledger-workouts";
const LS_COACHCHAT = "ledger-coachchat";
const LS_UNITS = "ledger-units";
const LS_TARGETS = "ledger-targets";
const LS_GHTOKEN = "ledger-gh-token";
const LS_GISTID  = "ledger-gist-id";
const LS_SYNCAT  = "ledger-synced-at";

/* ================= CLOUD SYNC (private GitHub Gist) =================
   localStorage is per-device, so phone and computer never see each other.
   This mirrors everything into one private Gist that both devices read and
   write, making the Gist the shared source of truth.
   The token is stored only in this browser and never leaves it except in
   requests to api.github.com. */
const SYNC_KEYS = [
  ["diary",   LS_DIARY],
  ["notes",   LS_NOTES],
  ["pins",    LS_PINS],
  ["goal",    LS_GOAL],
  ["units",   LS_UNITS],
  ["workouts",LS_WORKOUTS],
  ["targets", LS_TARGETS],
  ["profile", LS_PROFILE],
  ["bodymap", LS_BODYMAP],
  ["coachplan",LS_COACHPLAN],
];
const GIST_FILE = "daily-ledger.json";

function ghToken() { return localStorage.getItem(LS_GHTOKEN) || ""; }
function gistId()  { return localStorage.getItem(LS_GISTID) || ""; }
function syncConfigured() { return !!(ghToken() && gistId()); }

/* Bundle every synced key plus a timestamp used to resolve conflicts. */
function buildSyncPayload() {
  const out = { updatedAt: new Date().toISOString(), device: navigator.userAgent.slice(0,60) };
  SYNC_KEYS.forEach(([name, key]) => { out[name] = localStorage.getItem(key); });
  return out;
}
function applySyncPayload(p) {
  SYNC_KEYS.forEach(([name, key]) => {
    if (typeof p[name] === "string" && p[name] !== null) localStorage.setItem(key, p[name]);
    else if (p[name] === null) localStorage.removeItem(key);
  });
  diary = loadDiary();
  selected = pickDefaultDate();
}

async function ghFetch(url, opts) {
  const res = await fetch(url, Object.assign({
    headers: {
      "Authorization": "Bearer " + ghToken(),
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
    },
  }, opts || {}));
  if (!res.ok) {
    let msg = "GitHub error " + res.status;
    if (res.status === 401) msg += " — token rejected. Check it was copied fully and has 'gist' permission.";
    if (res.status === 404) msg += " — gist not found. Try 'Create new sync gist'.";
    throw new Error(msg);
  }
  return res.json();
}

/* Create a fresh private gist seeded with this device's data. */
async function createGist() {
  if (!ghToken()) { showToast(null,{ok:false,text:"Enter your GitHub token first."}); return; }
  setSyncStatus("Creating private gist…");
  try {
    const body = {
      description: "The Daily Ledger — private data sync (do not share)",
      public: false,
      files: { [GIST_FILE]: { content: JSON.stringify(buildSyncPayload(), null, 1) } },
    };
    const data = await ghFetch("https://api.github.com/gists", { method: "POST", body: JSON.stringify(body) });
    localStorage.setItem(LS_GISTID, data.id);
    localStorage.setItem(LS_SYNCAT, new Date().toISOString());
    setSyncStatus("Sync set up. Gist ID: " + data.id, true);
    renderData();
    showToast(null,{ok:true,text:"Cloud sync created. Copy the Gist ID onto your other device."});
  } catch(e) {
    setSyncStatus(e.message, false);
  }
}

/* Push local state up. */
async function pushSync(silent) {
  if (!syncConfigured()) { if(!silent) showToast(null,{ok:false,text:"Set up sync first."}); return false; }
  try {
    if (!silent) setSyncStatus("Uploading…");
    const body = { files: { [GIST_FILE]: { content: JSON.stringify(buildSyncPayload(), null, 1) } } };
    await ghFetch("https://api.github.com/gists/" + gistId(), { method: "PATCH", body: JSON.stringify(body) });
    localStorage.setItem(LS_SYNCAT, new Date().toISOString());
    if (!silent) { setSyncStatus("Uploaded at " + fmtTime(new Date()), true); renderData(); }
    return true;
  } catch(e) {
    if (!silent) setSyncStatus(e.message, false);
    else showToast(null,{ok:false,text:"Auto-sync failed: " + e.message});
    return false;
  }
}

/* Pull remote state down, overwriting local. */
async function pullSync(silent) {
  if (!syncConfigured()) { if(!silent) showToast(null,{ok:false,text:"Set up sync first."}); return false; }
  try {
    if (!silent) setSyncStatus("Downloading…");
    const data = await ghFetch("https://api.github.com/gists/" + gistId());
    const f = data.files && data.files[GIST_FILE];
    if (!f || !f.content) throw new Error("Sync file missing from that gist.");
    const payload = JSON.parse(f.content);
    applySyncPayload(payload);
    localStorage.setItem(LS_SYNCAT, new Date().toISOString());
    render();
    if (!silent) { setSyncStatus("Downloaded at " + fmtTime(new Date()), true); renderData(); }
    showToast(null,{ok:true,text:"Synced from cloud — " + Object.keys(diary).length + " days loaded."});
    return true;
  } catch(e) {
    if (!silent) setSyncStatus(e.message, false);
    return false;
  }
}

/* On startup: if the cloud copy is newer than this device's last sync,
   pull it automatically so you always open to current data. */
async function autoSyncOnLoad() {
  if (!syncConfigured()) return;
  try {
    const data = await ghFetch("https://api.github.com/gists/" + gistId());
    const f = data.files && data.files[GIST_FILE];
    if (!f || !f.content) return;
    const payload = JSON.parse(f.content);
    const remoteAt = payload.updatedAt ? new Date(payload.updatedAt).getTime() : 0;
    const localAt = localStorage.getItem(LS_SYNCAT) ? new Date(localStorage.getItem(LS_SYNCAT)).getTime() : 0;
    if (remoteAt > localAt) {
      applySyncPayload(payload);
      localStorage.setItem(LS_SYNCAT, new Date().toISOString());
      render();
      showToast(null,{ok:true,text:"Loaded newer data from cloud sync."});
    }
  } catch(e) {
    showToast(null,{ok:false,text:"Cloud sync check failed: " + e.message});
  }
}

/* Debounced auto-push whenever data changes. */
let pushTimer = null;
function queuePush() {
  if (!syncConfigured()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushSync(true), 2500);
}
function setSyncStatus(msg, ok) {
  const el = document.getElementById("sync-status");
  if (el) { el.textContent = msg; el.style.color = ok === true ? "var(--green)" : ok === false ? "var(--red)" : "var(--ink-dim)"; }
}
function saveGhToken() {
  const t = document.getElementById("gh-token").value.trim();
  if (t) localStorage.setItem(LS_GHTOKEN, t); else localStorage.removeItem(LS_GHTOKEN);
  renderData();
  showToast(null,{ok:true,text: t ? "GitHub token saved to this browser." : "Token cleared."});
}
function saveGistId() {
  const g = document.getElementById("gist-id").value.trim();
  if (g) localStorage.setItem(LS_GISTID, g); else localStorage.removeItem(LS_GISTID);
  renderData();
  showToast(null,{ok:true,text: g ? "Gist ID saved — tap Pull to load that data." : "Gist ID cleared."});
}
function disableSync() {
  localStorage.removeItem(LS_GHTOKEN);
  localStorage.removeItem(LS_GISTID);
  localStorage.removeItem(LS_SYNCAT);
  renderData();
  showToast(null,{ok:true,text:"Cloud sync disabled. Data stays on this device only."});
}

/* ===== Targets =====
   Two sources, coach wins:
   - LOCAL: a progressive-overload rule computed from the last logged set.
   - COACH: explicit targets returned by Claude, stored per exercise.
   Targets are stored with the unit they were set in and converted on display. */
function getTargets() {
  try { return JSON.parse(localStorage.getItem(LS_TARGETS)) || {}; } catch(e) { return {}; }
}
function saveTargets(t) {
  const payload = JSON.stringify(t);
  localStorage.setItem(LS_TARGETS, payload);
  if (localStorage.getItem(LS_TARGETS) !== payload) throw new Error("Read-back after save did not match.");
  queuePush();
  return payload.length;
}
/* Top of the prescribed rep range, e.g. "4 × 8–10" -> 10 */
function topReps(setsStr) {
  const nums = (setsStr || "").match(/\d+/g);
  if (!nums || nums.length < 2) return null;
  return parseInt(nums[nums.length-1], 10);
}
/* Isolation lifts move in smaller jumps than compounds. */
function isIsolation(name) {
  return /curl|raise|pushdown|extension|fly|face pull|squeeze/i.test(name);
}
function increment(name) {
  const U = getUnits();
  if (U === "lb") return isIsolation(name) ? 2.5 : 5;
  return isIsolation(name) ? 1 : 2.5;
}
/* Local suggestion: hit the top of the rep range -> add weight; otherwise
   repeat the weight and chase one more rep. */
function localTarget(ex) {
  const last = lastSet(ex.n);
  if (!last || !last.weight) return null;
  const cap = topReps(ex.s);
  const lastReps = parseInt(last.reps, 10);
  const shown = parseFloat(toDisplayWeight(last.weight, setUnitOf(last)));
  if (isNaN(shown)) return null;
  if (cap && !isNaN(lastReps) && lastReps >= cap) {
    return { weight: round1(shown + increment(ex.n)), reps: ex.s.match(/\d+\s*[–-]\s*\d+/) ? String(topReps(ex.s) - 2) : last.reps,
             why: "hit " + lastReps + " reps — time to add weight", src: "local" };
  }
  return { weight: round1(shown), reps: (!isNaN(lastReps) ? String(lastReps + 1) : last.reps),
           why: "same weight, chase one more rep", src: "local" };
}
/* Coach target if present (converted to current units), else local rule. */
function targetFor(ex) {
  const t = getTargets()[ex.n];
  if (t && t.weight) {
    return {
      weight: round1(parseFloat(toDisplayWeight(t.weight, t.unit === "kg" ? "kg" : "lb"))),
      reps: t.reps || "",
      sets: t.sets || "",
      why: t.why || "",
      src: "coach",
    };
  }
  return localTarget(ex);
}

/* Units: 'lb' or 'kg'. Lift weights are stored exactly as entered along with
   the unit used, so switching display never corrupts past entries — we convert
   on the way out, not in storage. Body weight stays canonical in kg. */
function getUnits() { return localStorage.getItem(LS_UNITS) === "kg" ? "kg" : "lb"; }
function setUnits(u) {
  localStorage.setItem(LS_UNITS, u === "kg" ? "kg" : "lb");
  render();
  showToast(null, {ok:true, text:"Weights now shown in " + getUnits() + "."});
}
const LB_PER_KG = 2.20462;
function toDisplayWeight(val, storedUnit) {
  const n = parseFloat(val);
  if (isNaN(n)) return "";
  const su = storedUnit === "kg" ? "kg" : "lb";
  const du = getUnits();
  if (su === du) return String(round1(n));
  return String(round1(su === "kg" ? n * LB_PER_KG : n / LB_PER_KG));
}
function round1(n) { return Math.round(n * 10) / 10; }
/* Body weight helpers — diary always holds kg. */
function bodyWeightDisplay(kg) {
  if (kg == null) return null;
  return getUnits() === "kg" ? round1(kg) : round1(kg * LB_PER_KG);
}
function bodyWeightToKg(entered) {
  const n = parseFloat(entered);
  if (isNaN(n)) return null;
  return getUnits() === "kg" ? n : round1(n / LB_PER_KG);
}

/* No personal data ships in this file — every device starts blank
   and keeps its own private log in that browser's storage. */
const SEED_DIARY = {};

function getGoal() {
  const g = parseInt(localStorage.getItem(LS_GOAL), 10);
  return (g && g > 0) ? g : DEFAULT_GOAL;
}

/* ============================ state ============================ */
let diary = loadDiary();
let selected = pickDefaultDate();
let currentTab = "log";
let trendWin = 7;
let charts = [];

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function loadDiary() {
  try {
    const raw = localStorage.getItem(LS_DIARY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through */ }
  return JSON.parse(JSON.stringify(SEED_DIARY));
}
function saveDiary() {
  const payload = JSON.stringify(diary);
  localStorage.setItem(LS_DIARY, payload);
  const check = localStorage.getItem(LS_DIARY);
  if (check !== payload) throw new Error("Read-back after save did not match.");
  queuePush();
  return payload.length;
}
function pickDefaultDate() {
  const dates = Object.keys(diary).sort();
  return dates.includes(todayISO()) ? todayISO() : (dates[dates.length-1] || todayISO());
}
function ensureDay(d) {
  if (!diary[d]) diary[d] = { weightKg: null, bodyFatPct: null, meals: [], exercise: [] };
  if (!diary[d].exercise) diary[d].exercise = []; // older saved days
  return diary[d];
}
function dayTotal(d) { return (diary[d] ? diary[d].meals : []).reduce((s,m)=>s+(m.kcal||0),0); }
function dayBurn(d) { return ((diary[d] && diary[d].exercise) ? diary[d].exercise : []).reduce((s,m)=>s+(m.kcal||0),0); }
function dayNet(d) { return dayTotal(d) - dayBurn(d); }

/* Days that actually have something logged — empty days don't drag the average. */
function loggedDates() {
  return Object.keys(diary).filter(d => {
    const e = diary[d];
    return e && ((e.meals && e.meals.length) || (e.exercise && e.exercise.length));
  }).sort();
}
function averages(dates) {
  const withMeals = dates.filter(d => diary[d] && diary[d].meals && diary[d].meals.length);
  if (!withMeals.length) return null;
  const sum = (fn) => withMeals.reduce((s,d)=>s+fn(d),0);
  return {
    days: withMeals.length,
    consumed: Math.round(sum(dayTotal) / withMeals.length),
    burned: Math.round(sum(dayBurn) / withMeals.length),
    net: Math.round(sum(dayNet) / withMeals.length),
  };
}
function fmtDay(iso) { return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fmtShort(iso) { return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"}); }
function fmtTime(d) { return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); }
function esc(s) { const div=document.createElement("div"); div.textContent=s; return div.innerHTML; }

/* ============================ rendering ============================ */
function render() {
  renderRail();
  if (currentTab === "log") renderLog();
  if (currentTab === "trends") renderTrends();
  if (currentTab === "coach") renderCoach();
  if (currentTab === "chat") renderChat();
  if (currentTab === "notes") renderNotes();
  if (currentTab === "data") renderData();
}

/* ===== Quick Adds: auto-learned frequents + user pins ===== */
function getPins() {
  try { return JSON.parse(localStorage.getItem(LS_PINS)) || []; } catch(e) { return []; }
}
function savePins(pins) { localStorage.setItem(LS_PINS, JSON.stringify(pins)); queuePush(); }

/* Tally every meal ever logged; the most frequent become suggestions. */
function frequentItems(limit) {
  const counts = {};
  Object.values(diary).forEach(day => (day.meals||[]).forEach(m => {
    const key = m.name.trim();
    if (!counts[key]) counts[key] = { name: key, kcal: m.kcal, n: 0, note: m.note };
    counts[key].n++;
    counts[key].kcal = m.kcal; // keep most recent kcal
  }));
  const pinNames = new Set(getPins().map(p => p.name));
  return Object.values(counts)
    .filter(c => c.n >= 2 && !pinNames.has(c.name)) // seen at least twice, not already pinned
    .sort((a,b) => b.n - a.n)
    .slice(0, limit || 6);
}

/* Quick-add chips carry an index into these live arrays rather than
   embedding item data in HTML — apostrophes and quotes in food names
   were breaking the old inline-onclick approach. */
let _qaPins = [];
let _qaFreq = [];

function quickAddBar() {
  _qaPins = getPins();
  _qaFreq = frequentItems(6);
  if (!_qaPins.length && !_qaFreq.length) return "";
  const clip = s => s.length > 22 ? s.slice(0,20)+"…" : s;
  let html = '<div class="qa-wrap">';
  if (_qaPins.length) {
    html += '<div class="qa-row">' + _qaPins.map((p,i) =>
      '<button class="qa pin" data-qa="pin" data-i="'+i+'">'+esc(clip(p.name))+
      ' <span>'+p.kcal+'</span><span class="qa-x" data-qa="unpin" data-i="'+i+'">×</span></button>'
    ).join("") + '</div>';
  }
  if (_qaFreq.length) {
    html += '<div class="qa-row">' + _qaFreq.map((f,i) =>
      '<button class="qa" data-qa="freq" data-i="'+i+'">'+
      esc(clip(f.name))+' <span>'+f.kcal+'</span>'+
      '<span class="qa-pin" data-qa="pin-add" data-i="'+i+'">+pin</span></button>'
    ).join("") + '</div>';
  }
  html += '</div>';
  return html;
}

/* One delegated handler on the document catches every quick-add tap. */
function handleQaClick(e) {
  const el = e.target.closest("[data-qa]");
  if (!el) return;
  const action = el.dataset.qa;
  const i = parseInt(el.dataset.i, 10);
  e.stopPropagation();
  if (action === "pin") { const it = _qaPins[i]; if (it) addQuickMeal(it); }
  else if (action === "freq") { const it = _qaFreq[i]; if (it) addQuickMeal(it); }
  else if (action === "unpin") { unpin(i); }
  else if (action === "pin-add") { const it = _qaFreq[i]; if (it) pinItemObj(it); }
}
document.addEventListener("click", handleQaClick);

function addQuickMeal(item) {
  const entry = ensureDay(selected);
  const meal = { name: item.name, kcal: item.kcal };
  if (item.note) meal.note = item.note;
  entry.meals.push(meal);
  try { saveDiary(); showToast(null, {ok:true, text:'Added "'+item.name+'" ('+item.kcal+' kcal) to '+fmtDay(selected)+'.'}); }
  catch(e) { showToast(null, {ok:false, text:"Added on screen but SAVE FAILED: "+e.message}); }
  render();
}
function pinItemObj(item) {
  const pins = getPins();
  if (pins.some(p => p.name === item.name)) return;
  pins.push({ name: item.name, kcal: item.kcal, note: item.note });
  savePins(pins);
  showToast(null, {ok:true, text:'Pinned "'+item.name+'" to Quick Adds.'});
  render();
}
function unpin(i) {
  const pins = getPins();
  pins.splice(i,1);
  savePins(pins);
  render();
}

/* ===== Workout logging =====
   WORKOUTS[exerciseName] = [{date, weight, reps, sets, done}] — newest last.
   Skipped exercises are tracked so the next session can carry them forward. */
function getWorkouts() {
  try { return JSON.parse(localStorage.getItem(LS_WORKOUTS)) || {}; } catch(e) { return {}; }
}
function saveWorkouts(w) {
  const payload = JSON.stringify(w);
  localStorage.setItem(LS_WORKOUTS, payload);
  if (localStorage.getItem(LS_WORKOUTS) !== payload) throw new Error("Read-back after save did not match.");
  queuePush();
  return payload.length;
}
function exHistory(name) {
  const w = getWorkouts();
  return (w[name] || []).filter(s => s.done);
}
function lastSet(name) {
  const h = exHistory(name);
  return h.length ? h[h.length-1] : null;
}
/* Compare across entries regardless of the unit each was logged in.
   Entries saved before the unit toggle existed carry no `unit` field; the
   input was labelled kg back then, so they're treated as kg. */
function setUnitOf(s) { return s.unit === "lb" ? "lb" : "kg"; }
function weightInKg(s) {
  const n = parseFloat(s.weight);
  if (isNaN(n)) return 0;
  return setUnitOf(s) === "kg" ? n : n / LB_PER_KG;
}
/* Best working weight ever logged, for progression nudges. */
function bestSet(name) {
  const h = exHistory(name);
  if (!h.length) return null;
  return h.reduce((b,s) => weightInKg(s) > weightInKg(b) ? s : b, h[0]);
}

/* An exercise counts as "owed" if the last time its day was trained,
   it was left unticked. Those get surfaced at the top of the next session. */
function getSkipped() {
  const w = getWorkouts();
  const owed = [];
  COACH_PLAN.forEach(day => day.ex.forEach(e => {
    const entries = w[e.n] || [];
    if (!entries.length) return;
    const last = entries[entries.length-1];
    if (last && !last.done) owed.push({ name: e.n, day: day.name, since: last.date, fig: e.fig, s: e.s });
  }));
  return owed;
}

/* Record a set. done=false marks it explicitly skipped. */
function logSet(exName, dayName) {
  const wEl = document.getElementById("w-"+cssId(exName));
  const rEl = document.getElementById("r-"+cssId(exName));
  const sEl = document.getElementById("s-"+cssId(exName));
  const w = getWorkouts();
  if (!w[exName]) w[exName] = [];
  w[exName].push({
    date: todayISO(),
    day: dayName,
    weight: wEl ? wEl.value.trim() : "",
    unit: getUnits(),
    reps: rEl ? rEl.value.trim() : "",
    sets: sEl ? sEl.value.trim() : "",
    done: true,
  });
  try { saveWorkouts(w); showToast(null, {ok:true, text:'Logged "'+exName+'" — saved & verified.'}); }
  catch(e) { showToast(null, {ok:false, text:"Logged on screen but SAVE FAILED: "+e.message}); }
  renderCoach();
}
function skipSet(exName, dayName) {
  const w = getWorkouts();
  if (!w[exName]) w[exName] = [];
  w[exName].push({ date: todayISO(), day: dayName, weight:"", reps:"", sets:"", done: false });
  try { saveWorkouts(w); showToast(null, {ok:true, text:'"'+exName+'" marked skipped — it\'ll carry to your next session.'}); }
  catch(e) { showToast(null, {ok:false, text:"SAVE FAILED: "+e.message}); }
  renderCoach();
}
function undoLast(exName) {
  const w = getWorkouts();
  if (w[exName] && w[exName].length) w[exName].pop();
  try { saveWorkouts(w); } catch(e) {}
  renderCoach();
}
function cssId(s) { return s.replace(/[^a-zA-Z0-9]/g, "_"); }

/* Did this exercise get logged today (either way)? */
function todayStatus(name) {
  const w = getWorkouts();
  const entries = w[name] || [];
  const t = entries.filter(e => e.date === todayISO());
  if (!t.length) return null;
  return t[t.length-1].done ? "done" : "skipped";
}

/* Build one exercise card with logging controls and history. */
function exCard(e, dayName) {
  const id = cssId(e.n);
  const last = lastSet(e.n);
  const best = bestSet(e.n);
  const status = todayStatus(e.n);
  const U = getUnits();
  const lastDisp = last ? toDisplayWeight(last.weight, setUnitOf(last)) : "";
  const bestDisp = best ? toDisplayWeight(best.weight, setUnitOf(best)) : "";
  const histLine = last
    ? 'Last: ' + (lastDisp ? lastDisp + " " + U : "bodyweight") +
      (last.reps ? " × " + last.reps + " reps" : "") +
      (last.sets ? " × " + last.sets + " sets" : "") +
      " · " + fmtShort(last.date) +
      (best && weightInKg(best) > weightInKg(last) ? "  (best " + bestDisp + " " + U + ")" : "")
    : "No sets logged yet — log today's to start tracking.";

  const tgt = targetFor(e);
  const tgtLine = tgt
    ? '<div class="ex-target'+(tgt.src==="coach"?" coach":"")+'">' +
      (tgt.src === "coach" ? "◎ Coach target: " : "◎ Target today: ") +
      '<b>'+tgt.weight+' '+U+'</b>' +
      (tgt.reps ? ' × '+esc(String(tgt.reps))+' reps' : '') +
      (tgt.sets ? ' × '+esc(String(tgt.sets))+' sets' : '') +
      (tgt.why ? '<span class="ex-why"> — '+esc(tgt.why)+'</span>' : '') +
      '</div>'
    : '';

  /* Prefill with the target when there is one, so the number in the box is
     what to aim for, not what you already did. */
  const preW = tgt ? String(tgt.weight) : lastDisp;
  const preR = tgt && tgt.reps ? String(tgt.reps) : (last && last.reps ? last.reps : "");
  const preS = tgt && tgt.sets ? String(tgt.sets) : (last && last.sets ? last.sets : "");

  return '<div class="ex-card' + (status==="done" ? " ex-done" : status==="skipped" ? " ex-skipped" : "") + '">' +
    '<div class="ex-fig">'+exSvg(e.fig)+'</div>' +
    '<div class="ex-info">' +
      '<div class="ex-name">'+esc(e.n)+ (status==="done" ? ' <span class="ex-tick">✓</span>' : status==="skipped" ? ' <span class="ex-skip-tag">skipped</span>' : '') +'</div>' +
      '<div class="ex-sets">'+esc(e.s)+'</div>' +
      tgtLine +
      '<ul class="ex-cues">'+e.c.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>' +
      (e.p ? '<div class="ex-prog">▲ '+esc(e.p)+'</div>' : '') +
      '<div class="ex-hist">'+esc(histLine)+'</div>' +
      '<div class="ex-log">' +
        '<input id="w-'+id+'" inputmode="decimal" placeholder="'+U+'" value="'+esc(preW)+'">' +
        '<input id="r-'+id+'" inputmode="numeric" placeholder="reps" value="'+esc(preR)+'">' +
        '<input id="s-'+id+'" inputmode="numeric" placeholder="sets" value="'+esc(preS)+'">' +
        '<button class="co-btn sm" data-ex-log="'+esc(e.n)+'" data-ex-day="'+esc(dayName)+'">✓ Did it</button>' +
        '<button class="co-btn sm ghost" data-ex-skip="'+esc(e.n)+'" data-ex-day="'+esc(dayName)+'">Skip</button>' +
        (status ? '<button class="co-btn sm ghost" data-ex-undo="'+esc(e.n)+'">Undo</button>' : '') +
      '</div>' +
    '</div></div>';
}

/* Delegated handler — keeps exercise names out of inline JS so apostrophes
   and quotes can't break the buttons (same bug class as quick-adds). */
document.addEventListener("click", function(e) {
  const l = e.target.closest("[data-ex-log]");
  if (l) { logSet(l.dataset.exLog, l.dataset.exDay); return; }
  const s = e.target.closest("[data-ex-skip]");
  if (s) { skipSet(s.dataset.exSkip, s.dataset.exDay); return; }
  const u = e.target.closest("[data-ex-undo]");
  if (u) { undoLast(u.dataset.exUndo); return; }
});

/* Local progression read — plain arithmetic on the logged sets, so it works
   with no API key and gives the AI coach something concrete to react to. */
function progressionReport() {
  const w = getWorkouts();
  const lines = [];
  Object.keys(w).forEach(name => {
    const h = w[name].filter(s => s.done && s.weight);
    if (h.length < 2) return;
    const first = h[0], last = h[h.length-1];
    const dw = weightInKg(last) - weightInKg(first); // compare in kg regardless of entry unit
    lines.push({
      name,
      from: toDisplayWeight(first.weight, setUnitOf(first)),
      to: toDisplayWeight(last.weight, setUnitOf(last)),
      dw, span: h.length, since: first.date,
    });
  });
  return lines;
}
function progressionPanel() {
  const rows = progressionReport();
  const w = getWorkouts();
  const totalSets = Object.values(w).reduce((s,arr)=>s+arr.filter(x=>x.done).length,0);
  if (!totalSets) return '<div class="co-box"><div class="t">Progression</div>' +
    '<div class="co-sub">Nothing logged yet. Enter weight and reps on the exercise cards and tick <b>✓ Did it</b> — after two sessions per lift, the coach can tell you whether you\u2019re actually progressing or spinning your wheels.</div></div>';
  const stalled = rows.filter(r => r.dw <= 0 && r.span >= 3);
  const gaining = rows.filter(r => r.dw > 0);
  const U = getUnits();
  return '<div class="co-box"><div class="t">Progression — '+totalSets+' sets logged</div>' +
    (gaining.length ? '<div class="co-sub" style="color:var(--blue)">▲ Moving up: ' +
      gaining.map(r=>esc(r.name)+" "+r.from+"→"+r.to+" "+U).join(" · ") + '</div>' : '') +
    (stalled.length ? '<div class="co-sub" style="color:var(--amber);margin-top:6px">■ Stalled ('+stalled.length+'): ' +
      stalled.map(r=>esc(r.name)+" stuck at "+r.to+" "+U+" over "+r.span+" sessions").join(" · ") +
      '<br>If form is solid, add the smallest increment available or add one rep per set.</div>' : '') +
    (!gaining.length && !stalled.length ? '<div class="co-sub">Log a couple more sessions per lift and the trend will show up here.</div>' : '') +
    '</div>';
}

/* Assembles everything the coach knows about the client. */
function coachContext() {
  const p = getProfile();
  const bm = getBodymap();
  const avg = averages(loggedDates());
  const w = getWorkouts();
  const lifts = [];
  Object.keys(w).forEach(name => {
    const h = w[name].filter(s => s.done);
    if (!h.length) return;
    const recent = h.slice(-4).map(s => (s.weight ? toDisplayWeight(s.weight, setUnitOf(s))+getUnits() : "bodyweight")+"×"+(s.reps||"?")+" reps×"+(s.sets||"?")+" sets on "+s.date);
    lifts.push(name + ": " + recent.join(", "));
  });
  const owed = getSkipped().map(o => o.name + " (skipped " + o.since + ")");
  const recentBurn = [];
  Object.keys(diary).sort().slice(-14).forEach(d => (diary[d].exercise||[]).forEach(x => recentBurn.push(d+": "+x.name)));
  const U = getUnits();
  const hUnit = U === "lb" ? "in" : "cm";
  return "UNITS: every weight below is in "+U+". Give all weight recommendations in "+U+" only — do not convert to or mention the other unit.\n" +
    "CLIENT: male, age "+(p.age||"32")+", height "+(p.height||"?")+" "+hUnit+", bodyweight "+(p.weight||(latestWeight()!=null?bodyWeightDisplay(latestWeight()):"?"))+" "+U+". Lives in Arizona (extreme summer heat limits outdoor running).\n" +
    "NUTRITION: calorie goal "+getGoal()+" kcal/day"+(avg?"; actually averaging "+avg.consumed+" kcal/day over "+avg.days+" logged days, net "+avg.net:"; no logged days yet")+".\n" +
    "BODY MAP GOALS — grow: "+(Object.keys(bm).filter(k=>bm[k]==="grow").join(", ")||"none marked")+"; trim: "+(Object.keys(bm).filter(k=>bm[k]==="trim").join(", ")||"none marked")+".\n" +
    "PROGRAM: 4-day split (chest/triceps, back/biceps, legs/core, shoulders/arms), plus 12% incline treadmill walks at 3.0 mph for 20-25 min, and 5K runs 1-2x/month.\n" +
    "LOGGED LIFTS (most recent last): " + (lifts.length ? lifts.join(" | ") : "NONE LOGGED YET") + "\n" +
    "SKIPPED/OWED: " + (owed.length ? owed.join(", ") : "none") + "\n" +
    "RECENT GYM SESSIONS IN LEDGER: " + (recentBurn.slice(-8).join("; ") || "none") + "\n" +
    "HISTORY: reports poor bicep/tricep/chest growth from light machine work; wants to be lean and proportional; has some waist fat.";
}

async function sendCoachChat() {
  const inp = document.getElementById("coach-q");
  const key = localStorage.getItem(LS_KEY);
  if (!inp || !key) return;
  const q = inp.value.trim();
  if (!q) return;
  const h = getCoachChat();
  h.push({ role: "user", text: q });
  saveCoachChat(h);
  inp.value = "";
  renderCoach();
  try {
    const msgs = h.slice(-8).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: "You are a strength & conditioning coach inside the client's own training app. Be direct, specific and honest — including when the honest answer is that they're under-loading, under-eating for muscle growth, or expecting spot reduction. Use their actual logged numbers when you answer; if a lift hasn't moved in weeks, say so plainly and give the exact next weight to try. Keep answers under 200 words, plain text, no markdown headers. If they have logged no sets, tell them what to log. When you recommend specific weights, end with one short line: 'Tap Set target weights to put these on your cards.' Never give medical advice; suggest a professional for pain or injury.\n\nHere is everything known about the client:\n" + coachContext(),
        messages: msgs,
      }),
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
    const h2 = getCoachChat();
    h2.push({ role: "assistant", text: text || "(no response)" });
    saveCoachChat(h2);
  } catch(e) {
    const h2 = getCoachChat();
    h2.push({ role: "assistant", text: "Error: " + e.message });
    saveCoachChat(h2);
  } finally {
    renderCoach();
    const sc = document.getElementById("coach-chat-scroll");
    if (sc) sc.scrollTop = sc.scrollHeight;
  }
}

/* Ask the coach for concrete target weights per exercise, returned as JSON so
   they can be written onto the workout cards. */
async function refreshTargets(silent) {
  const key = localStorage.getItem(LS_KEY);
  if (!key) return false;
  const btn = document.getElementById("co-tgt-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Setting targets…"; }
  const U = getUnits();
  try {
    const exList = [];
    COACH_PLAN.forEach(day => day.ex.forEach(e => {
      if (/walk|run/i.test(e.n)) return; // cardio has no load target
      const last = lastSet(e.n);
      exList.push('"' + e.n + '" (prescribed ' + e.s + (last && last.weight
        ? '; last logged ' + toDisplayWeight(last.weight, setUnitOf(last)) + U + ' × ' + (last.reps||"?") + ' reps'
        : '; never logged') + ')');
    }));
    const prompt = coachContext() +
      "\n\nSet a concrete target load for the NEXT session of each exercise below. Rules: weights in " + U + " only; " +
      "use realistic gym increments (" + (U==="lb" ? "2.5 or 5 lb" : "1 or 2.5 kg") + "); if a lift has never been logged, " +
      "suggest a sensible conservative starting weight for this client and say it's a starting estimate; if a lift has stalled, " +
      "either nudge the load or prescribe the same weight for more reps and say so. Prioritise his marked growth areas. " +
      "Keep each 'why' under 8 words.\n\nExercises:\n" + exList.join("\n") +
      "\n\nRespond with ONLY a JSON object, no markdown fences, no other text:\n" +
      '{"targets":[{"name":"exact exercise name from the list","weight":0,"reps":"8-10","sets":"4","why":"short reason"}]}';

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());

    /* Only accept targets whose names match real exercises in the plan. */
    const valid = new Set();
    COACH_PLAN.forEach(day => day.ex.forEach(e => valid.add(e.n)));
    const t = getTargets();
    let n = 0;
    (parsed.targets || []).forEach(x => {
      if (!x || !valid.has(x.name)) return;
      const wNum = parseFloat(x.weight);
      if (isNaN(wNum) || wNum <= 0) return;
      t[x.name] = { weight: wNum, unit: U, reps: x.reps || "", sets: x.sets || "", why: x.why || "", setAt: todayISO() };
      n++;
    });
    saveTargets(t);
    renderCoach();
    showToast(null, {ok:true, text: n + " target weights written to your workout cards."});
    return true;
  } catch(e) {
    if (!silent) showToast(null, {ok:false, text:"Couldn't set targets: " + e.message});
    if (btn) { btn.disabled = false; btn.textContent = "Set target weights"; }
    return false;
  }
}
function clearTargets() {
  localStorage.removeItem(LS_TARGETS);
  renderCoach();
  showToast(null, {ok:true, text:"Coach targets cleared — cards fall back to automatic progression."});
}

/* Tap cycles a region: neutral → grow (blue) → trim (amber) → neutral. */
document.addEventListener("click", function(e) {
  const el = e.target.closest("[data-bm]");
  if (!el) return;
  const r = el.dataset.bm;
  const bm = getBodymap();
  bm[r] = bm[r] === "grow" ? "trim" : bm[r] === "trim" ? "" : "grow";
  if (!bm[r]) delete bm[r];
  localStorage.setItem(LS_BODYMAP, JSON.stringify(bm));
  renderCoach();
});

function bmSummary() {
  const bm = getBodymap();
  const grow = BM_REGIONS.filter(([k]) => bm[k]==="grow").map(([,l])=>l);
  const trim = BM_REGIONS.filter(([k]) => bm[k]==="trim").map(([,l])=>l);
  let out = [];
  if (grow.length) out.push("Grow: " + grow.join(", "));
  if (trim.length) out.push("Trim: " + trim.join(", "));
  return out.join("  ·  ") || "Tap the figure to mark goals";
}

async function askCoach() {
  const btn = document.getElementById("co-ai-btn");
  const key = localStorage.getItem(LS_KEY);
  if (!key || !btn) return;
  btn.disabled = true; btn.textContent = "Coaching…";
  try {
    const p = getProfile();
    const bm = getBodymap();
    const avg = averages(loggedDates());
    const recentEx = [];
    Object.keys(diary).sort().slice(-14).forEach(d => (diary[d].exercise||[]).forEach(x => recentEx.push(d+": "+x.name+" ("+x.kcal+" kcal)")));
    const prompt = coachContext() + "\n\nGive a concise personalized assessment and week-plan adjustment in plain text (no markdown): 1) calorie and protein guidance for his recomposition goal, 2) specific set/rep/weight-progression changes emphasizing his marked growth areas — reference his ACTUAL logged weights where available and name the next weight to try, 3) whether his current loading looks sufficient or too light, 4) cardio strategy for Arizona heat, 5) one realistic expectation about timeline. Max ~320 words, direct and specific.";
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
    localStorage.setItem(LS_COACHPLAN, text);
    renderCoach();
    showToast(null, {ok:true, text:"Plan updated — setting target weights…"});

    await refreshTargets(true);
  } catch(e) {
    showToast(null, {ok:false, text:"Coach error: " + e.message});
    if (btn) { btn.disabled = false; btn.textContent = "Generate personalized plan"; }
  }
}

async function sendChat() {
  const inp = document.getElementById("chat-q");
  const q = inp.value.trim();
  const key = localStorage.getItem(LS_KEY);
  if (!q || !key) return;
  const hist = getChatHist();
  hist.push({ role: "user", text: q });
  saveChatHist(hist);
  inp.value = "";
  renderChat();
  const sendBtn = document.getElementById("chat-q-send");
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "…"; }
  try {
    const msgs = hist.slice(-10).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: "You are a helpful nutrition and wellness assistant inside a calorie-tracking app. Answer concisely. This is a general Q&A space — do NOT try to log food; just answer questions and offer ideas.",
        messages: msgs,
      }),
    });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
    const h2 = getChatHist();
    h2.push({ role: "assistant", text: text || "(no response)" });
    saveChatHist(h2);
  } catch(e) {
    const h2 = getChatHist();
    h2.push({ role: "assistant", text: "Error: " + e.message });
    saveChatHist(h2);
  } finally {
    renderChat();
  }
}

function railDates() {
  /* Every logged day, plus today and whatever is selected, so the rail is
     never empty and future days you add stay visible. */
  const set = new Set(Object.keys(diary));
  set.add(todayISO());
  if (selected) set.add(selected);
  return Array.from(set).sort();
}

function renderRail() {
  const rail = document.getElementById("rail");
  const dates = railDates();
  rail.innerHTML = "";
  dates.forEach((d, idx) => {
    const total = dayTotal(d);
    const burn = dayBurn(d);
    const over = total > getGoal();
    const pct = Math.min(total/getGoal(),1)*100;
    const future = d > todayISO();

    /* If there's a gap before this card (the previous card in the rail isn't
       the calendar day immediately before this one), offer a + to fill it. */
    const prevDay = shiftDate(d, -1);
    const gapBefore = idx > 0 && dates[idx-1] !== prevDay;
    if (gapBefore) {
      const ins = document.createElement("button");
      ins.className = "rail-insert";
      ins.title = "Add " + fmtDay(prevDay);
      ins.textContent = "+";
      ins.onclick = (e) => { e.stopPropagation(); insertDayBefore(d); };
      rail.appendChild(ins);
    }

    const btn = document.createElement("button");
    btn.className = "day-card" + (d===selected ? " active" : "") + (future ? " future" : "");
    btn.innerHTML =
      '<div class="d">'+fmtShort(d)+(future?" ›":"")+'</div>' +
      '<div class="k">'+total.toLocaleString()+'</div>' +
      (burn ? '<div class="burn-tag">−'+burn.toLocaleString()+'</div>' : '') +
      '<div class="bar"><div style="width:'+pct+'%;background:var(--'+(over?"red":"green")+')"></div></div>';
    btn.onclick = () => { selected = d; if (currentTab!=="log") switchTab("log"); render(); };
    if (d === selected) btn.dataset.active = "1";
    rail.appendChild(btn);
  });
  const activeCard = rail.querySelector('[data-active="1"]');
  if (activeCard) activeCard.scrollIntoView({inline:"center", block:"nearest"});
}

/* Create the calendar day immediately before `d` and select it. */
function insertDayBefore(d) {
  const target = shiftDate(d, -1);
  ensureDay(target);
  selected = target;
  try { saveDiary(); } catch(e) {}
  render();
  showToast(null, {ok:true, text:"Added "+fmtDay(target)+" — logging here now."});
}

function scrollRail(dir) {
  const rail = document.getElementById("rail");
  rail.scrollBy({ left: dir * 180, behavior: "smooth" });
}

/* Add the next un-logged day (usually tomorrow, or the day after the furthest
   future day already present) and select it. */
function addFutureDay() {
  const dates = railDates();
  let candidate = todayISO();
  const furthest = dates[dates.length-1];
  candidate = (furthest >= todayISO()) ? shiftDate(furthest, 1) : shiftDate(todayISO(), 1);
  ensureDay(candidate);
  selected = candidate;
  try { saveDiary(); } catch(e) {}
  if (currentTab !== "log") switchTab("log"); else render();
  showToast(null, {ok:true, text:"Added "+fmtDay(candidate)+" — logging here now."});
}

    '<button class="del" title="Remove" onclick="'+(kind==="meal"?"removeMeal":"removeExercise")+'(\''+selected+'\','+i+')">×</button>' +
  '</div>';
}

  const exercise = entry.exercise || [];
  const consumed = dayTotal(selected);
  const burned = dayBurn(selected);
  const net = consumed - burned;
  const remaining = getGoal() - consumed;   // exercise does NOT buy back food
  const over = remaining < 0;
  const pct = Math.min(consumed/getGoal(),1)*100;
  const overflowPct = over ? Math.min(((consumed-getGoal())/getGoal())*100,100) : 0;

  let mealsHtml;
  if (!entry.meals || !entry.meals.length) {
    mealsHtml = '<div class="empty">Nothing logged yet. Type what you ate in the bar below.</div>';
  } else {
    mealsHtml = '<div class="meals">' + entry.meals.map((m,i) =>
      '<div class="meal"><div><div class="n">'+esc(m.name)+'</div>' +
      (m.note ? '<div class="note">'+esc(m.note)+'</div>' : '') +
      '</div><div class="right"><span class="k">'+m.kcal.toLocaleString()+'</span>' +
      rowCtrls("meal", i) + '</div></div>'
    ).join("") + '</div>';
  }

  let exHtml = "";
  if (exercise.length) {
    exHtml = '<div class="section-h">Exercise</div>' +
      '<div class="meals">' + exercise.map((m,i) =>
      '<div class="meal"><div><div class="n">'+esc(m.name)+'</div>' +
      (m.note ? '<div class="note">'+esc(m.note)+'</div>' : '') +
      '</div><div class="right"><span class="k" style="color:var(--green)">−'+m.kcal.toLocaleString()+'</span>' +
      rowCtrls("exercise", i) + '</div></div>'
    ).join("") + '</div>';
  }

  const avgAll = averages(loggedDates());
  const avgHtml = avgAll
    ? '<div class="avg-bubble"><div class="avg-l">Average consumed · '+avgAll.days+' logged day'+(avgAll.days===1?"":"s")+'</div>' +
      '<div class="avg-v">'+avgAll.consumed.toLocaleString()+' <span>kcal/day</span></div>' +
      '<div class="avg-sub">net '+avgAll.net.toLocaleString()+' after '+avgAll.burned.toLocaleString()+' avg burned · goal '+getGoal().toLocaleString()+'</div></div>'
    : "";

  v.innerHTML =
    '<div class="day-head"><span class="day-title">'+fmtDay(selected)+'</span>' +
    '<span class="day-frac">'+consumed.toLocaleString()+' / '+getGoal().toLocaleString()+' kcal</span></div>' +
    '<div class="progress"><div style="width:'+(over?100:pct)+'%;background:var(--'+(over?"amber-dim":"green")+')"></div></div>' +
    (over ? '<div class="overflow-bar"><div style="width:'+overflowPct+'%"></div></div>' : '') +
    '<div class="chips">' +
      chip("Consumed", consumed.toLocaleString()) +
      chip("Burned", burned ? "−"+burned.toLocaleString() : "0", burned ? "var(--green)" : undefined) +
      chip("Net", net.toLocaleString(), "var(--amber)") +
      chip(over?"Over by":"Remaining", Math.abs(remaining).toLocaleString(), over?"var(--red)":"var(--green)") +
      chip("Weight", entry.weightKg!=null ? bodyWeightDisplay(entry.weightKg)+" "+getUnits() : "—") +
      chip("Body fat", entry.bodyFatPct!=null ? entry.bodyFatPct+"%" : "—") +
    '</div>' + avgHtml + quickAddBar() + mealsHtml + exHtml +
    '<div class="btn-row" style="margin-top:22px">' +
      '<button class="btn danger" onclick="deleteDay(this)">Delete this whole day</button>' +
    '</div>' +
    '<div class="hint">Deleting a day removes it from your averages and charts entirely — use it for days you didn\u2019t log fully.</div>';
}
function chip(l,v,tone) {
  return '<div class="chip"><div class="l">'+l+'</div><div class="v" style="color:'+(tone||"var(--ink)")+'">'+v+'</div></div>';
}

function removeMeal(date, i) {
  if (!confirm("Remove \"" + diary[date].meals[i].name + "\"?")) return;
  diary[date].meals.splice(i,1);
  try { saveDiary(); showToast(null, {ok:true, text:"Removed & saved."}); }
  catch(e) { showToast(null, {ok:false, text:"Removed on screen but SAVE FAILED: "+e.message}); }
  render();
}
function removeExercise(date, i) {
  if (!confirm("Remove \"" + diary[date].exercise[i].name + "\"?")) return;
  diary[date].exercise.splice(i,1);

  catch(e) { showToast(null, {ok:false, text:"Removed on screen but SAVE FAILED: "+e.message}); }

/* Shift an ISO date by n days. */
function shiftDate(iso, n) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

/* Move a meal or exercise item to the previous/next day. */
function moveItem(kind, i, delta) {
  const list = kind === "meal" ? diary[selected].meals : diary[selected].exercise;
  const item = list[i];
  if (!item) return;
  const target = shiftDate(selected, delta);
  const dest = ensureDay(target);
  list.splice(i, 1);
  (kind === "meal" ? dest.meals : dest.exercise).push(item);
  try {
    saveDiary();
    showToast(null, {ok:true, text:'"'+item.name+'" moved to '+fmtDay(target)+'.'});
  } catch(e) {
    showToast(null, {ok:false, text:"Moved on screen but SAVE FAILED: "+e.message});
  }
  render();
}

/* Delete an entire day so it stops counting in charts and averages. */
function deleteDay(btn) {
  if (btn.dataset.armed !== "1") {
    btn.dataset.armed = "1";
    btn.textContent = "Tap again to delete " + fmtDay(selected);
    return;
  }
  delete diary[selected];
  const dates = Object.keys(diary).sort();
  selected = dates.length ? (dates.includes(todayISO()) ? todayISO() : dates[dates.length-1]) : todayISO();
  if (!dates.length) ensureDay(selected);
  try { saveDiary(); showToast(null, {ok:true, text:"Day deleted."}); }
  catch(e) { showToast(null, {ok:false, text:"Deleted on screen but SAVE FAILED: "+e.message}); }
  render();
}

let toastTimer = null;
let pendingText = null; // original message awaiting a clarification answer

function showToast(reply, status, options) {
  const toast = document.getElementById("toast");
  const r = document.getElementById("toast-reply");
  const s = document.getElementById("toast-status");
  const o = document.getElementById("toast-opts");
  clearTimeout(toastTimer);
  r.textContent = reply || "";
  r.style.display = reply ? "" : "none";
  s.textContent = status ? status.text : "";
  s.className = "status " + (status && status.ok ? "ok" : "bad");
  s.style.display = status ? "" : "none";
  o.innerHTML = "";
  if (options && options.length) {
    options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = opt;
      b.onclick = (e) => { e.stopPropagation(); answerClarification(opt); };
      o.appendChild(b);
    });
  }
  toast.style.display = (reply || status || (options && options.length)) ? "block" : "none";
  /* Auto-hide: 5s normally, 10s for errors. Clarification questions stay
     until answered or dismissed. */
  if (!(options && options.length)) {
    const ms = (status && !status.ok) ? 10000 : 5000;
    toastTimer = setTimeout(hideToast, ms);
  }
}
function hideToast() {
  clearTimeout(toastTimer);
  pendingText = null;
  document.getElementById("toast").style.display = "none";
}
document.getElementById("toast").addEventListener("click", hideToast);

function answerClarification(option) {
  const original = pendingText;
  pendingText = null;
  hideToast();
  if (original) submitEntry(original + " (clarification: " + option + ")");
}

/* Loading bar: shows staged progress so the delay between typing and the
   ledger updating is legible instead of a mystery pause. */
let loadTimer = null;
function startLoad(offline) {
  const bar = document.getElementById("loadbar");
  const fill = document.getElementById("loadbar-fill");
  const label = document.getElementById("loadbar-label");
  bar.classList.add("on");
  let pct = 0;
  const stages = offline
    ? [[30,"Reading entry…"],[70,"Adding to ledger…"],[95,"Saving…"]]
    : [[15,"Sending to Claude…"],[45,"Estimating calories…"],[75,"Waiting for response…"],[92,"Saving to ledger…"]];
  let si = 0;
  fill.style.width = "8%";
  label.textContent = stages[0][1];
  clearInterval(loadTimer);
  loadTimer = setInterval(() => {
    /* Creep toward the next stage target so the bar always feels alive
       even when a network call takes a while. */
    const target = stages[Math.min(si, stages.length-1)][0];
    pct += (target - pct) * 0.25;
    fill.style.width = pct.toFixed(0) + "%";
    if (pct >= target - 1 && si < stages.length-1) { si++; label.textContent = stages[si][1]; }
  }, 300);
}
function finishLoad(ok) {
  clearInterval(loadTimer);
  const bar = document.getElementById("loadbar");
  const fill = document.getElementById("loadbar-fill");
  const label = document.getElementById("loadbar-label");
  fill.style.width = "100%";
  label.textContent = ok ? "Done ✓" : "Failed";
  setTimeout(() => { bar.classList.remove("on"); fill.style.width = "0%"; }, 500);
}

async function handleSend() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  submitEntry(text);
}

async function submitEntry(text) {
  sendBtn.disabled = true; sendBtn.textContent = "…";
  const key = localStorage.getItem(LS_KEY);
  startLoad(!key);
  try {
    const result = key ? await parseWithClaude(text, key) : parseOffline(text);

    /* Claude may ask a clarifying question (size / type / quantity). */
    if (result.question && result.question.text && Array.isArray(result.question.options) && result.question.options.length) {
      finishLoad(true);
      pendingText = text;
      showToast(result.question.text, null, result.question.options.slice(0, 4));
      return;
    }

    const applied = applyUpdates(result.updates || []);
    if (applied) {
      const bytes = saveDiary();
      finishLoad(true);
      showToast(result.reply, {ok:true, text:"Saved & read-back verified at "+fmtTime(new Date())+" ("+bytes.toLocaleString()+" bytes)."});
      if (result.updates[0] && result.updates[0].date) selected = result.updates[0].date;
    } else {
      finishLoad(true);
      showToast(result.reply || "Nothing to log from that.", null);
    }
    render();
  } catch(e) {
    finishLoad(false);
    showToast(null, {ok:false, text:"Couldn't log that: "+e.message});
  } finally {
    sendBtn.disabled = false; sendBtn.textContent = "Log";
  }
}

function applyUpdates(updates) {
  let touched = false;
  for (const u of updates) {
    const date = u.date || selected || todayISO();
    const entry = ensureDay(date);
    if (Array.isArray(u.removeIndexes) && u.removeIndexes.length) {
      const drop = new Set(u.removeIndexes);
      entry.meals = entry.meals.filter((_,i)=>!drop.has(i));
      touched = true;
    }
    if (Array.isArray(u.removeExerciseIndexes) && u.removeExerciseIndexes.length) {
      const dropE = new Set(u.removeExerciseIndexes);
      entry.exercise = entry.exercise.filter((_,i)=>!dropE.has(i));
      touched = true;
    }
    if (Array.isArray(u.addMeals)) for (const m of u.addMeals) {
      if (m && typeof m.name==="string" && typeof m.kcal==="number") {
        const meal = { name: m.name, kcal: Math.round(m.kcal) };
        if (m.note) meal.note = m.note;
        entry.meals.push(meal); touched = true;
      }
    }
    if (Array.isArray(u.addExercise)) for (const m of u.addExercise) {
      if (m && typeof m.name==="string" && typeof m.kcal==="number") {
        const ex = { name: m.name, kcal: Math.abs(Math.round(m.kcal)) };
        if (m.note) ex.note = m.note;
        entry.exercise.push(ex); touched = true;
      }
    }
    if (typeof u.weightKg==="number") { entry.weightKg = u.weightKg; touched = true; }
    if (typeof u.bodyFatPct==="number") { entry.bodyFatPct = u.bodyFatPct; touched = true; }
  }
  return touched;
}

/* Offline fallback: "name = kcal", "weight 72.5", "bf 18" */
function parseOffline(text) {
  const t = text.trim();
  let m = t.match(/^weight\s+([\d.]+)/i);
  if (m) return { updates:[{date:selected, weightKg:bodyWeightToKg(m[1])}], reply:"Weight logged: "+m[1]+" "+getUnits()+"." };
  m = t.match(/^(?:bf|body\s*fat)\s+([\d.]+)/i);
  if (m) return { updates:[{date:selected, bodyFatPct:parseFloat(m[1])}], reply:"Body fat logged: "+m[1]+"%." };
  m = t.match(/^(.+?)\s*=\s*-\s*(\d+)\s*$/);
  if (m) return { updates:[{date:selected, addExercise:[{name:m[1].trim(), kcal:parseInt(m[2],10)}]}], reply:"Exercise logged: "+m[1].trim()+" — "+m[2]+" kcal burned." };
  m = t.match(/^(.+?)\s*=\s*(\d+)\s*$/);
  if (m) return { updates:[{date:selected, addMeals:[{name:m[1].trim(), kcal:parseInt(m[2],10)}]}], reply:"Logged "+m[1].trim()+" — "+m[2]+" kcal." };
  return { updates: [], reply: "No API key set, so I can only parse: food name = 350, exercise name = -300, weight 72.5, or bf 18. Add a key in the Data tab for natural-language logging." };
}

async function parseWithClaude(userText, apiKey) {
  const prompt = `You are the meal-logging parser inside a calorie-tracking app called The Daily Ledger.
Today's date is ${todayISO()}.
The user is currently viewing ${selected}. Log every entry to ${selected} unless the message explicitly names a different day (e.g. "yesterday", "on Monday", a specific date) — in that case resolve it against today's date.

Current diary (JSON). Meal indexes are the array positions shown:
${JSON.stringify(diary, null, 1)}

The user typed: "${userText}"

Interpret this as diary updates. Estimate calories realistically (typical restaurant/label values, sensible rounding). Resolve relative days like "yesterday" against today's date. If a calorie count is label-confirmed, use it exactly with note "Label-confirmed". For corrections/removals, use removeIndexes (meals) or removeExerciseIndexes (exercise) on the matching array index for that date. The user enters bodyweight in ${getUnits()} — the weightKg field MUST be in kilograms, so convert if they are using pounds (divide by 2.20462). Body fat is %. If the message isn't loggable, return empty updates and answer briefly in "reply".

EXERCISE: if the user describes physical activity (a run, gym session, cycling, a long walk, sport, etc.), log it in addExercise with kcal = estimated calories BURNED (positive number). Estimate from activity, duration/distance, and intensity for an adult weighing ${latestWeight() != null ? latestWeight() : 73} kg; if duration or intensity is missing and it changes the estimate meaningfully, ask a clarifying question instead. Exercise reduces the day's net calories in the app automatically — never log it as a negative meal.

IMPORTANT — clarifying questions: if the calorie estimate would swing meaningfully (roughly 75+ kcal) based on size, quantity, preparation, or type that the user did not specify (e.g. "an apricot" could be small/large/dried, "a latte" could be 8/12/16 oz or whole/skim/oat milk, "fries" could be small/medium/large), do NOT guess. Instead return empty updates and a "question" object with 2-4 short tappable options, each including its approximate kcal, e.g. {"text":"What kind of apricot?","options":["Fresh, small (~17 kcal)","Fresh, large (~35 kcal)","Dried, 5 pieces (~85 kcal)"]}. Ask at most ONE question per message and only when it genuinely matters — if the message says "(clarification: …)" it contains the answer, so log it without asking again. For trivial ambiguity, just use the typical value.

Respond with ONLY a JSON object, no markdown fences:
{"updates":[{"date":"YYYY-MM-DD","addMeals":[{"name":"string","kcal":0,"note":"optional"}],"addExercise":[{"name":"string","kcal":0,"note":"optional"}],"removeIndexes":[],"removeExerciseIndexes":[],"weightKg":null,"bodyFatPct":null}],"question":null,"reply":"short confirmation with kcal breakdown"}`;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) {
    const errBody = await res.text();
    let msg = "API error " + res.status;
    try { msg += ": " + (JSON.parse(errBody).error || {}).message; } catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

/* ============================ boot ============================ */
document.getElementById("goal-label").textContent = getGoal().toLocaleString();
try {
  if (!Object.keys(diary).length) { ensureDay(todayISO()); selected = todayISO(); }
  if (!localStorage.getItem(LS_DIARY)) saveDiary(); // persist first run
} catch(e) {
  showToast(null,{ok:false,text:"WARNING: this browser blocked storage — data will NOT persist. "+e.message});
}
render();
/* If cloud sync is configured, check whether the other device has newer data. */
autoSyncOnLoad();
/* Push pending changes when the app is backgrounded or closed. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && syncConfigured()) pushSync(true);
});
</script>
