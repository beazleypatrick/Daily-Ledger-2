function copyBackup(btn) {
  const raw = localStorage.getItem(LS_DIARY);
  if (!raw) return;
  navigator.clipboard.writeText(raw).then(()=>{ btn.textContent="Copied ✓"; })
    .catch(()=>{ alert("Clipboard unavailable — copy from the raw data box below."); });
}
function eraseAll(btn) {
  if (btn.dataset.armed !== "1") { btn.dataset.armed="1"; btn.textContent="Tap again to erase EVERYTHING"; return; }
  diary = {};
  ensureDay(todayISO());
  selected = todayISO();
  try { saveDiary(); showToast(null,{ok:true,text:"All data erased. Starting fresh."}); }
  catch(e){ showToast(null,{ok:false,text:"Erase SAVE FAILED: "+e.message}); }
  render();
}
function saveGoal() {
  const g = parseInt(document.getElementById("goal-input").value, 10);
  if (!g || g < 500 || g > 10000) { alert("Enter a goal between 500 and 10,000 kcal."); return; }
  localStorage.setItem(LS_GOAL, String(g));
  document.getElementById("goal-label").textContent = getGoal().toLocaleString();
  showToast(null,{ok:true,text:"Goal set to "+g.toLocaleString()+" kcal."});
  render();
}
function importBackup(btn) {
  const box = document.getElementById("import-box");
  let parsed;
  try { parsed = JSON.parse(box.value); } catch(e) { alert("That isn't valid JSON."); return; }
  if (typeof parsed !== "object" || Array.isArray(parsed)) { alert("Expected a diary object keyed by date."); return; }
  if (btn.dataset.armed !== "1") { btn.dataset.armed="1"; btn.textContent="Tap again to confirm overwrite"; return; }
  diary = parsed;
  selected = pickDefaultDate();
  try { saveDiary(); showToast(null,{ok:true,text:"Backup imported & saved."}); }
  catch(e){ showToast(null,{ok:false,text:"Import SAVE FAILED: "+e.message}); }
  render();
}
function saveKey() {
  const k = document.getElementById("api-key").value.trim();
  if (!k) {
    localStorage.removeItem(LS_KEY);
    renderData();
    showToast(null,{ok:true,text:"API key cleared."});
    return;
  }
  /* The two password boxes are easy to mix up — catch it here rather than
     letting chat fail with a confusing error later. */
  if (/^gh[pousr]_|^github_pat_/.test(k)) {
    showToast(null,{ok:false,text:"That's your GitHub token, not your Anthropic key. GitHub tokens go in the Sync box; the Anthropic key starts with sk-ant-."});
    return;
  }
  if (!/^sk-ant-/.test(k)) {
    showToast(null,{ok:false,text:"Anthropic keys start with sk-ant- . Copy the whole key from console.anthropic.com."});
    return;
  }
  localStorage.setItem(LS_KEY, k);
  renderData();
  showToast(null,{ok:true,text:"API key saved to this browser."});
}

/* ============================ tabs ============================ */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => switchTab(t.dataset.tab));
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===name));
  ["log","trends","coach","chat","notes","data"].forEach(n => document.getElementById("view-"+n).style.display = n===name ? "" : "none");
  /* The food-log bar and the coach bar swap depending on the tab. */
  const cb = document.getElementById("coachbar");
  const fb = document.querySelector(".chatbar");
  if (cb) cb.style.display = name === "coach" ? "block" : "none";
  if (fb) fb.style.display = name === "coach" ? "none" : "block";
  render();
}

/* ============================ chat / logging ============================ */
const input = document.getElementById("chat-input");
const sendBtn = document.getElementById("chat-send");
input.addEventListener("keydown", e => { if (e.key==="Enter") handleSend(); });
sendBtn.onclick = handleSend;

let toastTimer = null;
let pendingText = null; // original message awaiting a clarification answer

function showToast(reply, status, options) {
  const toast = document.getElementById("toast");
  const r = document.getElementById("toast-reply");
  const s = document.getElementById("toast-status");
  const o = document.getElementById("toast-opts");
  clearTimeout(toastTimer);
  r.textContent = reply || "";
  r.style.display = reply ? "" : "none";
  s.textContent = status ? status.text : "";
  s.className = "status " + (status && status.ok ? "ok" : "bad");
  s.style.display = status ? "" : "none";
  o.innerHTML = "";
  if (options && options.length) {
    options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = opt;
      b.onclick = (e) => { e.stopPropagation(); answerClarification(opt); };
      o.appendChild(b);
    });
  }
  toast.style.display = (reply || status || (options && options.length)) ? "block" : "none";
  /* Auto-hide: 5s normally, 10s for errors. Clarification questions stay
     until answered or dismissed. */
  if (!(options && options.length)) {
    const ms = (status && !status.ok) ? 10000 : 5000;
    toastTimer = setTimeout(hideToast, ms);
  }
}
function hideToast() {
  clearTimeout(toastTimer);
  pendingText = null;
  document.getElementById("toast").style.display = "none";
}
document.getElementById("toast").addEventListener("click", hideToast);

function answerClarification(option) {
  const original = pendingText;
  pendingText = null;
  hideToast();
  if (original) submitEntry(original + " (clarification: " + option + ")");
}

/* Loading bar: shows staged progress so the delay between typing and the
   ledger updating is legible instead of a mystery pause. */
let loadTimer = null;
function startLoad(offline) {
  const bar = document.getElementById("loadbar");
  const fill = document.getElementById("loadbar-fill");
  const label = document.getElementById("loadbar-label");
  bar.classList.add("on");
  let pct = 0;
  const stages = offline
    ? [[30,"Reading entry…"],[70,"Adding to ledger…"],[95,"Saving…"]]
    : [[15,"Sending to Claude…"],[45,"Estimating calories…"],[75,"Waiting for response…"],[92,"Saving to ledger…"]];
  let si = 0;
  fill.style.width = "8%";
  label.textContent = stages[0][1];
  clearInterval(loadTimer);
  loadTimer = setInterval(() => {
    /* Creep toward the next stage target so the bar always feels alive
       even when a network call takes a while. */
    const target = stages[Math.min(si, stages.length-1)][0];
    pct += (target - pct) * 0.25;
    fill.style.width = pct.toFixed(0) + "%";
    if (pct >= target - 1 && si < stages.length-1) { si++; label.textContent = stages[si][1]; }
  }, 300);
}
function finishLoad(ok) {
  clearInterval(loadTimer);
  const bar = document.getElementById("loadbar");
  const fill = document.getElementById("loadbar-fill");
  const label = document.getElementById("loadbar-label");
  fill.style.width = "100%";
  label.textContent = ok ? "Done ✓" : "Failed";
  setTimeout(() => { bar.classList.remove("on"); fill.style.width = "0%"; }, 500);
}

async function handleSend() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  submitEntry(text);
}
/* Put the words back in the box so a failure never costs you the typing. */
function restoreEntry(text) {
  if (!input) return;
  if (!input.value) input.value = text;
  input.focus();
}

async function submitEntry(text) {
  sendBtn.disabled = true; sendBtn.textContent = "…";
  const key = localStorage.getItem(LS_KEY);
  startLoad(!key);
  try {
    const result = key ? await parseWithClaude(text, key) : parseOffline(text);

    /* Claude may ask a clarifying question (size / type / quantity). */
    if (result.question && result.question.text && Array.isArray(result.question.options) && result.question.options.length) {
      finishLoad(true);
      pendingText = text;
      showToast(result.question.text, null, result.question.options.slice(0, 4));
      return;
    }

    forceSelectedDate(result.updates, text);
    const applied = applyUpdates(result.updates || []);
    if (applied) {
      const bytes = saveDiary();
      finishLoad(true);
      showToast(result.reply, {ok:true, text:"Saved to " + fmtDay(selected) + " at " + fmtTime(new Date()) + "."});
      /* Only follow the entry if the user explicitly named another day. */
      if (mentionsADay(text) && result.updates[0] && result.updates[0].date) selected = result.updates[0].date;
    } else {
      finishLoad(true);
      showToast(result.reply || "Nothing to log from that.", null);
    }
    render();
  } catch(e) {
    finishLoad(false);
    restoreEntry(text);
    showToast(null, {ok:false, text: e.message + " \u2014 your text is back in the box, tap Log to retry."});
  } finally {
    sendBtn.disabled = false; sendBtn.textContent = "Log";
  }
}

/* Does the message actually name a different day? Only then do we let the
   model choose the date; otherwise entries always land on the day you're
   looking at. Guessing here is what made inserted days appear to vanish. */
function mentionsADay(text) {
  return /\b(yesterday|today|tomorrow|tonight|last night|this morning|this afternoon|this evening|mon|tue|wed|thu|fri|sat|sun|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\b|\d{1,2}\s*\/\s*\d{1,2}|\b\d{1,2}(st|nd|rd|th)\b/i.test(text || "");
}
function forceSelectedDate(updates, userText) {
  if (mentionsADay(userText)) return updates;
  (updates || []).forEach(u => { u.date = selected || todayISO(); });
  return updates;
}

function applyUpdates(updates) {
  let touched = false;
  for (const u of updates) {
    const date = u.date || selected || todayISO();
    const entry = ensureDay(date);
    if (Array.isArray(u.removeIndexes) && u.removeIndexes.length) {
      const drop = new Set(u.removeIndexes);
      entry.meals = entry.meals.filter((_,i)=>!drop.has(i));
      touched = true;
    }
    if (Array.isArray(u.removeExerciseIndexes) && u.removeExerciseIndexes.length) {
      const dropE = new Set(u.removeExerciseIndexes);
      entry.exercise = entry.exercise.filter((_,i)=>!dropE.has(i));
      touched = true;
    }
    if (Array.isArray(u.addMeals)) for (const m of u.addMeals) {
      if (m && typeof m.name==="string" && typeof m.kcal==="number") {
        const meal = { id: newId(), name: m.name, kcal: Math.round(m.kcal) };
        if (m.note) meal.note = m.note;
        entry.meals.push(meal); touched = true;
      }
    }
    if (Array.isArray(u.addExercise)) for (const m of u.addExercise) {
      if (m && typeof m.name==="string" && typeof m.kcal==="number") {
        const ex = { id: newId(), name: m.name, kcal: Math.abs(Math.round(m.kcal)) };
        if (m.note) ex.note = m.note;
        entry.exercise.push(ex); touched = true;
      }
    }
    if (typeof u.weightKg==="number") { entry.weightKg = u.weightKg; touched = true; }
    if (typeof u.bodyFatPct==="number") { entry.bodyFatPct = u.bodyFatPct; touched = true; }
  }
  return touched;
}

/* Offline fallback: "name = kcal", "weight 72.5", "bf 18" */
function parseOffline(text) {
  const t = text.trim();
  let m = t.match(/^weight\s+([\d.]+)/i);
  if (m) return { updates:[{date:selected, weightKg:bodyWeightToKg(m[1])}], reply:"Weight logged: "+m[1]+" "+getUnits()+"." };
  m = t.match(/^(?:bf|body\s*fat)\s+([\d.]+)/i);
  if (m) return { updates:[{date:selected, bodyFatPct:parseFloat(m[1])}], reply:"Body fat logged: "+m[1]+"%." };
  m = t.match(/^(.+?)\s*=\s*-\s*(\d+)\s*$/);
  if (m) return { updates:[{date:selected, addExercise:[{name:m[1].trim(), kcal:parseInt(m[2],10)}]}], reply:"Exercise logged: "+m[1].trim()+" — "+m[2]+" kcal burned." };
  m = t.match(/^(.+?)\s*=\s*(\d+)\s*$/);
  if (m) return { updates:[{date:selected, addMeals:[{name:m[1].trim(), kcal:parseInt(m[2],10)}]}], reply:"Logged "+m[1].trim()+" — "+m[2]+" kcal." };
  return { updates: [], reply: "No API key set, so I can only parse: food name = 350, exercise name = -300, weight 72.5, or bf 18. Add a key in the Data tab for natural-language logging." };
}

async function parseWithClaude(userText, apiKey) {
  const prompt = `You are the meal-logging parser inside a calorie-tracking app called Fitness Tracker.
Today's date is ${todayISO()}.
The user is currently viewing ${selected}. Log every entry to ${selected} unless the message explicitly names a different day (e.g. "yesterday", "on Monday", a specific date) — in that case resolve it against today's date.

Current diary (JSON). Meal indexes are the array positions shown:
${JSON.stringify(diary, null, 1)}

The user typed: "${userText}"

Interpret this as diary updates. Estimate calories realistically (typical restaurant/label values, sensible rounding). Resolve relative days like "yesterday" against today's date. If a calorie count is label-confirmed, use it exactly with note "Label-confirmed". For corrections/removals, use removeIndexes (meals) or removeExerciseIndexes (exercise) on the matching array index for that date. The user enters bodyweight in ${getUnits()} — the weightKg field MUST be in kilograms, so convert if they are using pounds (divide by 2.20462). Body fat is %. If the message isn't loggable, return empty updates and answer briefly in "reply".

EXERCISE: if the user describes physical activity (a run, gym session, cycling, a long walk, sport, etc.), log it in addExercise with kcal = estimated calories BURNED (positive number). Estimate from activity, duration/distance, and intensity for an adult weighing ${latestWeight() != null ? latestWeight() : 73} kg; if duration or intensity is missing and it changes the estimate meaningfully, ask a clarifying question instead. Exercise reduces the day's net calories in the app automatically — never log it as a negative meal.

IMPORTANT — clarifying questions: if the calorie estimate would swing meaningfully (roughly 75+ kcal) based on size, quantity, preparation, or type that the user did not specify (e.g. "an apricot" could be small/large/dried, "a latte" could be 8/12/16 oz or whole/skim/oat milk, "fries" could be small/medium/large), do NOT guess. Instead return empty updates and a "question" object with 2-4 short tappable options, each including its approximate kcal, e.g. {"text":"What kind of apricot?","options":["Fresh, small (~17 kcal)","Fresh, large (~35 kcal)","Dried, 5 pieces (~85 kcal)"]}. Ask at most ONE question per message and only when it genuinely matters — if the message says "(clarification: …)" it contains the answer, so log it without asking again. For trivial ambiguity, just use the typical value.

Respond with ONLY a JSON object, no markdown fences:
{"updates":[{"date":"YYYY-MM-DD","addMeals":[{"name":"string","kcal":0,"note":"optional"}],"addExercise":[{"name":"string","kcal":0,"note":"optional"}],"removeIndexes":[],"removeExerciseIndexes":[],"weightKg":null,"bodyFatPct":null}],"question":null,"reply":"short confirmation with kcal breakdown"}`;

  const data = await callClaude(apiKey, {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages: [{ role: "user", content: prompt }],
  });
  const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

/* ============================ boot ============================ */
document.getElementById("goal-label").textContent = getGoal().toLocaleString();
document.getElementById("ver-label").textContent = APP_VERSION;
try {
  if (!Object.keys(diary).length) { ensureDay(todayISO()); selected = todayISO(); }
  if (!localStorage.getItem(LS_DIARY)) saveDiary(); // persist first run
} catch(e) {
  showToast(null,{ok:false,text:"WARNING: this browser blocked storage — data will NOT persist. "+e.message});
}
/* One-off repair: earlier builds made day deletions permanent, so days you
   re-added kept vanishing on sync. Clear those day-level tombstones once. */
try {
  if (!localStorage.getItem("ledger-daytomb-fix")) {
    const t = getDeleted();
    let n = 0;
    Object.keys(t).forEach(id => { if (id.indexOf("DAY:") === 0) { delete t[id]; n++; } });
    if (n) localStorage.setItem(LS_DELETED, JSON.stringify(t));
    localStorage.setItem("ledger-daytomb-fix", "1");
    if (n) { lastPushedFingerprint = ""; }
  }
} catch(e) {}

/* Give any pre-existing items stable ids before the first merge runs. */
if (ensureItemIds()) { try { localStorage.setItem(LS_DIARY, JSON.stringify(diary)); } catch(e) {} }
render();
refreshSyncChip();
/* Sync on open so you always start from the latest across devices. */
if (ghToken()) syncNow(true);
document.addEventListener("visibilitychange", () => {
  if (ghToken()) syncNow(true);
});
setInterval(() => {
  if (!ghToken() || syncing) return;
  if (document.visibilityState !== "visible") return;
  if (Date.now() < rateLimitedUntil) { refreshSyncChip(); return; }
  syncNow(true);
}, 45000);
</script>
