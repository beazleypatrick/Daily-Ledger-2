/* ===== Targets =====
   Two sources, coach wins:
   - LOCAL: a progressive-overload rule computed from the last logged set.
   - COACH: explicit targets returned by Claude, stored per exercise.
   Targets are stored with the unit they were set in and converted on display. */
function getTargets() {
  try { return JSON.parse(localStorage.getItem(LS_TARGETS)) || {}; } catch(e) { return {}; }
}
function saveTargets(t) {
  const payload = JSON.stringify(t);
  localStorage.setItem(LS_TARGETS, payload);
  if (localStorage.getItem(LS_TARGETS) !== payload) throw new Error("Read-back after save did not match.");
  queuePush();
  return payload.length;
}
/* Top of the prescribed rep range, e.g. "4 × 8–10" -> 10 */
function topReps(setsStr) {
  const nums = (setsStr || "").match(/\d+/g);
  if (!nums || nums.length < 2) return null;
  return parseInt(nums[nums.length-1], 10);
}
/* Isolation lifts move in smaller jumps than compounds. */
function isIsolation(name) {
  return /curl|raise|pushdown|extension|fly|face pull|squeeze/i.test(name);
}
function increment(name) {
  const U = getUnits();
  if (U === "lb") return isIsolation(name) ? 2.5 : 5;
  return isIsolation(name) ? 1 : 2.5;
}
/* Local suggestion: hit the top of the rep range -> add weight; otherwise
   repeat the weight and chase one more rep. */
/* Swap options offered when a lift stops moving. */
const ALTERNATIVES = {
  "Dumbbell bench press": ["Barbell bench press", "Weighted push-ups", "Machine chest press"],
  "Incline dumbbell press": ["Incline barbell press", "Low-to-high cable fly"],
  "Chest fly (your squeeze machine)": ["Cable fly", "Dumbbell fly on a bench"],
  "Triceps rope pushdown": ["Straight-bar pushdown", "Single-arm cable pushdown"],
  "Overhead triceps extension": ["Skull crushers", "Dumbbell kickbacks"],
  "Lat pulldown": ["Assisted pull-ups", "Wide-grip pulldown"],
  "Seated cable row": ["Barbell row", "Chest-supported dumbbell row"],
  "Dumbbell curls": ["Barbell curls", "Incline dumbbell curls", "Cable curls"],
  "Hammer curls": ["Rope hammer curls", "Reverse curls"],
  "Face pulls": ["Rear delt fly", "Band pull-aparts"],
  "Goblet squat": ["Barbell back squat", "Leg press", "Bulgarian split squat"],
  "Romanian deadlift": ["Dumbbell RDL", "Leg curl machine"],
  "Dumbbell shoulder press": ["Barbell overhead press", "Machine shoulder press"],
  "Lateral raises": ["Cable lateral raises", "Machine lateral raises"],
  "EZ-bar or dumbbell curls": ["Preacher curls", "Concentration curls"],
  "Close-grip press or bench dips": ["Parallel-bar dips", "Close-grip push-ups"],
};

/* How many recent sessions sat at the same weight without rep progress. */
function stallLength(ex) {
  const h = exHistory(ex.n).filter(s => s.weight);
  if (h.length < 2) return 0;
  const lastW = weightInKg(h[h.length-1]);
  let n = 0;
  for (let i = h.length-1; i >= 0; i--) {
    if (Math.abs(weightInKg(h[i]) - lastW) < 0.3) n++; else break;
  }
  return n;
}

/* ===== Starting weights =====
   Until you've logged a lift there's nothing to progress from, so estimate a
   conservative first working weight from bodyweight. These are fractions of
   bodyweight for a ~3-sets-of-8-to-10 working set, deliberately on the light
   side: it's much better to find set one easy and go up than to fail reps.
   For "each" lifts the fraction is PER DUMBBELL. */
const START_RATIOS = {
  "Dumbbell bench press": 0.22, "Incline dumbbell press": 0.18,
  "Chest fly (your squeeze machine)": 0.34, "Triceps rope pushdown": 0.30,
  "Overhead triceps extension": 0.20, "Lat pulldown": 0.55,
  "Seated cable row": 0.52, "Dumbbell curls": 0.13, "Hammer curls": 0.14,
  "Face pulls": 0.20, "Goblet squat": 0.34, "Romanian deadlift": 0.25,
  "Dumbbell shoulder press": 0.15, "Lateral raises": 0.075,
  "EZ-bar or dumbbell curls": 0.28, "Close-grip press or bench dips": 0.45,
};
/* Fallback by movement type when the coach has swapped an exercise in. */
const FIG_RATIOS = { bench:0.22, press:0.18, fly:0.30, pushdown:0.28, curl:0.13,
                     row:0.50, pulldown:0.52, squat:0.34, plank:0, treadmill:0, run:0 };

function roundToIncrement(v, inc) { return Math.max(inc, Math.round(v / inc) * inc); }

function startingTarget(ex) {
  /* Bodyweight movements still deserve a target — just not a load. */
  if (ex.load === "body") {
    return { weight: "", reps: "", sets: "", verdict: "START HERE",
             why: "Bodyweight \u2014 no weight to pick. Log the time or reps you manage and beat it next time.",
             change: null, src: "start" };
  }
  /* Work out bodyweight from a weigh-in, else the profile, else a sane
     default. Previously this returned nothing when both were blank, which is
     why new exercises showed no suggestion at all. */
  let kg = latestWeight();
  let guessed = false;
  if (kg == null) {
    const pw = parseFloat(getProfile().weight);
    if (!isNaN(pw) && pw > 0) kg = bodyWeightToKg(getProfile().weight);
  }
  if (kg == null) { kg = 73; guessed = true; }
  const bw = getUnits() === "kg" ? kg : kg * LB_PER_KG;
  let ratio = START_RATIOS[ex.n];
  if (ratio == null) ratio = FIG_RATIOS[ex.fig];
  if (ratio == null) ratio = 0.20;
  if (ratio === 0) return null;

  /* Age nudge: a small reduction past 40 keeps first sessions sensible. */
  const age = parseInt(getProfile().age, 10);
  if (!isNaN(age) && age > 40) ratio *= (1 - Math.min((age - 40) * 0.005, 0.15));

  const inc = increment(ex.n);
  const weight = roundToIncrement(bw * ratio, inc);
  const cap = topReps(ex.s);
  return {
    weight: weight,
    reps: cap ? String(Math.max(cap - 2, 6)) : "8",
    sets: (ex.s.match(/^(\d+)/) || [null,"3"])[1],
    verdict: "START HERE",
    why: guessed
      ? "Rough estimate \u2014 add your weight under Your details for a better one. If set one feels easy, go up."
      : "Estimated from your bodyweight, deliberately light. If set one feels easy, go up straight away.",
    change: null,
    src: "start",
  };
}

function localTarget(ex) {
  const last = lastSet(ex.n);
  if (!last || !last.weight) return startingTarget(ex);
  const cap = topReps(ex.s);
  const lastReps = parseInt(last.reps, 10);
  const shown = parseFloat(toDisplayWeight(last.weight, setUnitOf(last)));
  if (isNaN(shown)) return null;
  const U = getUnits();
  const stall = stallLength(ex);
  const lastLine = shown + " " + U + (isNaN(lastReps) ? "" : " × " + lastReps + " reps");

  /* Earned the increase. */
  if (cap && !isNaN(lastReps) && lastReps >= cap) {
    const up = round1(shown + increment(ex.n));
    return {
      weight: up,
      reps: cap ? String(Math.max(cap - 2, 1)) : last.reps,
      sets: last.sets || "",
      verdict: "GO UP",
      why: "You hit " + lastReps + " reps last time, so add weight.",
      change: lastLine + "  →  " + up + " " + U,
      src: "local",
    };
  }

  /* Stuck at the same load for several sessions — change something. */
  if (stall >= 3) {
    const alts = ALTERNATIVES[ex.n];
    return {
      weight: round1(shown),
      reps: (!isNaN(lastReps) ? String(lastReps + 1) : last.reps),
      sets: last.sets || "",
      verdict: "STUCK",
      why: "Same weight " + stall + " sessions running. Either force one extra rep per set, or swap to " +
           (alts ? alts[0] : "a different variation") + " for a few weeks and come back stronger.",
      change: lastLine + "  →  same weight, +1 rep",
      alts: alts || null,
      src: "local",
    };
  }

  /* Normal case: repeat the weight and beat the reps. */
  return {
    weight: round1(shown),
    reps: (!isNaN(lastReps) ? String(lastReps + 1) : last.reps),
    sets: last.sets || "",
    verdict: "REPEAT +1 REP",
    why: "Same weight as last time. Get one more rep per set, then the weight goes up next session.",
    change: lastLine + "  →  " + shown + " " + U + (isNaN(lastReps) ? "" : " × " + (lastReps+1) + " reps"),
    src: "local",
  };
}
/* Coach target if present (converted to current units), else local rule. */
function targetFor(ex) {
  const t = getTargets()[ex.n];
  if (t && t.weight) {
    return {
      weight: round1(parseFloat(toDisplayWeight(t.weight, t.unit === "kg" ? "kg" : "lb"))),
      reps: t.reps || "",
      sets: t.sets || "",
      verdict: "COACH",
      why: t.why || "",
      change: null,
      src: "coach",
    };
  }
  return localTarget(ex);
}

/* Units: 'lb' or 'kg'. Lift weights are stored exactly as entered along with
   the unit used, so switching display never corrupts past entries — we convert
   on the way out, not in storage. Body weight stays canonical in kg. */
function getUnits() { return localStorage.getItem(LS_UNITS) === "kg" ? "kg" : "lb"; }
function setUnits(u) {
  localStorage.setItem(LS_UNITS, u === "kg" ? "kg" : "lb");
  render();
  showToast(null, {ok:true, text:"Weights now shown in " + getUnits() + "."});
}
const LB_PER_KG = 2.20462;
function toDisplayWeight(val, storedUnit) {
  const n = parseFloat(val);
  if (isNaN(n)) return "";
  const su = storedUnit === "kg" ? "kg" : "lb";
  const du = getUnits();
  if (su === du) return String(round1(n));
  return String(round1(su === "kg" ? n * LB_PER_KG : n / LB_PER_KG));
}
function round1(n) { return Math.round(n * 10) / 10; }
/* Body weight helpers — diary always holds kg. */
function bodyWeightDisplay(kg) {
  if (kg == null) return null;
  return getUnits() === "kg" ? round1(kg) : round1(kg * LB_PER_KG);
}
function bodyWeightToKg(entered) {
  const n = parseFloat(entered);
  if (isNaN(n)) return null;
  return getUnits() === "kg" ? n : round1(n / LB_PER_KG);
}

/* No personal data ships in this file — every device starts blank
   and keeps its own private log in that browser's storage. */
const SEED_DIARY = {};

function getGoal() {
  const g = parseInt(localStorage.getItem(LS_GOAL), 10);
  return (g && g > 0) ? g : DEFAULT_GOAL;
}

/* ============================ state ============================ */
let diary = loadDiary();
let selected = pickDefaultDate();
let currentTab = "log";
let trendWin = 7;
let charts = [];

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function loadDiary() {
  try {
    const raw = localStorage.getItem(LS_DIARY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through */ }
  return JSON.parse(JSON.stringify(SEED_DIARY));
}
function saveDiary() {
  const payload = JSON.stringify(diary);
  localStorage.setItem(LS_DIARY, payload);
  const check = localStorage.getItem(LS_DIARY);
  if (check !== payload) throw new Error("Read-back after save did not match.");
  queuePush();
  return payload.length;
}
function pickDefaultDate() {
  const dates = Object.keys(diary).sort();
  return dates.includes(todayISO()) ? todayISO() : (dates[dates.length-1] || todayISO());
}
function ensureDay(d) {
  if (!diary[d]) {
    diary[d] = { weightKg: null, bodyFatPct: null, meals: [], exercise: [] };
    /* Re-creating a previously deleted day must outrank the old tombstone,
       including the copy held by the other device. */
    if (getDeleted()["DAY:" + d] || getRevived()["DAY:" + d]) markRevived("DAY:" + d);
  }
  if (!diary[d].exercise) diary[d].exercise = []; // older saved days
  return diary[d];
}
function dayTotal(d) { return (diary[d] ? diary[d].meals : []).reduce((s,m)=>s+(m.kcal||0),0); }
function dayBurn(d) { return ((diary[d] && diary[d].exercise) ? diary[d].exercise : []).reduce((s,m)=>s+(m.kcal||0),0); }
function dayNet(d) { return dayTotal(d) - dayBurn(d); }

/* Days that actually have something logged — empty days don't drag the average. */
function loggedDates() {
  return Object.keys(diary).filter(d => {
    const e = diary[d];
    return e && ((e.meals && e.meals.length) || (e.exercise && e.exercise.length));
  }).sort();
}
function averages(dates) {
  const withMeals = dates.filter(d => diary[d] && diary[d].meals && diary[d].meals.length);
  if (!withMeals.length) return null;
  const sum = (fn) => withMeals.reduce((s,d)=>s+fn(d),0);
  return {
    days: withMeals.length,
    consumed: Math.round(sum(dayTotal) / withMeals.length),
    burned: Math.round(sum(dayBurn) / withMeals.length),
    net: Math.round(sum(dayNet) / withMeals.length),
  };
}
function fmtDay(iso) { return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fmtShort(iso) { return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"}); }
function fmtTime(d) { return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); }
function esc(s) { const div=document.createElement("div"); div.textContent=s; return div.innerHTML; }

/* ============================ rendering ============================ */
function render() {
  renderRail();
  if (currentTab === "log") renderLog();
  if (currentTab === "trends") renderTrends();
  if (currentTab === "coach") renderCoach();
  if (currentTab === "chat") renderChat();
  if (currentTab === "notes") renderNotes();
  if (currentTab === "data") renderData();
}

/* ===== Quick Adds: auto-learned frequents + user pins ===== */
function getPins() {
  try { return JSON.parse(localStorage.getItem(LS_PINS)) || []; } catch(e) { return []; }
}
function savePins(pins) { localStorage.setItem(LS_PINS, JSON.stringify(pins)); queuePush(); }

/* Tally every meal ever logged; the most frequent become suggestions. */
function frequentItems(limit) {
  const counts = {};
  Object.values(diary).forEach(day => (day.meals||[]).forEach(m => {
    const key = m.name.trim();
    if (!counts[key]) counts[key] = { name: key, kcal: m.kcal, n: 0, note: m.note };
    counts[key].n++;
    counts[key].kcal = m.kcal; // keep most recent kcal
  }));
  const pinNames = new Set(getPins().map(p => p.name));
  return Object.values(counts)
    .filter(c => c.n >= 2 && !pinNames.has(c.name)) // seen at least twice, not already pinned
    .sort((a,b) => b.n - a.n)
    .slice(0, limit || 6);
}

/* Quick-add chips carry an index into these live arrays rather than
   embedding item data in HTML — apostrophes and quotes in food names
   were breaking the old inline-onclick approach. */
let _qaPins = [];
let _qaFreq = [];

function quickAddBar() {
  _qaPins = getPins();
  _qaFreq = frequentItems(6);
  if (!_qaPins.length && !_qaFreq.length) return "";
  const clip = s => s.length > 22 ? s.slice(0,20)+"…" : s;
  let html = '<div class="qa-wrap">';
  if (_qaPins.length) {
    html += '<div class="qa-row">' + _qaPins.map((p,i) =>
      '<button class="qa pin" data-qa="pin" data-i="'+i+'">'+esc(clip(p.name))+
      ' <span>'+p.kcal+'</span><span class="qa-x" data-qa="unpin" data-i="'+i+'">×</span></button>'
    ).join("") + '</div>';
  }
  if (_qaFreq.length) {
    html += '<div class="qa-row">' + _qaFreq.map((f,i) =>
      '<button class="qa" data-qa="freq" data-i="'+i+'">'+
      esc(clip(f.name))+' <span>'+f.kcal+'</span>'+
      '<span class="qa-pin" data-qa="pin-add" data-i="'+i+'">+pin</span></button>'
    ).join("") + '</div>';
  }
  html += '</div>';
  return html;
}

/* One delegated handler on the document catches every quick-add tap. */
function handleQaClick(e) {
  const el = e.target.closest("[data-qa]");
  if (!el) return;
  const action = el.dataset.qa;
  const i = parseInt(el.dataset.i, 10);
  e.stopPropagation();
  if (action === "pin") { const it = _qaPins[i]; if (it) addQuickMeal(it); }
  else if (action === "freq") { const it = _qaFreq[i]; if (it) addQuickMeal(it); }
  else if (action === "unpin") { unpin(i); }
  else if (action === "pin-add") { const it = _qaFreq[i]; if (it) pinItemObj(it); }
}
document.addEventListener("click", handleQaClick);

function addQuickMeal(item) {
  const entry = ensureDay(selected);
  const meal = { id: newId(), name: item.name, kcal: item.kcal };
  if (item.note) meal.note = item.note;
  entry.meals.push(meal);
  try { saveDiary(); showToast(null, {ok:true, text:'Added "'+item.name+'" ('+item.kcal+' kcal) to '+fmtDay(selected)+'.'}); }
  catch(e) { showToast(null, {ok:false, text:"Added on screen but SAVE FAILED: "+e.message}); }
  render();
}
function pinItemObj(item) {
  const pins = getPins();
  if (pins.some(p => p.name === item.name)) return;
  pins.push({ name: item.name, kcal: item.kcal, note: item.note });
  savePins(pins);
  showToast(null, {ok:true, text:'Pinned "'+item.name+'" to Quick Adds.'});
  render();
}
function unpin(i) {
  const pins = getPins();
  pins.splice(i,1);
  savePins(pins);
  render();
}

/* ===== Workout logging =====
   WORKOUTS[exerciseName] = [{date, weight, reps, sets, done}] — newest last.
   Skipped exercises are tracked so the next session can carry them forward. */
function getWorkouts() {
  try { return JSON.parse(localStorage.getItem(LS_WORKOUTS)) || {}; } catch(e) { return {}; }
}
function saveWorkouts(w) {
  const payload = JSON.stringify(w);
  localStorage.setItem(LS_WORKOUTS, payload);
  if (localStorage.getItem(LS_WORKOUTS) !== payload) throw new Error("Read-back after save did not match.");
  queuePush();
  return payload.length;
}
function exHistory(name) {
  const w = getWorkouts();
  return (w[name] || []).filter(s => s.done);
}
function lastSet(name) {
  const h = exHistory(name);
  return h.length ? h[h.length-1] : null;
}
/* Compare across entries regardless of the unit each was logged in.
   Entries saved before the unit toggle existed carry no `unit` field; the
   input was labelled kg back then, so they're treated as kg. */
function setUnitOf(s) { return s.unit === "lb" ? "lb" : "kg"; }
function weightInKg(s) {
  const n = parseFloat(s.weight);
  if (isNaN(n)) return 0;
  return setUnitOf(s) === "kg" ? n : n / LB_PER_KG;
}
/* Best working weight ever logged, for progression nudges. */
function bestSet(name) {
  const h = exHistory(name);
  if (!h.length) return null;
  return h.reduce((b,s) => weightInKg(s) > weightInKg(b) ? s : b, h[0]);
}

/* An exercise counts as "owed" if the last time its day was trained,
   it was left unticked. Those get surfaced at the top of the next session. */
function getSkipped() {
  const w = getWorkouts();
  const owed = [];
  getPlan().forEach(day => day.ex.forEach(e => {
    const entries = w[e.n] || [];
    if (!entries.length) return;
    const last = entries[entries.length-1];
    if (last && !last.done) owed.push({ name: e.n, day: day.name, since: last.date, fig: e.fig, s: e.s });
  }));
  return owed;
}

/* Record a set. done=false marks it explicitly skipped. */
/* Re-rendering the whole Coach tab used to throw you back to the top and
   close the day you were working through. Remember both and restore them. */
/* Wrapper used by every in-place Coach action. */
/* Update ONE exercise card in place. Re-rendering the whole tab was what
   collapsed the open day and threw you back to the top. */
function refreshExCard(exName, dayName) {
  const el = document.getElementById("exc-" + cssId(exName));
  const day = getPlan().find(d => d.name === dayName);
  const ex = day && day.ex.find(x => x.n === exName);
  if (!el || !ex) { renderCoach(); return; }
  el.outerHTML = exCard(ex, dayName);
}

function logSet(exName, dayName) {
  const wEl = document.getElementById("w-"+cssId(exName));
  const rEl = document.getElementById("r-"+cssId(exName));
  const sEl = document.getElementById("s-"+cssId(exName));
  const w = getWorkouts();
  if (!w[exName]) w[exName] = [];
  w[exName].push({
    id: newId(),
    date: todayISO(),
    day: dayName,
    weight: wEl ? wEl.value.trim() : "",
    unit: getUnits(),
    reps: rEl ? rEl.value.trim() : "",
    sets: sEl ? sEl.value.trim() : "",
    done: true,
  });
  try { saveWorkouts(w); showToast(null, {ok:true, text:'Logged "'+exName+'" \u2014 saved.'}); }
  catch(e) { showToast(null, {ok:false, text:"Logged on screen but SAVE FAILED: "+e.message}); }
  refreshExCard(exName, dayName);
}
function skipSet(exName, dayName) {
  const w = getWorkouts();
  if (!w[exName]) w[exName] = [];
  w[exName].push({ date: todayISO(), day: dayName, weight:"", reps:"", sets:"", done: false });
  try { saveWorkouts(w); showToast(null, {ok:true, text:'"'+exName+'" skipped \u2014 carried to next session.'}); }
  catch(e) { showToast(null, {ok:false, text:"SAVE FAILED: "+e.message}); }
  refreshExCard(exName, dayName);
}
function undoLast(exName) {
  const w = getWorkouts();
  if (w[exName] && w[exName].length) {
    const gone = w[exName].pop();
    if (gone) {
      const sig = gone.id || ("W" + strHash(exName + "|" + [gone.date,gone.weight,gone.unit,gone.reps,gone.sets,gone.done].join("|")));
      markDeleted(sig);
    }
  }
  try { saveWorkouts(w); } catch(e) {}
  const last = (getWorkouts()[exName]||[]).slice(-1)[0];
  refreshExCard(exName, (last && last.day) || findDayNameFor(exName));
}
function findDayNameFor(exName) {
  const d = getPlan().find(day => day.ex.some(x => x.n === exName));
  return d ? d.name : "";
}
function cssId(s) { return s.replace(/[^a-zA-Z0-9]/g, "_"); }

/* Did this exercise get logged today (either way)? */
function todayStatus(name) {
  const w = getWorkouts();
  const entries = w[name] || [];
  const t = entries.filter(e => e.date === todayISO());
  if (!t.length) return null;
  return t[t.length-1].done ? "done" : "skipped";
}

/* Build one exercise card with logging controls and history. */
/* Weights are ambiguous unless you say what they refer to: one dumbbell in
   each hand, or the whole bar/stack. Every exercise declares which. */
function loadLabel(ex) {
  if (ex.load === "each") return "each";
  if (ex.load === "body") return "";
  return "total";
}
function loadNote(ex) {
  if (ex.load === "each") return "Weight of ONE dumbbell (what you hold in each hand)";
  if (ex.load === "body") return "Bodyweight \u2014 leave weight blank, log time or reps";
  return "Total weight on the bar or the machine stack";
}

function exCard(e, dayName) {
  const id = cssId(e.n);
  const last = lastSet(e.n);
  const best = bestSet(e.n);
  const status = todayStatus(e.n);
  const U = getUnits();
  const lastDisp = last ? toDisplayWeight(last.weight, setUnitOf(last)) : "";
  const bestDisp = best ? toDisplayWeight(best.weight, setUnitOf(best)) : "";
  const basis = loadLabel(e) ? " " + U + " " + loadLabel(e) : "";
  const histLine = last
    ? 'Last: ' + (lastDisp ? lastDisp + basis : "bodyweight") +
      (last.sets ? " × " + last.sets + " sets" : "") +
      (last.reps ? " × " + last.reps + " reps" : "") +
      " · " + fmtShort(last.date) +
      (best && weightInKg(best) > weightInKg(last) ? "  (best " + bestDisp + " " + U + ")" : "")
    : "No sets logged yet — log today's to start tracking.";

  const tgt = targetFor(e);
  const tgtLine = tgt
    ? '<div class="ex-target'+(tgt.src==="coach"?" coach":"")+(tgt.verdict==="STUCK"?" stuck":"")+'">' +
      '<div class="tg-head">NEXT TIME <span class="tg-verdict '+(tgt.verdict==="GO UP"?"up":tgt.verdict==="STUCK"?"stuck":"same")+'">'+esc(tgt.verdict||"TARGET")+'</span></div>' +
      '<div class="tg-nums"><b>'+tgt.weight+'</b> '+U+(loadLabel(e)?' <span class="tg-basis">'+loadLabel(e)+'</span>':'')+
        (tgt.sets ? ' <span class="tg-x">×</span> <b>'+esc(String(tgt.sets))+'</b> sets' : '') +
        (tgt.reps ? ' <span class="tg-x">×</span> <b>'+esc(String(tgt.reps))+'</b> reps' : '') +
      '</div>' +
      (tgt.change ? '<div class="tg-change">'+esc(tgt.change)+'</div>' : '') +
      (tgt.why ? '<div class="tg-why">'+esc(tgt.why)+'</div>' : '') +
      (tgt.alts ? '<div class="tg-alts">Swap ideas: '+tgt.alts.map(a=>esc(a)).join(" · ")+'</div>' : '') +
      '</div>'
    : '';

  /* Prefill with the target when there is one, so the number in the box is
     what to aim for, not what you already did. */
  const preW = tgt ? String(tgt.weight) : lastDisp;
  const preR = tgt && tgt.reps ? String(tgt.reps) : (last && last.reps ? last.reps : "");
  const preS = tgt && tgt.sets ? String(tgt.sets) : (last && last.sets ? last.sets : "");

  return '<div class="ex-card' + (status==="done" ? " ex-done" : status==="skipped" ? " ex-skipped" : "") + '" id="exc-' + id + '">' +
    '<div class="ex-fig">'+exSvg(e.fig)+'</div>' +
    '<div class="ex-info">' +
      '<div class="ex-name">'+esc(e.n)+ (status==="done" ? ' <span class="ex-tick">✓</span>' : status==="skipped" ? ' <span class="ex-skip-tag">skipped</span>' : '') +'</div>' +
      '<div class="ex-sets">'+esc(e.s)+'<span class="ex-basis">'+esc(loadNote(e))+'</span></div>' +
      tgtLine +
      '<ul class="ex-cues">'+e.c.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>' +
      (e.p ? '<div class="ex-prog">▲ '+esc(e.p)+'</div>' : '') +
      '<div class="ex-hist">'+esc(histLine)+'</div>' +
      '<div class="ex-log">' +
        '<div class="lf"><label>'+(loadLabel(e)?U+' '+loadLabel(e):'—')+'</label><input id="w-'+id+'" inputmode="decimal" value="'+esc(preW)+'"></div>' +
        '<div class="lf"><label>sets</label><input id="s-'+id+'" inputmode="numeric" value="'+esc(preS)+'"></div>' +
        '<div class="lf"><label>reps</label><input id="r-'+id+'" inputmode="numeric" value="'+esc(preR)+'"></div>' +
        '<button class="co-btn sm" data-ex-log="'+esc(e.n)+'" data-ex-day="'+esc(dayName)+'">✓ Did it</button>' +
        '<button class="co-btn sm ghost" data-ex-skip="'+esc(e.n)+'" data-ex-day="'+esc(dayName)+'">Skip</button>' +
        (status ? '<button class="co-btn sm ghost" data-ex-undo="'+esc(e.n)+'">Undo</button>' : '') +
        '<button class="co-btn sm ghost" data-ex-swap="'+esc(e.n)+'" data-ex-day="'+esc(dayName)+'" title="Ask the coach to replace this">Swap</button>' +
      '</div>' +
    '</div></div>';
}

/* Delegated handler — keeps exercise names out of inline JS so apostrophes
   and quotes can't break the buttons (same bug class as quick-adds). */
document.addEventListener("click", function(e) {
  const l = e.target.closest("[data-ex-log]");
  if (l) { logSet(l.dataset.exLog, l.dataset.exDay); return; }
  const s = e.target.closest("[data-ex-skip]");
  if (s) { skipSet(s.dataset.exSkip, s.dataset.exDay); return; }
  const u = e.target.closest("[data-ex-undo]");
  if (u) { undoLast(u.dataset.exUndo); return; }
  const sw = e.target.closest("[data-ex-swap]");
  if (sw) { requestSwap(sw.dataset.exSwap, sw.dataset.exDay); return; }
});

/* Ask the coach to replace one exercise, in one tap. */
function requestSwap(exName, dayName) {
  const key = localStorage.getItem(LS_KEY);
  if (!key) { showToast(null, {ok:false, text:"Add your API key in the Data tab to use swaps."}); return; }
  const why = prompt("Swap out \"" + exName + "\" — why? (e.g. no equipment, hurts my shoulder, too easy)", "I don't have access to this equipment");
  if (why === null) return;
  const inp = document.getElementById("coach-q");
  const msg = "Replace " + exName + " on " + dayName + ". Reason: " + (why || "I want something different") + ". Update my plan.";
  if (inp) { inp.value = msg; sendCoachChat(); }
  else { pendingCoachMsg = msg; switchTab("coach"); setTimeout(() => { const i2 = document.getElementById("coach-q"); if (i2) { i2.value = msg; sendCoachChat(); } }, 50); }
}
let pendingCoachMsg = null;

/* ===== Workout scheduling =====
   With a 4-day rotation trained ~4x/week, each day comes round roughly every
   4 days. Work out when each was last done and when it's next due. */
const ROTATION_DAYS = 4;

function dayLastDone(dayName) {
  const w = getWorkouts();
  let latest = null;
  Object.keys(w).forEach(ex => {
    w[ex].forEach(s => {
      if (s.done && s.day === dayName) {
        if (!latest || s.date > latest) latest = s.date;
      }
    });
  });
  return latest;
}
function daysBetween(a, b) {
  return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000);
}
function dayScheduleInfo(dayName) {
  const last = dayLastDone(dayName);
  if (!last) return { text: "Not done yet", state: "due", badge: "START HERE" };
  const due = shiftDate(last, ROTATION_DAYS);
  const diff = daysBetween(todayISO(), due);
  const ago = daysBetween(last, todayISO());
  const agoText = ago === 0 ? "today" : ago === 1 ? "yesterday" : ago + " days ago";
  if (diff < 0) return { text: "Last done " + agoText, state: "over", badge: "OVERDUE " + Math.abs(diff) + "D" };
  if (diff === 0) return { text: "Last done " + agoText, state: "due", badge: "DUE TODAY" };
  return { text: "Last done " + agoText, state: "rest", badge: "NEXT IN " + diff + "D" };
}
/* Which day should he train next? The one longest since it was done. */
function nextUpDay() {
  let best = null, bestScore = -Infinity;
  getPlan().forEach((d, i) => {
    const last = dayLastDone(d.name);
    const score = last ? daysBetween(last, todayISO()) : 999;
    if (score > bestScore) { bestScore = score; best = { day: d, idx: i, last: last }; }
  });
  return best;
}
/* Banner shown right after finishing a session. */
function nextUpPanel() {
  const w = getWorkouts();
  const anyLogged = Object.values(w).some(arr => arr.some(s => s.done));
  if (!anyLogged) return "";
  const up = nextUpDay();
  if (!up) return "";
  const info = dayScheduleInfo(up.day.name);
  const due = up.last ? shiftDate(up.last, ROTATION_DAYS) : todayISO();
  const diff = up.last ? daysBetween(todayISO(), due) : 0;
  const when = !up.last ? "whenever you're ready"
    : diff <= 0 ? "ready now" : fmtDay(due) + " (in " + diff + " day" + (diff===1?"":"s") + ")";
  return '<div class="nextup"><div class="nu-l">Next session</div>' +
    '<div class="nu-day">'+esc(up.day.name)+'</div>' +
    '<div class="nu-when">'+esc(when)+'</div></div>';
}

/* Shows exercises left unticked last time so they get picked up next session. */
function carryForwardPanel() {
  const owed = getSkipped();
  if (!owed.length) return "";
  return '<div class="co-box" style="border-color:var(--amber-dim)">' +
    '<div class="t" style="color:var(--amber)">Carried forward — '+owed.length+' skipped</div>' +
    '<div class="co-sub" style="margin-bottom:8px">These were skipped last time. Add them to your next session, or tick them off when you catch up.</div>' +
    owed.map(o =>
      '<div class="carry-row"><span>'+esc(o.name)+'</span>' +
      '<span class="carry-meta">'+esc(o.s)+' · skipped '+fmtShort(o.since)+'</span></div>'
    ).join("") +
    '</div>';
}

/* Local progression read — plain arithmetic on the logged sets, so it works
   with no API key and gives the AI coach something concrete to react to. */
function progressionReport() {
  const w = getWorkouts();
  const lines = [];
  Object.keys(w).forEach(name => {
    const h = w[name].filter(s => s.done && s.weight);
    if (h.length < 2) return;
    const first = h[0], last = h[h.length-1];
    const dw = weightInKg(last) - weightInKg(first); // compare in kg regardless of entry unit
    lines.push({
      name,
      from: toDisplayWeight(first.weight, setUnitOf(first)),
      to: toDisplayWeight(last.weight, setUnitOf(last)),
      dw, span: h.length, since: first.date,
    });
  });
  return lines;
}
function progressionInner() {
  const rows = progressionReport();
  const w = getWorkouts();
  const totalSets = Object.values(w).reduce((s,arr)=>s+arr.filter(x=>x.done).length,0);
  if (!totalSets) return '<div class="co-sub">Nothing logged yet. Enter weight and reps on a card and tap <b>Did it</b>. After two sessions per lift the trend shows up here.</div>';
  const stalled = rows.filter(r => r.dw <= 0 && r.span >= 3);
  const gaining = rows.filter(r => r.dw > 0);
  const U = getUnits();
  return '<div class="co-sub" style="margin-bottom:8px">'+totalSets+' sets logged</div>' +
    (gaining.length ? '<div class="co-sub" style="color:var(--blue)">\u25b2 Moving up: ' +
      gaining.map(r=>esc(r.name)+" "+r.from+"\u2192"+r.to+" "+U).join(" \u00b7 ") + '</div>' : '') +
    (stalled.length ? '<div class="co-sub" style="color:#8A6410;margin-top:6px">\u25a0 Stalled: ' +
      stalled.map(r=>esc(r.name)+" at "+r.to+" "+U+" for "+r.span+" sessions").join(" \u00b7 ") + '</div>' : '') +
    (!gaining.length && !stalled.length ? '<div class="co-sub">Log a couple more sessions per lift and the trend appears here.</div>' : '');
}


/* ===== Coach chat — separate from the general Chat tab, and it sees
   the client's actual training + nutrition data. ===== */
function getCoachChat() {
  try { return JSON.parse(localStorage.getItem(LS_COACHCHAT)) || []; } catch(e) { return []; }
}
function saveCoachChat(h) {
  try { localStorage.setItem(LS_COACHCHAT, JSON.stringify(h.slice(-30))); } catch(e) {}
}

/* Assembles everything the coach knows about the client. */
function coachContext() {
  const p = getProfile();
  const bm = getBodymap();
  const avg = averages(loggedDates());
  const w = getWorkouts();
  const lifts = [];
  Object.keys(w).forEach(name => {
    const h = w[name].filter(s => s.done);
    if (!h.length) return;
    const recent = h.slice(-4).map(s => (s.weight ? toDisplayWeight(s.weight, setUnitOf(s))+getUnits() : "bodyweight")+"×"+(s.reps||"?")+" reps×"+(s.sets||"?")+" sets on "+s.date);
    lifts.push(name + ": " + recent.join(", "));
  });
  const owed = getSkipped().map(o => o.name + " (skipped " + o.since + ")");
  const recentBurn = [];
  Object.keys(diary).sort().slice(-14).forEach(d => (diary[d].exercise||[]).forEach(x => recentBurn.push(d+": "+x.name)));
  const U = getUnits();
  const hUnit = U === "lb" ? "in" : "cm";
  return "UNITS: every weight below is in "+U+". Give all weight recommendations in "+U+" only — do not convert to or mention the other unit.\n" +
    "CLIENT: male, age "+(p.age||"32")+", height "+(p.height||"?")+" "+hUnit+", bodyweight "+(p.weight||(latestWeight()!=null?bodyWeightDisplay(latestWeight()):"?"))+" "+U+". Lives in Arizona (extreme summer heat limits outdoor running).\n" +
    "NUTRITION: calorie goal "+getGoal()+" kcal/day"+(avg?"; actually averaging "+avg.consumed+" kcal/day over "+avg.days+" logged days, net "+avg.net:"; no logged days yet")+".\n" +
    "BODY MAP GOALS — grow: "+(Object.keys(bm).filter(k=>bm[k]==="grow").join(", ")||"none marked")+"; trim: "+(Object.keys(bm).filter(k=>bm[k]==="trim").join(", ")||"none marked")+".\n" +
    "PROGRAM: 4-day split (chest/triceps, back/biceps, legs/core, shoulders/arms), plus 12% incline treadmill walks at 3.0 mph for 20-25 min, and 5K runs 1-2x/month.\n" +
    "LOGGED LIFTS (most recent last): " + (lifts.length ? lifts.join(" | ") : "NONE LOGGED YET") + "\n" +
    "SKIPPED/OWED: " + (owed.length ? owed.join(", ") : "none") + "\n" +
    "RECENT GYM SESSIONS IN LEDGER: " + (recentBurn.slice(-8).join("; ") || "none") + "\n" +
    "HISTORY: reports poor bicep/tricep/chest growth from light machine work; wants to be lean and proportional; has some waist fat.";
}

/* The coach can edit the plan, so it answers in JSON: prose in `reply`,
   optional structured changes in `planEdits`. */
function COACH_SYSTEM() {
  const plan = getPlan().map(d => d.name + ": " + d.ex.map(e => e.n).join(", ")).join("\n");
  return "You are a strength & conditioning coach inside the client's own training app. " +
    "Be direct, specific and honest — including when the honest answer is that they're under-loading, " +
    "under-eating for muscle growth, or expecting spot reduction. Use their actual logged numbers; if a lift " +
    "hasn't moved in weeks, say so plainly and give the exact next weight to try. Never give medical advice; " +
    "suggest a professional for pain or injury.\n\n" +
    "YOU CAN EDIT THE PLAN. If the client can't do an exercise (no equipment, injury, dislike), or asks for " +
    "something different, harder, or extra — change the plan yourself using planEdits. Don't just suggest it in words. " +
    "Match the muscle group when swapping, and pick a substitute that needs different equipment from the one being replaced.\n\n" +
    "CURRENT PLAN:\n" + plan + "\n\n" +
    "CLIENT:\n" + coachContext() + "\n\n" +
    "Reply with ONLY a JSON object, no markdown fences:\n" +
    '{"reply":"your answer in plain text, under 180 words, no markdown","planEdits":[]}\n\n' +
    "Each planEdit is one of:\n" +
    '{"action":"replace","day":"exact day name from the plan","target":"exact current exercise name","exercise":{"n":"New Exercise Name","fig":"one of: bench press curl pushdown row pulldown squat plank treadmill run fly","load":"each|total|body","s":"4 × 8–10","c":["one or two short form cues"],"p":"progression rule"}}\n' +
    '{"action":"add","day":"exact day name","exercise":{ ...same shape... }}\n' +
    '{"action":"remove","day":"exact day name","target":"exact exercise name"}\n\n' +
    "load: 'each' = weight of ONE dumbbell, 'total' = whole bar or machine stack, 'body' = bodyweight. " +
    "fig picks the little illustration, so choose the closest movement. Leave planEdits empty for ordinary questions.";
}

/* The coach bar sits at the bottom like the food log. It shows the most
   recent exchange only — the full history lives behind "Coach's notes". */
function renderCoachBar() {
  const bar = document.getElementById("coachbar");
  if (!bar) return;
  const key = localStorage.getItem(LS_KEY);
  const inp = document.getElementById("coach-q");
  const send = document.getElementById("coach-send");
  if (inp) inp.disabled = !key;
  if (send) send.disabled = !key;
  if (inp && !inp.dataset.wired) {
    inp.dataset.wired = "1";
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") sendCoachChat(); });
  }
  const h = getCoachChat();
  const box = document.getElementById("coach-reply");
  if (!box) return;
  const lastA = [...h].reverse().find(m => m.role === "assistant");
  if (lastA) {
    showCoachReply(lastA.text);
  } else {
    box.style.display = "none";
  }
}

/* The reply clears itself so it isn't sitting over the workout. Longer
   messages get a little more time to read. */
let coachReplyTimer = null;
function showCoachReply(text) {
  const box = document.getElementById("coach-reply");
  if (!box) return;
  clearTimeout(coachReplyTimer);
  box.textContent = text;
  box.style.display = "block";
  box.onclick = () => { clearTimeout(coachReplyTimer); box.style.display = "none"; };
  if (/Thinking/.test(text)) return; // keep the working indicator up
  const ms = Math.min(12000, Math.max(6000, Math.round(text.length / 12) * 1000));
  coachReplyTimer = setTimeout(() => { box.style.display = "none"; }, ms);
}

async function sendCoachChat() {
  const inp = document.getElementById("coach-q");
  const key = localStorage.getItem(LS_KEY);
  if (!inp || !key) return;
  const q = inp.value.trim();
  if (!q) return;
  let planChanged = false, failed = false;
  const h = getCoachChat();
  h.push({ role: "user", text: q });
  saveCoachChat(h);
  inp.value = "";
  const sendBtn = document.getElementById("coach-send");
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "\u2026"; }
  const rb = document.getElementById("coach-reply");
  if (rb) { rb.textContent = "Thinking\u2026"; rb.style.display = "block"; }
  try {
    const msgs = h.slice(-8).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    const data = await callClaude(key, {
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: COACH_SYSTEM(),
        messages: msgs,
      });
    const raw = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");

    /* The coach replies as JSON so it can change the plan, not just talk
       about it. Fall back to plain text if parsing fails. */
    let text = raw, edits = [];
    try {
      const parsed = JSON.parse(raw.replace(/```json|```/g, "").trim());
      if (parsed && typeof parsed.reply === "string") {
        text = parsed.reply;
        edits = Array.isArray(parsed.planEdits) ? parsed.planEdits : [];
      }
    } catch(err) { /* plain prose reply — fine */ }

    let applied = [];
    if (edits.length) {
      applied = applyPlanEdits(edits);
      if (applied.length) planChanged = true;
      if (applied.length) text += "\n\n\u2713 " + applied.join("\n\u2713 ");
    }

    const h2 = getCoachChat();
    h2.push({ role: "assistant", text: text || "(no response)" });
    saveCoachChat(h2);
    if (applied.length) showToast(null, {ok:true, text:"Plan updated \u2014 " + applied[0]});
  } catch(e) {
    /* Drop the failed question from the history and hand the words back. */
    const h2 = getCoachChat();
    if (h2.length && h2[h2.length-1].role === "user") h2.pop();
    saveCoachChat(h2);
    const back = document.getElementById("coach-q");
    if (back && !back.value) { back.value = q; back.focus(); }
    const rb2 = document.getElementById("coach-reply");
    if (rb2) showCoachReply(e.message + "  Your question is still in the box — tap Ask to retry.");
    failed = true;
  } finally {
    if (planChanged) renderCoach(); else if (!failed) renderCoachBar();
    const b = document.getElementById("coach-send");
    if (b) { b.disabled = false; b.textContent = "Ask"; }
  }
}

/* Ask the coach for concrete target weights per exercise, returned as JSON so
   they can be written onto the workout cards. */
async function refreshTargets(silent) {
  const key = localStorage.getItem(LS_KEY);
  if (!key) return false;
  const btn = document.getElementById("co-tgt-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Setting targets…"; }
  const U = getUnits();
  try {
    const exList = [];
    getPlan().forEach(day => day.ex.forEach(e => {
      if (/walk|run/i.test(e.n)) return; // cardio has no load target
      const last = lastSet(e.n);
      const basis = e.load === "each" ? " [weight = ONE dumbbell, per hand]" : e.load === "body" ? " [bodyweight]" : " [total bar/stack weight]";
      exList.push('"' + e.n + '"' + basis + ' (prescribed ' + e.s + (last && last.weight
        ? '; last logged ' + toDisplayWeight(last.weight, setUnitOf(last)) + U + ' × ' + (last.reps||"?") + ' reps'
        : '; never logged') + ')');
    }));
    const prompt = coachContext() +
      "\n\nSet a concrete target load for the NEXT session of each exercise below. Rules: weights in " + U + " only; " +
      "use realistic gym increments (" + (U==="lb" ? "2.5 or 5 lb" : "1 or 2.5 kg") + "); respect each exercise's bracketed basis — for per-hand dumbbell lifts give the weight of ONE dumbbell, not the pair; if a lift has never been logged, " +
      "suggest a sensible conservative starting weight for this client and say it's a starting estimate; if a lift has stalled, " +
      "either nudge the load or prescribe the same weight for more reps and say so. Prioritise his marked growth areas. " +
      "Keep each 'why' under 8 words.\n\nExercises:\n" + exList.join("\n") +
      "\n\nRespond with ONLY a JSON object, no markdown fences, no other text:\n" +
      '{"targets":[{"name":"exact exercise name from the list","weight":0,"reps":"8-10","sets":"4","why":"short reason"}]}';

    const data = await callClaude(key, { model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] });
    const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());

    /* Only accept targets whose names match real exercises in the plan. */
    const valid = new Set();
    getPlan().forEach(day => day.ex.forEach(e => valid.add(e.n)));
    const t = getTargets();
    let n = 0;
    (parsed.targets || []).forEach(x => {
      if (!x || !valid.has(x.name)) return;
      const wNum = parseFloat(x.weight);
      if (isNaN(wNum) || wNum <= 0) return;
      t[x.name] = { weight: wNum, unit: U, reps: x.reps || "", sets: x.sets || "", why: x.why || "", setAt: todayISO() };
      n++;
    });
    saveTargets(t);
    renderCoach();
    showToast(null, {ok:true, text: n + " target weights written to your workout cards."});
    return true;
  } catch(e) {
    if (!silent) showToast(null, {ok:false, text:"Couldn't set targets: " + e.message});
    if (btn) { btn.disabled = false; btn.textContent = "Set target weights"; }
    return false;
  }
}
function clearTargets() {
  localStorage.removeItem(LS_TARGETS);
  renderCoach();
  showToast(null, {ok:true, text:"Coach targets cleared — cards fall back to automatic progression."});
}

/* ===== Live plan =====
   The plan above is only the starting template. The working plan lives in
   storage so the coach (or you) can swap exercises in and out, and it syncs
   across devices like everything else. COACH_PLAN reads it on every use. */
let PLAN_CACHE = null;
function getPlan() {
  if (PLAN_CACHE) return PLAN_CACHE;
  try {
    const raw = localStorage.getItem(LS_PLAN);
    if (raw) {
      const p = JSON.parse(raw);
      if (Array.isArray(p) && p.length) { PLAN_CACHE = p; return PLAN_CACHE; }
    }
  } catch(e) {}
  PLAN_CACHE = JSON.parse(JSON.stringify(DEFAULT_PLAN));
  return PLAN_CACHE;
}
function savePlan(plan) {
  PLAN_CACHE = plan;
  const payload = JSON.stringify(plan);
  localStorage.setItem(LS_PLAN, payload);
  if (localStorage.getItem(LS_PLAN) !== payload) throw new Error("Read-back after save did not match.");
  queuePush();
  return payload.length;
}
function resetPlan() {
  PLAN_CACHE = null;
  localStorage.removeItem(LS_PLAN);
  queuePush();
  renderCoach();
  showToast(null, {ok:true, text:"Plan reset to the original 4-day split."});
}

/* Apply structured edits from the coach. Returns a list of plain-English
   descriptions of what changed. */
function applyPlanEdits(edits) {
  const plan = JSON.parse(JSON.stringify(getPlan()));
  const done = [];
  const findDay = (name) => {
    if (!name) return null;
    const lower = String(name).toLowerCase();
    return plan.find(d => d.name.toLowerCase() === lower)
        || plan.find(d => d.name.toLowerCase().indexOf(lower) !== -1)
        || plan.find(d => lower.indexOf(d.name.toLowerCase().replace(/^day \d+ — /,"")) !== -1);
  };
  const validFig = ["bench","press","curl","pushdown","row","pulldown","squat","plank","treadmill","run","fly"];
  const clean = (ex) => ({
    fig: validFig.indexOf(ex.fig) !== -1 ? ex.fig : "press",
    n: String(ex.n || "Exercise").slice(0, 60),
    load: ["each","total","body"].indexOf(ex.load) !== -1 ? ex.load : "total",
    s: String(ex.s || "3 × 8–10").slice(0, 40),
    c: Array.isArray(ex.c) ? ex.c.slice(0,3).map(x => String(x).slice(0,140)) : [],
    p: String(ex.p || "").slice(0, 140),
  });

  (edits || []).forEach(e => {
    const day = findDay(e.day);
    if (!day) return;
    if (e.action === "replace" && e.target && e.exercise) {
      const i = day.ex.findIndex(x => x.n.toLowerCase() === String(e.target).toLowerCase());
      if (i !== -1) {
        const oldName = day.ex[i].n;
        day.ex[i] = clean(e.exercise);
        done.push("Swapped " + oldName + " for " + day.ex[i].n + " on " + day.name);
      }
    } else if (e.action === "add" && e.exercise) {
      const ex = clean(e.exercise);
      if (!day.ex.some(x => x.n.toLowerCase() === ex.n.toLowerCase())) {
        day.ex.push(ex);
        done.push("Added " + ex.n + " to " + day.name);
      }
    } else if (e.action === "remove" && e.target) {
      const i = day.ex.findIndex(x => x.n.toLowerCase() === String(e.target).toLowerCase());
      if (i !== -1 && day.ex.length > 1) {
        done.push("Removed " + day.ex[i].n + " from " + day.name);
        day.ex.splice(i, 1);
      }
    }
  });

  if (done.length) {
    try { savePlan(plan); }
    catch(err) { return ["Changed on screen but SAVE FAILED: " + err.message]; }
  }
  return done;
}

function bmSummary() {
  const bm = getBodymap();
  const grow = BM_REGIONS.filter(([k]) => bm[k]==="grow").map(([,l])=>l);

  if (grow.length) out.push("Grow: " + grow.join(", "));
  if (trim.length) out.push("Trim: " + trim.join(", "));
  return out.join("  ·  ") || "Tap the figure to mark goals";
}

/* Collapsible setup panels — collapsed by default so the plan is what you
   see first. State is remembered between visits. */
function toggleBox(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("open");
  const open = {};
  document.querySelectorAll(".co-box.collapsible").forEach(b => { open[b.id] = b.classList.contains("open"); });
  try { localStorage.setItem("ledger-coach-open", JSON.stringify(open)); } catch(e) {}
}
function restoreBoxes() {
  let open = {};
  try { open = JSON.parse(localStorage.getItem("ledger-coach-open")) || {}; } catch(e) {}
  Object.keys(open).forEach(id => {
    const el = document.getElementById(id);
    if (el && open[id]) el.classList.add("open");

async function sendChat() {
  const inp = document.getElementById("chat-q");
  const q = inp.value.trim();
  const key = localStorage.getItem(LS_KEY);
  if (!q || !key) return;
  const hist = getChatHist();
  hist.push({ role: "user", text: q });
  saveChatHist(hist);
  inp.value = "";
  renderChat();
  const sendBtn = document.getElementById("chat-q-send");
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "…"; }
  try {
    const msgs = hist.slice(-10).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    const data = await callClaude(key, {
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: "You are a helpful nutrition and wellness assistant inside a calorie-tracking app. Answer concisely. This is a general Q&A space — do NOT try to log food; just answer questions and offer ideas.",
        messages: msgs,
      });
    const text = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n");
    const h2 = getChatHist();
    h2.push({ role: "assistant", text: text || "(no response)" });
    saveChatHist(h2);
  } catch(e) {
    const h2 = getChatHist();
    if (h2.length && h2[h2.length-1].role === "user") h2.pop();
    saveChatHist(h2);
    renderChat();
    const back = document.getElementById("chat-q");
    if (back) { back.value = q; back.focus(); }
    showToast(null, {ok:false, text: e.message + " Your question is back in the box."});
    return;
  } finally {
    renderChat();
  }
}

/* ---------------- notes ---------------- */
let notesTimer = null;
function renderNotes() {
  const v = document.getElementById("view-notes");
  if (document.getElementById("notes-box")) return; // keep cursor position on re-render
  v.innerHTML =
    '<div class="panel-box"><div class="t">Notes & ideas</div>' +
    '<textarea id="notes-box" placeholder="Meal ideas, app tweaks, anything worth remembering…"></textarea>' +
    '<div class="hint" id="notes-status">Saves automatically as you type.</div></div>';
  const box = document.getElementById("notes-box");
  box.value = localStorage.getItem(LS_NOTES) || "";
  box.addEventListener("input", () => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => {
      try {
        localStorage.setItem(LS_NOTES, box.value);
        document.getElementById("notes-status").textContent =
          "Saved at " + fmtTime(new Date()) + ".";
      } catch(e) {
        document.getElementById("notes-status").textContent = "SAVE FAILED: " + e.message;
      }
    }, 600);
  });
}

function railDates() {
  /* Every logged day, plus today and whatever is selected, so the rail is
     never empty and future days you add stay visible. */
  const set = new Set(Object.keys(diary));
  set.add(todayISO());
  if (selected) set.add(selected);
  return Array.from(set).sort();
}

function renderRail() {
  const rail = document.getElementById("rail");
  const dates = railDates();
  rail.innerHTML = "";
  dates.forEach((d, idx) => {
    const total = dayTotal(d);
    const burn = dayBurn(d);
    const over = total > getGoal();
    const pct = Math.min(total/getGoal(),1)*100;
    const future = d > todayISO();

    /* If there's a gap before this card (the previous card in the rail isn't
       the calendar day immediately before this one), offer a + to fill it. */
    const prevDay = shiftDate(d, -1);
    const gapBefore = idx > 0 && dates[idx-1] !== prevDay;
    if (gapBefore) {
      const ins = document.createElement("button");
      ins.className = "rail-insert";
      ins.title = "Add " + fmtDay(prevDay);
      ins.textContent = "+";
      ins.onclick = (e) => { e.stopPropagation(); insertDayBefore(d); };
      rail.appendChild(ins);
    }

    const btn = document.createElement("button");
    btn.className = "day-card" + (d===selected ? " active" : "") + (future ? " future" : "");
    btn.innerHTML =
      '<div class="d">'+fmtShort(d)+(future?" ›":"")+'</div>' +
      '<div class="k">'+total.toLocaleString()+'</div>' +
      (burn ? '<div class="burn-tag">−'+burn.toLocaleString()+'</div>' : '') +
      '<div class="bar"><div style="width:'+pct+'%;background:var(--'+(over?"red":"green")+')"></div></div>';
    btn.onclick = () => { selected = d; if (currentTab!=="log") switchTab("log"); render(); };
    if (d === selected) btn.dataset.active = "1";
    rail.appendChild(btn);
  });
  const activeCard = rail.querySelector('[data-active="1"]');
  if (activeCard) activeCard.scrollIntoView({inline:"center", block:"nearest"});
}

/* Create the calendar day immediately before `d` and select it. */
function insertDayBefore(d) {
  const target = shiftDate(d, -1);
  ensureDay(target);
  selected = target;
  try { saveDiary(); } catch(e) {}
  render();
  showToast(null, {ok:true, text:"Added "+fmtDay(target)+" — logging here now."});
}

function scrollRail(dir) {
  const rail = document.getElementById("rail");
  rail.scrollBy({ left: dir * 180, behavior: "smooth" });
}

/* Add the next un-logged day (usually tomorrow, or the day after the furthest
   future day already present) and select it. */
function addFutureDay() {
  const dates = railDates();
  let candidate = todayISO();
  const furthest = dates[dates.length-1];
  candidate = (furthest >= todayISO()) ? shiftDate(furthest, 1) : shiftDate(todayISO(), 1);
  ensureDay(candidate);
  selected = candidate;
  try { saveDiary(); } catch(e) {}
  if (currentTab !== "log") switchTab("log"); else render();
  showToast(null, {ok:true, text:"Added "+fmtDay(candidate)+" — logging here now."});
}

/* Row controls: ‹ shifts the item to the previous day, › to the next, × deletes. */
function rowCtrls(kind, i) {
  return '<div class="ctrls">' +
    '<button class="mv" title="Move to previous day" onclick="moveItem(\''+kind+'\','+i+',-1)">‹</button>' +
    '<button class="mv" title="Move to next day" onclick="moveItem(\''+kind+'\','+i+',1)">›</button>' +
    '<button class="del" title="Remove" onclick="'+(kind==="meal"?"removeMeal":"removeExercise")+'(\''+selected+'\','+i+')">×</button>' +
  '</div>';
}

function renderLog() {
  const v = document.getElementById("view-log");
  const entry = diary[selected] || { meals: [], exercise: [] };
  const exercise = entry.exercise || [];
  const consumed = dayTotal(selected);
  const burned = dayBurn(selected);
  const net = consumed - burned;
  const remaining = getGoal() - consumed;   // exercise does NOT buy back food
  const over = remaining < 0;
  const pct = Math.min(consumed/getGoal(),1)*100;
  const overflowPct = over ? Math.min(((consumed-getGoal())/getGoal())*100,100) : 0;

  let mealsHtml;
  if (!entry.meals || !entry.meals.length) {
    mealsHtml = '<div class="empty">Nothing logged yet. Type what you ate in the bar below.</div>';
  } else {
    mealsHtml = '<div class="meals">' + entry.meals.map((m,i) =>
      '<div class="meal"><div><div class="n">'+esc(m.name)+'</div>' +
      (m.note ? '<div class="note">'+esc(m.note)+'</div>' : '') +
      '</div><div class="right"><span class="k">'+m.kcal.toLocaleString()+'</span>' +
      rowCtrls("meal", i) + '</div></div>'
    ).join("") + '</div>';
  }

  let exHtml = "";
  if (exercise.length) {
    exHtml = '<div class="section-h">Exercise</div>' +
      '<div class="meals">' + exercise.map((m,i) =>
      '<div class="meal"><div><div class="n">'+esc(m.name)+'</div>' +
      (m.note ? '<div class="note">'+esc(m.note)+'</div>' : '') +
      '</div><div class="right"><span class="k" style="color:var(--green)">−'+m.kcal.toLocaleString()+'</span>' +
      rowCtrls("exercise", i) + '</div></div>'
    ).join("") + '</div>';
  }

  const avgAll = averages(loggedDates());
  const avgHtml = avgAll
    ? '<div class="avg-bubble"><div class="avg-l">Average consumed · '+avgAll.days+' logged day'+(avgAll.days===1?"":"s")+'</div>' +
      '<div class="avg-v">'+avgAll.consumed.toLocaleString()+' <span>kcal/day</span></div>' +
      '<div class="avg-sub">net '+avgAll.net.toLocaleString()+' after '+avgAll.burned.toLocaleString()+' avg burned · goal '+getGoal().toLocaleString()+'</div></div>'
    : "";

  v.innerHTML =
    '<div class="day-head"><span class="day-title">'+fmtDay(selected)+'</span>' +
    '<span class="day-frac">'+consumed.toLocaleString()+' / '+getGoal().toLocaleString()+' kcal</span></div>' +
    '<div class="progress"><div style="width:'+(over?100:pct)+'%;background:var(--'+(over?"amber-dim":"green")+')"></div></div>' +
    (over ? '<div class="overflow-bar"><div style="width:'+overflowPct+'%"></div></div>' : '') +
    '<div class="chips">' +
      chip("Consumed", consumed.toLocaleString()) +
      chip("Burned", burned ? "−"+burned.toLocaleString() : "0", burned ? "var(--green)" : undefined) +
      chip("Net", net.toLocaleString(), "var(--amber)") +
      chip(over?"Over by":"Remaining", Math.abs(remaining).toLocaleString(), over?"var(--red)":"var(--green)") +
      chip("Weight", entry.weightKg!=null ? bodyWeightDisplay(entry.weightKg)+" "+getUnits() : "—") +
      chip("Body fat", entry.bodyFatPct!=null ? entry.bodyFatPct+"%" : "—") +
    '</div>' + avgHtml + quickAddBar() + mealsHtml + exHtml +
    '<div class="btn-row" style="margin-top:22px">' +
      '<button class="btn danger" onclick="deleteDay(this)">Delete this whole day</button>' +
    '</div>' +
    '<div class="hint">Deleting a day removes it from your averages and charts entirely — use it for days you didn\u2019t log fully.</div>';
}
function chip(l,v,tone) {
  return '<div class="chip"><div class="l">'+l+'</div><div class="v" style="color:'+(tone||"var(--ink)")+'">'+v+'</div></div>';
}

function removeMeal(date, i) {
  if (!confirm("Remove \"" + diary[date].meals[i].name + "\"?")) return;
  const gone = diary[date].meals.splice(i,1)[0];
  if (gone && gone.id) markDeleted(gone.id);
  try { saveDiary(); showToast(null, {ok:true, text:"Removed & saved."}); }
  catch(e) { showToast(null, {ok:false, text:"Removed on screen but SAVE FAILED: "+e.message}); }
  render();
}
function removeExercise(date, i) {
  if (!confirm("Remove \"" + diary[date].exercise[i].name + "\"?")) return;
  const gone = diary[date].exercise.splice(i,1)[0];
  if (gone && gone.id) markDeleted(gone.id);
  try { saveDiary(); showToast(null, {ok:true, text:"Removed & saved."}); }
  catch(e) { showToast(null, {ok:false, text:"Removed on screen but SAVE FAILED: "+e.message}); }
  render();
}

/* Shift an ISO date by n days. */
function shiftDate(iso, n) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

/* Move a meal or exercise item to the previous/next day. */
function moveItem(kind, i, delta) {
  const list = kind === "meal" ? diary[selected].meals : diary[selected].exercise;
  const item = list[i];
  if (!item) return;
  const target = shiftDate(selected, delta);
  const dest = ensureDay(target);
  list.splice(i, 1);
  /* Treat a move as delete-then-add so the other device doesn't end up with
     the item on both dates. */
  if (item.id) markDeleted(item.id);
  item.id = newId();
  (kind === "meal" ? dest.meals : dest.exercise).push(item);
  try {
    saveDiary();
    showToast(null, {ok:true, text:'"'+item.name+'" moved to '+fmtDay(target)+'.'});
  } catch(e) {
    showToast(null, {ok:false, text:"Moved on screen but SAVE FAILED: "+e.message});
  }
  render();
}

/* Delete an entire day so it stops counting in charts and averages. */
function deleteDay(btn) {
  if (btn.dataset.armed !== "1") {
    btn.dataset.armed = "1";
    btn.textContent = "Tap again to delete " + fmtDay(selected);
    return;
  }
  /* Tombstone the day and everything in it so the deletion syncs. */
  const day = diary[selected];
  const ids = ["DAY:" + selected];
  if (day) {
    (day.meals||[]).forEach(m => { if (m.id) ids.push(m.id); });
    (day.exercise||[]).forEach(m => { if (m.id) ids.push(m.id); });
  }
  const rev = getRevived();
  ids.forEach(id => { delete rev[id]; });
  localStorage.setItem(LS_REVIVED, JSON.stringify(rev));
  markDeleted(ids);
  delete diary[selected];
  const dates = Object.keys(diary).sort();
  selected = dates.length ? (dates.includes(todayISO()) ? todayISO() : dates[dates.length-1]) : todayISO();
  if (!dates.length) ensureDay(selected);
  try { saveDiary(); showToast(null, {ok:true, text:"Day deleted."}); }
  catch(e) { showToast(null, {ok:false, text:"Deleted on screen but SAVE FAILED: "+e.message}); }
  render();
}

/* ---------------- trends ---------------- */
function renderTrends() {
  const v = document.getElementById("view-trends");
  charts.forEach(c=>c.destroy()); charts = [];
  v.innerHTML =
    '<div class="win-btns">' + [[7,"7d"],[30,"30d"],[90,"90d"],[9999,"All"]].map(([w,lbl]) =>
      '<button class="win'+(trendWin===w?" active":"")+'" onclick="setWin('+w+')">'+lbl+'</button>').join("") + '</div>' +
    '<div id="avg-slot"></div>' +
    '<div class="chart-box"><div class="t">Calories vs. goal</div><canvas id="ch-kcal"></canvas></div>' +
    '<div class="chart-box"><div class="t">Weight (kg)</div><div id="ch-weight-wrap"><canvas id="ch-weight"></canvas></div></div>' +
    '<div class="chart-box"><div class="t">Body fat (%)</div><div id="ch-bf-wrap"><canvas id="ch-bf"></canvas></div></div>';

  const cutoff = new Date();
  if (trendWin >= 9999) { cutoff.setFullYear(2000); } // effectively all-time
  else { cutoff.setDate(cutoff.getDate()-trendWin); }
  const winDates = Object.keys(diary).sort().filter(d => new Date(d+"T12:00:00") >= cutoff);
  const rows = winDates
    .map(d => ({ day: fmtShort(d), kcal: dayTotal(d), burn: dayBurn(d), net: dayNet(d),
                 weight: diary[d].weightKg, bf: diary[d].bodyFatPct }));

  const avg = averages(winDates);
  const avgCard = avg
    ? '<div class="avg-bubble"><div class="avg-l">'+(trendWin>=9999?"All-time":trendWin+"-day")+' average · '+avg.days+' logged day'+(avg.days===1?"":"s")+'</div>' +
      '<div class="avg-v">'+avg.consumed.toLocaleString()+' <span>kcal/day consumed</span></div>' +
      '<div class="avg-sub">net '+avg.net.toLocaleString()+' · '+avg.burned.toLocaleString()+' avg burned · goal '+getGoal().toLocaleString()+'</div></div>'
    : '<div class="avg-bubble"><div class="avg-sub">No logged days in this window yet.</div></div>';
  document.getElementById("avg-slot").innerHTML = avgCard;

  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const gridOpts = { color: C("--line") };
  const tickOpts = { color: C("--ink-dim"), font: { family: "monospace", size: 10 } };

  charts.push(new Chart(document.getElementById("ch-kcal"), {
    type: "bar",
    data: { labels: rows.map(r=>r.day), datasets: [
      { label: "Consumed", data: rows.map(r=>r.kcal),
        backgroundColor: rows.map(r=>r.kcal>getGoal()?C("--red"):C("--blue")), borderRadius: 3, stack: "s" },
      { label: "Burned", data: rows.map(r=>r.burn),
        backgroundColor: C("--cyan-soft"), borderRadius: 3, stack: "s" },
      { type:"line", label:"Goal", data: rows.map(()=>getGoal()), borderColor: C("--amber"),
        borderDash:[5,4], pointRadius:0, borderWidth:1.5 },
    ]},
    options: {
      plugins: {
        legend: { display: true, labels: { color: C("--ink-dim"), boxWidth: 10, font: { size: 10 },
          filter: it => it.text !== "Goal" } },
        tooltip: { callbacks: { afterBody: items => {
          const r = rows[items[0].dataIndex];
          return r.burn ? "Net: " + r.net.toLocaleString() + " kcal" : "";
        }}},
      },
      scales: { x:{stacked:true, grid:{display:false}, ticks:tickOpts},
                y:{stacked:true, grid:gridOpts, ticks:tickOpts} }
    }
  }));

  lineChart("ch-weight","ch-weight-wrap", rows.filter(r=>r.weight!=null), "weight", C("--amber"), tickOpts, gridOpts, "No weigh-ins in this window yet.");
  lineChart("ch-bf","ch-bf-wrap", rows.filter(r=>r.bf!=null), "bf", C("--green"), tickOpts, gridOpts, "No body-fat readings yet.");
}
function lineChart(id, wrapId, rows, key, color, tickOpts, gridOpts, emptyMsg) {
  const wrap = document.getElementById(wrapId);
  if (!rows.length) { wrap.innerHTML = '<div class="chart-empty">'+emptyMsg+'</div>'; return; }
  charts.push(new Chart(document.getElementById(id), {
    type: "line",
    data: { labels: rows.map(r=>r.day), datasets: [{ data: rows.map(r=>r[key]), borderColor: color, backgroundColor: color, pointRadius: 4, borderWidth: 2.5, tension: .3 }]},
    options: { plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false},ticks:tickOpts}, y:{grid:gridOpts,ticks:tickOpts} } }
  }));
}
function setWin(w){ trendWin = w; renderTrends(); }
